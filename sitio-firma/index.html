    if (cambios) h += '<div class="c" id="pedido"><div class="nota">' + rellena(T.mod_pend, { f: fecha(cambios.at) }) + (cambios.texto ? '<div class="cita"><b>' + T.su_coment + '</b>' + esc(cambios.texto) + '</div>' : '') + '</div></div>';
    h += '<div class="c">' + secciones.map(function (s) { return '<h2>' + esc(s.nombre) + '</h2>' + s.lineas.map(function (l) { return '<div class="l"><span class="p">' + eur(l.precio_venta) + '</span><div class="n">' + esc(l.descripcion) + '</div>' + detalle(l.detalle_tecnico) + '<div class="q">' + esc(l.cantidad) + ' ' + esc(l.unidad || 'ud') + ' × ' + eur(l.precio_tarifa) + (Number(l.dto_linea_pct) ? ' · −' + esc(l.dto_linea_pct) + ' %' : '') + '</div></div>'; }).join(''); }).join('')
      + '<div style="margin-top:14px">' + (d.totales.dto_global_pct ? '<div class="t"><span>' + T.suma + '</span><span>' + eur(d.totales.bruto) + '</span></div><div class="t"><span>' + T.dto + ' ' + esc(d.totales.dto_global_pct) + ' %</span><span>−' + eur(d.totales.bruto - d.totales.base) + '</span></div>' : '')
      + '<div class="t"><span>' + T.base + '</span><span>' + eur(d.totales.base) + '</span></div><div class="t"><span>' + T.iva + '</span><span>' + eur(d.totales.iva) + '</span></div><div class="t big"><span>' + T.total + '</span><span>' + eur(d.totales.total) + '</span></div></div>'
      + (d.observaciones ? '<div class="obs"><b>' + (T.obs || 'Observaciones') + '</b>' + esc(d.observaciones) + '</div>' : '')
      + '<small class="cond">' + esc(d.condiciones || '') + '</small></div>';
    if (!firmado && !rechazado) h += '<div class="c" id="aceptar"><h1 style="font-size:20px">' + T.aceptar + '</h1><div class="sub">' + T.como + '</div>'
      + '<input class="inp" id="nombre" placeholder="' + T.nombre + '" autocomplete="name"><input class="inp" id="dni" placeholder="' + T.dni + '" autocomplete="off">'
      + '<div class="firma"><canvas id="cv"></canvas><div class="ph" id="ph">' + T.firme + '</div></div><a class="lnk" href="#" id="borrar" style="font-weight:400;font-size:13px">' + T.borrar + '</a>'
      + '<label style="display:block;margin-top:14px;font-size:14px"><input type="checkbox" id="acepto"> ' + T.leido + '</label>'
      + '<button class="btn" id="btn">' + T.btn + '</button><div class="err" id="err"></div>'
      + '<div class="otra" id="otra"><div class="q">' + T.otra + '</div><div class="dos"><button class="b2" id="b-vis">' + T.vis_btn + '</button><button class="b2" id="b-tmp">' + T.tmp_btn + '</button><button class="b2" id="b-mod">' + T.mod_btn + '</button><button class="b2 rojo" id="b-rech">' + T.rech_btn + '</button></div></div></div>'
      + '<div class="c" id="resp" hidden></div>';
    app.innerHTML = h;
    if (firmado || rechazado) return;
    // Pedir una segunda visita, más tiempo, cambios o rechazar: un cuadro para escribir y un botón.
    // Lo recibe quien mandó el presupuesto. Solo en «cambios» es obligatorio escribir algo.
    var resp = document.getElementById('resp');
    function abrirResp(tipo) {
      var mod = tipo === 'modificacion', rech = tipo === 'rechazo';
      var X = tipo === 'visita' ? { tit: T.vis_tit, como: T.vis_como, ph: T.vis_ph, enviar: T.vis_enviar, hecho: T.vis_hecho }
        : tipo === 'tiempo' ? { tit: T.tmp_tit, como: T.tmp_como, ph: T.tmp_ph, enviar: T.tmp_enviar, hecho: T.tmp_hecho }
        : mod ? { tit: T.mod_tit, como: T.mod_como, ph: T.mod_ph, enviar: T.mod_enviar, hecho: T.mod_hecho }
        : { tit: T.rech_tit, como: T.rech_como, ph: T.rech_ph, enviar: T.rech_enviar, hecho: T.rech_hecho };
      resp.innerHTML = '<h1 style="font-size:20px">' + X.tit + '</h1><div class="sub">' + X.como + '</div>'
        + '<textarea class="inp" id="r-txt" maxlength="2000" placeholder="' + X.ph + '"></textarea>'
        + '<button class="btn' + (rech ? ' rojo' : '') + '" id="r-ok">' + X.enviar + '</button><button class="btn gris" id="r-no">' + T.cancelar + '</button><div class="err" id="r-err"></div>';
      resp.hidden = false; document.getElementById('aceptar').hidden = true;
      var ta = document.getElementById('r-txt'); try { ta.focus(); } catch (_) {}
      resp.scrollIntoView({ block: 'start', behavior: 'smooth' });
      document.getElementById('r-no').addEventListener('click', function () { resp.hidden = true; resp.innerHTML = ''; document.getElementById('aceptar').hidden = false; });
      document.getElementById('r-ok').addEventListener('click', function () {
        var er = document.getElementById('r-err'); er.textContent = '';
        var texto = ta.value.trim();
        if (mod && texto.length < 5) { er.textContent = T.e_mod; return; }
        var bo = document.getElementById('r-ok'); bo.disabled = true; bo.textContent = T.enviando;
        fetch(FUNC, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'responder', t: t, tipo: tipo, comentario: texto }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (x) {
            if (!x.ok) throw new Error(x.j.codigo === 'ya_aceptado' ? T.e_ya : x.j.codigo === 'falta_comentario' ? T.e_mod : (x.j.error || 'error'));
            var viejo = document.getElementById('pedido'); if (viejo) viejo.parentNode.removeChild(viejo);
            if (!rech) {
              // Sigue pudiendo aceptar esta versión si al final la prefiere.
              resp.innerHTML = '<div class="nota">' + X.hecho + (texto ? '<div class="cita"><b>' + T.su_coment + '</b>' + esc(texto) + '</div>' : '') + '</div>';
              document.getElementById('aceptar').hidden = false;
            } else {
              resp.innerHTML = '<div class="nota gris">' + T.rech_hecho + '</div>';
              var ac = document.getElementById('aceptar'); ac.parentNode.removeChild(ac);
            }
            resp.scrollIntoView({ block: 'center', behavior: 'smooth' });
          })
          .catch(function (e) { er.textContent = (e.message === T.e_ya || e.message === T.e_mod ? '' : T.e_envio) + e.message; bo.disabled = false; bo.textContent = X.enviar; });
      });
    }
    document.getElementById('b-vis').addEventListener('click', function () { abrirResp('visita'); });
    document.getElementById('b-tmp').addEventListener('click', function () { abrirResp('tiempo'); });
    document.getElementById('b-mod').addEventListener('click', function () { abrirResp('modificacion'); });
    document.getElementById('b-rech').addEventListener('click', function () { abrirResp('rechazo'); });
    // Viene de un botón del aviso de vencimiento (?r=visita, tiempo o no): se abre ya su respuesta.
    // Nada se apunta hasta que la confirma aquí.
    var rq = new URLSearchParams(location.search).get('r');
    if (rq === 'visita' || rq === 'tiempo') abrirResp(rq); else if (rq === 'no') abrirResp('rechazo');
    var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), ph = document.getElementById('ph'), hay = false, dib = false;
    function tam() { var r = cv.getBoundingClientRect(); cv.width = Math.round(r.width * 2); cv.height = Math.round(r.height * 2); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14170f'; }
    tam(); window.addEventListener('resize', tam);
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height)]; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); dib = true; cv.setPointerCapture(e.pointerId); var q = pos(e); ctx.beginPath(); ctx.moveTo(q[0], q[1]); });
    cv.addEventListener('pointermove', function (e) { if (!dib) return; e.preventDefault(); var q = pos(e); ctx.lineTo(q[0], q[1]); ctx.stroke(); hay = true; ph.style.display = 'none'; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { dib = false; }); });
    document.getElementById('borrar').addEventListener('click', function (e) { e.preventDefault(); ctx.clearRect(0, 0, cv.width, cv.height); hay = false; ph.style.display = ''; });
    document.getElementById('btn').addEventListener('click', function () {
      var err = document.getElementById('err'); err.textContent = '';
      var nombre = document.getElementById('nombre').value.trim();
      if (nombre.length < 3) { err.textContent = T.e_nombre; return; }
      var dni = document.getElementById('dni').value.trim().toUpperCase().replace(/[\s.-]/g, '');
      // En español, DNI/NIE/CIF; en otro idioma vale también un pasaporte o documento extranjero (5 a 20 letras y cifras).
      var dniBien = /^([XYZ]?\d{7,8}[A-Z])$/.test(dni) || /^[A-Z]\d{7}[A-Z0-9]$/.test(dni) || (idioma !== 'es' && /^[A-Z0-9]{5,20}$/.test(dni));
      if (!dniBien) { err.textContent = T.e_dni; return; }
      if (!hay) { err.textContent = T.e_firma; return; }
      if (!document.getElementById('acepto').checked) { err.textContent = T.e_casilla; return; }
      var b = document.getElementById('btn'); b.disabled = true; b.textContent = T.enviando;
      fetch(FUNC, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'firmar', t: t, nombre: nombre, dni: dni, firma: cv.toDataURL('image/png') }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) { if (!x.ok) throw new Error(x.j.error || 'error'); document.getElementById('aceptar').innerHTML = '<div class="ok">' + rellena(T.hecho, { n: esc(nombre) }) + '</div>'; window.scrollTo(0, 0); })
        .catch(function (e) { err.textContent = T.e_envio + e.message; b.disabled = false; b.textContent = T.btn; });
    });
  }
})();
</script>
</body>
</html>
