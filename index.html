<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sysefen · Control Horario y Partes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14170f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sysefen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14170f; --papel:#f5f4ef; --blanco:#fff;
  --verde:#206028; --verde-c:#3d8f4a; --verde-o:#164a1d;
  --ambar:#c98a24; --ambar-o:#7d5410;
  --rojo:#a8402a; --rojo-cl:#f7eae6;
  --l1:rgba(20,23,15,.07); --l2:rgba(20,23,15,.14);
  --t2:rgba(20,23,15,.56); --t3:rgba(20,23,15,.42);
  --sh:0 2px 8px rgba(20,23,15,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --sans:'Barlow',system-ui,-apple-system,sans-serif;
  --cond:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:16px}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit;background:none;border:none;outline:none}
textarea{resize:none}
::placeholder{color:rgba(20,23,15,.3)}
a{color:var(--verde-o);text-decoration:none}
a:hover{color:var(--tinta)}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:18px 20px}
.pb-nav{padding-bottom:calc(96px + var(--safe-b))}

.mono{font-family:var(--mono)}
.lbl{font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(20,23,15,.45)}
.h1{font:600 30px/1 var(--cond)}
.h2{font:600 19px/1.15 var(--sans)}
.num{font-family:var(--cond);font-weight:600}
.sub{font:400 13px/1.4 var(--sans);color:var(--t2)}
.tiny{font:400 11px/1.3 var(--mono);color:var(--t3)}

.card{background:var(--blanco);border-radius:18px;padding:15px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:11px}
.col{display:flex;flex-direction:column}
.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:block;width:100%;text-align:center;font:700 17px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:18px;border-radius:99px;cursor:pointer;background:var(--tinta);color:#fff}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:rgba(20,23,15,.11);color:rgba(20,23,15,.4)}
.btn-verde{background:var(--verde)}
.btn-rojo{background:var(--rojo)}
.btn-gris{background:rgba(20,23,15,.06);color:var(--tinta);font-weight:600;font-family:var(--sans);font-size:14px;letter-spacing:0;text-transform:none}
.pill{font:600 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:10px 12px;border-radius:99px;cursor:pointer;background:rgba(20,23,15,.06);color:var(--tinta);border:none;white-space:nowrap}
.pill-verde{background:var(--verde);color:#fff}
.pill-rojo{background:var(--rojo-cl);color:var(--rojo)}
.chip{font:500 13px/1 var(--sans);padding:10px 13px;border-radius:99px;cursor:pointer;background:#fff;color:var(--t2);border:1px solid var(--l2)}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip.alerta{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.chip.ok{background:var(--verde);color:#fff;border-color:var(--verde)}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.inp{width:100%;background:#fff;border:1px solid var(--l2);border-radius:14px;padding:14px}
.inp-lg{font:600 22px var(--cond)}
.dot{width:9px;height:9px;border-radius:99px;flex:none}
.badge{font:600 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:99px;flex:none}
.av{border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--sans)}
.sw{width:44px;height:26px;border-radius:99px;flex:none;padding:3px;display:flex;transition:.15s}
.sw i{width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.hr{height:1px;background:var(--l2);margin:14px 0}
.stat{flex:1;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font:600 26px/1 var(--cond);margin-top:8px}

.hdr{flex:none;background:#fff;border-bottom:1px solid var(--l1);padding:calc(14px + var(--safe-t)) 20px 14px}
.hdr-dark{flex:none;background:var(--tinta);color:#fff;padding:calc(14px + var(--safe-t)) 20px 18px}
.hdr-dark .back{font:500 13px/1 var(--sans);color:rgba(255,255,255,.5);cursor:pointer;display:inline-block;padding:4px 0 10px}
.semaforo{flex:none;padding:calc(18px + var(--safe-t)) 22px 26px;transition:background .25s}
.hoja{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--papel);border-radius:26px 26px 0 0;margin-top:-16px;padding:22px 20px calc(100px + var(--safe-b))}

.nav{flex:none;display:flex;align-items:flex-start;padding:10px 6px calc(6px + var(--safe-b));background:rgba(252,251,249,.97);border-top:1px solid rgba(20,23,15,.08);backdrop-filter:blur(12px)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:3px 0;color:rgba(20,23,15,.32)}
.nav div.on{color:var(--tinta)}
.nav i{width:20px;height:20px;background:currentColor;display:block}
.nav span{font:500 10px/1 var(--sans)}
.pasos{display:flex;gap:5px;margin-top:14px}
.pasos i{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.18)}
.pasos i.on{background:var(--verde-c)}

.sheet{position:fixed;inset:0;background:rgba(20,23,15,.55);display:flex;align-items:flex-end;padding:20px;padding-bottom:calc(20px + var(--safe-b));z-index:50;animation:fade .15s}
.sheet>div{width:100%;background:#fff;border-radius:26px;padding:24px 22px 22px;animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(18px)}}
.toast{position:fixed;left:20px;right:20px;bottom:calc(100px + var(--safe-b));background:var(--tinta);color:#fff;padding:14px 16px;border-radius:14px;font:500 14px/1.4 var(--sans);z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:up .2s}
.offline{flex:none;background:var(--ambar);color:var(--tinta);font:500 12px/1 var(--sans);text-align:center;padding:7px}

#firma{width:100%;height:190px;display:block;border-radius:10px;touch-action:none}
.firma-box{background:#fff;border:1.5px solid var(--l2);border-radius:18px;padding:10px;position:relative;box-shadow:var(--sh)}
.firma-box .ph{position:absolute;left:0;right:0;bottom:44px;text-align:center;pointer-events:none;font:400 13px var(--sans);color:rgba(20,23,15,.3)}
.firma-box .linea{position:absolute;left:34px;right:34px;bottom:38px;height:1px;background:var(--l2);pointer-events:none}

.docu{background:#fff;border-radius:8px;padding:20px;box-shadow:0 6px 18px rgba(20,23,15,.08)}
.docu .fila{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font:400 13px var(--sans);color:rgba(20,23,15,.78)}
.docu .fila span{font-family:var(--mono);font-size:12px;white-space:nowrap}
.docu .tot{display:flex;justify-content:space-between;padding-top:9px;margin-top:7px;border-top:1px solid var(--l2);font:600 14px var(--sans)}

.bar{display:flex;gap:3px;height:34px;align-items:flex-end;margin-top:14px}
.bar i{flex:1;border-radius:3px 3px 0 0;background:var(--verde-c)}
.bar i.off{background:rgba(20,23,15,.13)}
.prog{height:6px;border-radius:99px;background:rgba(20,23,15,.07);margin-top:8px;overflow:hidden}
.prog i{display:block;height:6px;border-radius:99px;background:var(--verde-c)}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.pin-pad button{height:62px;border-radius:16px;font:500 25px var(--sans);color:#fff;background:rgba(255,255,255,.1)}
.pin-pad button:active{background:rgba(255,255,255,.2)}
.pin-pad button.plain{background:none;font-size:20px;color:rgba(255,255,255,.55)}
.pin-dots{display:flex;gap:14px;margin-top:26px;justify-content:center}
.pin-dots i{width:14px;height:14px;border-radius:99px;background:rgba(255,255,255,.22)}
.pin-dots i.on{background:#fff}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.adj{background:#fff;border-radius:14px;padding:12px 13px;box-shadow:var(--sh)}
.adj .tipo{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font:600 9px var(--mono)}
.dash{text-align:center;font:500 13px var(--sans);padding:14px;border-radius:14px;border:1.5px dashed rgba(20,23,15,.22);color:var(--t2);cursor:pointer;flex:1}

#print{display:none}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #app,.toast,.sheet{display:none!important}
  #print{display:block;padding:0}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>

<script>
'use strict';
const KEY = 'ch_v1';
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- datos iniciales ---------- */
function semilla() {
  return {
    v: 1,
    empresa: 'Sysefen',
    cif: '',
    emailCopia: '',
    opts: { gps: true, recordatorio: true, importesOperario: false },
    users: [
      { id: 'u1', nombre: 'Bayron', rol: 'jefe', pin: '1111' },
      { id: 'u2', nombre: 'Jaime', rol: 'jefe', pin: '2222' },
      { id: 'u3', nombre: 'David', rol: 'operario', pin: '3333' },
      { id: 'u4', nombre: 'Ale', rol: 'operario', pin: '4444' },
      { id: 'u0', nombre: 'Administración', rol: 'admin', pin: '9999' },
    ],
    obras: [],
    fichajes: [],
    partes: [],
    seq: 1,
    obraActiva: null,
    bienvenida: true,
  };
}
let S = cargar();
function cargar() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return semilla();
    const d = JSON.parse(raw);
    return Object.assign(semilla(), d);
  } catch (e) { return semilla(); }
}
let guardando = null;
function save() {
  clearTimeout(guardando);
  guardando = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch (e) { toast('No hay espacio en el móvil. Borra algún adjunto antiguo.'); }
  }, 120);
}

/* ---------- sesión / vista ---------- */
let V = { view: 'login', pinUser: null, pin: '', err: false, obraId: null, tabHoras: 'empleado', sheet: null, draft: null, verParte: null, user: null };
try { const u = sessionStorage.getItem('ch_user'); if (u) V.user = JSON.parse(u); } catch (e) {}
if (V.user) V.view = 'hoy';

const yo = () => (V.user ? S.users.find((u) => u.id === V.user.id) : null);
const rol = () => { const u = yo(); return u ? u.rol : null; };
const esAdmin = () => rol() === 'admin';
const puedeCrear = () => ['admin', 'jefe'].includes(rol());
const equipo = () => S.users.filter((u) => u.rol !== 'admin');
const userById = (id) => S.users.find((u) => u.id === id) || { nombre: '—' };
const ini = (n) => n.trim().slice(0, 1).toUpperCase();

/* ---------- tiempo ---------- */
const hoyISO = () => new Date().toISOString().slice(0, 10);
const hhmm = (iso) => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmtH = (h) => Math.floor(h) + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');
const cuarto = (h) => Math.max(0, Math.min(16, Math.round(h * 4) / 4));
function fechaLarga(iso) {
  const d = iso ? new Date(iso + 'T12:00') : new Date();
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}
function fechaCorta(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
}
function durMin(min) { return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); }
function minEntre(a, b) { return Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)); }

const fichajeAbierto = (uid_) => S.fichajes.find((f) => f.userId === uid_ && !f.salida);
function minutosDia(uid_, dia) {
  return S.fichajes.filter((f) => f.userId === uid_ && f.entrada.slice(0, 10) === dia)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida || new Date().toISOString()), 0);
}
function minutosSemana(uid_) {
  const hoy = new Date(); const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7)); lunes.setHours(0, 0, 0, 0);
  return S.fichajes.filter((f) => f.userId === uid_ && new Date(f.entrada) >= lunes)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida || new Date().toISOString()), 0);
}
function minutosObra(obraId, uid_) {
  return S.fichajes.filter((f) => f.obraId === obraId && (!uid_ || f.userId === uid_) && f.salida)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida), 0);
}
function minutosMes(uid_) {
  const m = hoyISO().slice(0, 7);
  return S.fichajes.filter((f) => f.userId === uid_ && f.entrada.slice(0, 7) === m)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida || new Date().toISOString()), 0);
}

/* ---------- acciones ---------- */
const A = {};
A.elegirUser = (id) => { V.pinUser = S.users.find((u) => u.id === id); V.pin = ''; V.view = 'pin'; render(); };
A.volverLogin = () => { V.pinUser = null; V.pin = ''; V.view = 'login'; render(); };
A.pinTecla = (k) => {
  if (k === 'del') { V.pin = V.pin.slice(0, -1); return render(); }
  V.pin = (V.pin + k).slice(0, 4);
  if (V.pin.length === 4) {
    if (V.pin === V.pinUser.pin) {
      V.user = { id: V.pinUser.id };
      try { sessionStorage.setItem('ch_user', JSON.stringify(V.user)); } catch (e) {}
      V.pinUser = null; V.pin = ''; V.view = 'hoy';
      if (S.bienvenida) { S.bienvenida = false; save(); }
    } else { V.err = true; V.pin = ''; setTimeout(() => { V.err = false; render(); }, 400); }
  }
  render();
};
A.salir = () => { V.user = null; try { sessionStorage.removeItem('ch_user'); } catch (e) {} V.view = 'login'; render(); };
A.ir = (v) => { V.view = v; render(); };
A.verObra = (id) => { V.obraId = id; V.view = 'obra'; render(); };
A.activarObra = () => { S.obraActiva = V.obraId; save(); toast('Obra de hoy: ' + obraById(V.obraId).cliente); V.view = 'hoy'; render(); };
A.tabHoras = (t) => { V.tabHoras = t; render(); };

const obraById = (id) => S.obras.find((o) => o.id === id) || null;

A.pedirFichaje = (userId) => {
  const u = userById(userId);
  const f = fichajeAbierto(userId);
  if (!f && !S.obraActiva && !S.obras.length) { toast('Crea primero una obra para poder fichar.'); return; }
  V.sheet = { tipo: 'fichaje', userId, salida: !!f, propio: userId === V.user.id };
  render();
};
A.cerrarSheet = () => { V.sheet = null; render(); };
A.confirmarFichaje = () => {
  const { userId, salida } = V.sheet;
  const ahora = new Date().toISOString();
  if (salida) {
    const f = fichajeAbierto(userId);
    if (f) { f.salida = ahora; f.cerradoPor = V.user.id; }
    toast(userById(userId).nombre + ' — salida ' + hhmm(ahora));
  } else {
    const obraId = S.obraActiva || (S.obras[0] && S.obras[0].id);
    S.fichajes.push({ id: uid(), userId, obraId, entrada: ahora, salida: null, abiertoPor: V.user.id });
    toast(userById(userId).nombre + ' — entrada ' + hhmm(ahora));
  }
  save(); V.sheet = null; render();
};

/* alta de obra */
A.nuevaObra = () => { V.draft = { cliente: '', dir: '', tipo: '', contacto: '', email: '', equipo: equipo().map((u) => u.id) }; V.view = 'alta'; render(); };
A.editarObra = (id) => { const o = obraById(id); V.draft = Object.assign({}, o, { equipo: o.equipo.slice() }); V.view = 'alta'; render(); };
A.guardarObra = () => {
  const d = V.draft;
  if (!d.cliente.trim()) { toast('Pon al menos el nombre del cliente.'); return; }
  if (d.id) { Object.assign(obraById(d.id), d); }
  else { const o = Object.assign({ id: uid(), estado: 'En curso' }, d); S.obras.push(o); if (!S.obraActiva) S.obraActiva = o.id; }
  save(); V.draft = null; V.view = 'obras'; toast('Obra guardada'); render();
};
A.toggleEquipoAlta = (id) => {
  const e = V.draft.equipo;
  const i = e.indexOf(id); i < 0 ? e.push(id) : e.splice(i, 1);
  render();
};
A.cerrarObra = (id) => { const o = obraById(id); o.estado = o.estado === 'Cerrada' ? 'En curso' : 'Cerrada'; save(); render(); };

/* parte */
A.nuevoParte = (obraId) => {
  const oid = obraId || S.obraActiva || (S.obras[0] && S.obras[0].id);
  if (!oid) { toast('Crea primero una obra.'); return; }
  const o = obraById(oid);
  const horas = {};
  o.equipo.forEach((id) => {
    const m = minutosDia(id, hoyISO());
    horas[id] = m > 0 ? cuarto(m / 60) : 0;
  });
  V.draft = {
    id: uid(), obraId: oid, fecha: hoyISO(), autorId: V.user.id,
    desc: '', horas, incluidos: Object.keys(horas).filter((k) => horas[k] > 0),
    mats: [], nivel: 'Sin incidencias', inc: '', adjuntos: [],
    importe: '', obs: '', firmante: '', firma: null, email: o.email || '',
  };
  if (!V.draft.incluidos.length) V.draft.incluidos = o.equipo.slice();
  V.view = 'p1'; render();
};
A.pcampo = (k, val) => { V.draft[k] = val; };
A.togglePersona = (id) => {
  const inc = V.draft.incluidos; const i = inc.indexOf(id);
  i < 0 ? inc.push(id) : inc.splice(i, 1); render();
};
A.horaMas = (id) => { V.draft.horas[id] = cuarto((V.draft.horas[id] || 0) + 0.25); if (!V.draft.incluidos.includes(id)) V.draft.incluidos.push(id); render(); };
A.horaMenos = (id) => { V.draft.horas[id] = cuarto((V.draft.horas[id] || 0) - 0.25); render(); };
A.addMat = (nombre) => { V.draft.mats.push({ id: uid(), nombre: nombre || '', cant: '', importe: '', compra: true }); render(); };
A.quitarMat = (id) => { V.draft.mats = V.draft.mats.filter((m) => m.id !== id); render(); };
A.toggleCompra = (id) => { const m = V.draft.mats.find((x) => x.id === id); m.compra = !m.compra; render(); };
A.nivel = (n) => { V.draft.nivel = n; render(); };
A.quitarAdj = (id) => { V.draft.adjuntos = V.draft.adjuntos.filter((a) => a.id !== id); render(); };
A.pedirArchivo = (soloFoto) => {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.multiple = true;
  if (soloFoto) { inp.accept = 'image/*'; inp.capture = 'environment'; }
  inp.onchange = () => { [...inp.files].forEach(añadirArchivo); };
  inp.click();
};
async function añadirArchivo(file) {
  try {
    const esImg = /^image\//.test(file.type);
    const data = esImg ? await comprimir(file) : await leerDataURL(file);
    const peso = data.length * 0.75;
    if (peso > 1.6e6 && !esImg) { toast('El archivo es muy grande (máx ~1,5 MB).'); return; }
    V.draft.adjuntos.push({
      id: uid(), nombre: file.name || 'foto.jpg',

const leerDataURL = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
async function comprimir(file) {
  const url = await leerDataURL(file);
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const max = 1100;
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => res(url);
    img.src = url;
  });
}

    ? (puedeCrear() ? equipo() : [yo()]).map((u) => ({
        nombre: u.nombre, total: durMin(minutosMes(u.id)),

        barras: dias.map((d) => minutosDia(u.id, d)), pie: 'Últimos 12 días',
      }))
    : S.obras.map((o) => ({
        nombre: o.cliente, total: durMin(minutosObra(o.id)),

function montarFirma() {
  const c = $('#firma'); if (!c) return;
  const ctx = c.getContext('2d');
  const r = c.getBoundingClientRect();
  c.width = Math.round(r.width * 2); c.height = 380;
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14170f';
  if (V.draft.firma) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height); img.src = V.draft.firma; }
  let dib = false, movido = false;
  const pos = (e) => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * (c.width / b.width), (e.clientY - b.top) * (c.height / b.height)]; };
  c.addEventListener('pointerdown', (e) => { e.preventDefault(); dib = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  c.addEventListener('pointermove', (e) => { if (!dib) return; e.preventDefault(); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); movido = true; });
  const fin = () => {
    if (!dib) return; dib = false;
    if (movido) { V.draft.firma = c.toDataURL('image/png'); const b = $('.btn[data-a="aPaso"]'); if (b) { b.removeAttribute('disabled'); b.textContent = 'Revisar y enviar'; } const ph = document.querySelector('.firma-box .ph'); if (ph) ph.remove(); }
  };
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin); c.addEventListener('pointerleave', fin);
}

document.addEventListener('input', (e) => {
  const t = e.target;
  const f = t.dataset.f, fm = t.dataset.fm;
  if (fm) {
    const [id, k] = fm.split(':');
    const m = V.draft.mats.find((x) => x.id === id); if (m) m[k] = t.value;
    return;
  }
  if (!f) return;
  if (f === 'sheetVal') { V.sheet.val = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'sheetNombre') { V.sheet.nombre = t.value; return; }
  if (f === 'sheetPin') { V.sheet.pin = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (['empresa', 'cif', 'emailCopia'].includes(f)) { S[f] = t.value; save(); return; }
  if (V.view === 'alta') { V.draft[f] = t.value; return; }
  if (V.draft) V.draft[f] = t.value;
});
window.addEventListener('online', render);
window.addEventListener('offline', render);

let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; });

setInterval(() => { if (V.user && V.view === 'hoy' && !V.sheet) render(); }, 30000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
render();
