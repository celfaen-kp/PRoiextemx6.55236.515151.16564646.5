/* ---------- números ---------- */
// "2.100", "9,5" y "120" tienen que llegar a la base como números.
function numeroVisita(v, entero) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  if (!Number.isFinite(n)) return null;
  return entero ? Math.round(n) : n;
}
function normalizarDatos(esquema, datos) {
  const out = Object.assign({}, datos);
  delete out._tocados;
  for (const sec of esquema.secciones) {
    for (const c of sec.campos) {
      if (c.tipo === 'numero' || c.tipo === 'entero') out[c.key] = numeroVisita(out[c.key], c.tipo === 'entero');
      if (c.tipo === 'lista' && Array.isArray(out[c.key])) {
        out[c.key] = out[c.key].map((f) => {
          const g = Object.assign({}, f);
          (c.subcampos || []).forEach((s) => {
            if (s.tipo === 'numero' || s.tipo === 'entero') g[s.key] = numeroVisita(g[s.key], s.tipo === 'entero');
          });
          return g;
        });
      }
    }
  }
  return out;
}

function faltanVisita() {
  const d = V.visitaDraft; const out = [];
  if (!d) return out;
  if (!d._cliente || !String(d._cliente.nombre || '').trim()) out.push('Cliente');
  vSchemas.loQueFalta(vSchemas.COMUN, d).forEach((x) => out.push('Inmueble: ' + x.campo));
  const cats = d.categorias || [];
  if (!cats.length) out.push('Elegir al menos una categoría');
  cats.forEach((c) => vSchemas.loQueFalta(vSchemas.ESQUEMAS[c], (V.visitaFichas[c] || {}).datos)
    .forEach((x) => out.push(nombreCat(c) + ': ' + x.campo)));
  return out;
}

function fotoSrc(c, key, adjuntos = V.visitaAdjuntos) {

  return adj ? (V.visitaFotoUrls[adj.storage_path] || 'pendiente') : null;
}

}

// Guardar (borrador o cerrada)
A.guardarVisita = async (completar, trasGuardar) => {
  const d = V.visitaDraft; if (!d || V.visitaBusy) return;
  const cats = d.categorias || [];
  if (completar) {
    const faltan = faltanVisita();
    if (faltan.length) { avisar('Falta: ' + faltan.join(' · ')); return; }
  }
  if (!navigator.onLine) {
    guardarBorradorVisita();
    avisar('Sin conexión. La visita queda en el móvil: guárdala cuando haya cobertura.');
    return;
  }
  V.visitaBusy = true; render();
  try {
    const cli = d._cliente;
    if (cli && cli.nuevo && !cli.id && String(cli.nombre || '').trim()) {
      const creado = await visitasDB.crearClienteLocal(Object.assign({}, cli, { nombre: cli.nombre.trim() }));
      cli.id = creado.id; guardarBorradorVisita();
    }
    const comun = normalizarDatos(vSchemas.COMUN, d);
    const fila = {
      id: d.id,
      fecha_visita: d.fecha_visita || hoyISO(),
      cliente_id: (cli && cli.id) || null,
      estado: completar ? 'completada' : 'borrador',
      sync_estado: 'pendiente',
      sync_error: null,
    };
    CAMPOS_COMUN.forEach((c) => {
      let v = comun[c.key];
      if (c.tipo === 'bool') v = v === true;
      else if (v === '' || v === undefined) v = null;
      fila[c.key] = v;
    });
    if (d.cita_id) fila.cita_id = d.cita_id;
    const guardada = await visitasDB.guardarOCrearVisita(fila);
    d.codigo = guardada.codigo;

    for (const c of cats) {
      const f = V.visitaFichas[c] || { datos: {} };
      const esq = vSchemas.ESQUEMAS[c];
      await visitasDB.guardarFicha(d.id, c, normalizarDatos(esq, f.datos), vSchemas.VERSION, !vSchemas.loQueFalta(esq, f.datos).length);
    }
    for (const c of (d._catsGuardadas || [])) {
      if (!cats.includes(c)) await visitasDB.quitarFicha(d.id, c);
    }
    d._catsGuardadas = cats.slice();
    guardarBorradorVisita();

    // Las fotos van una a una y se quitan del borrador según suben: si falla
    // la quinta, las cuatro primeras no se vuelven a subir.
    for (const c of Object.keys(V.visitaFotos)) {
      if (!cats.includes(c)) continue;
      for (const key of Object.keys(V.visitaFotos[c])) {
        const etiqueta = (fotosDeCat(c).find((x) => x.key === key) || {}).etiqueta || key;
        const adj = await visitasDB.subirFoto(d.id, { dataURL: V.visitaFotos[c][key], categoria: c, campoRef: c + '.' + key, descripcion: etiqueta });
        V.visitaAdjuntos.push(adj);
        delete V.visitaFotos[c][key];
        guardarBorradorVisita();
      }
    }

    // La cita de la que salió queda como visitada.
    if (d.cita_id) {
      try { await visitasDB.guardarCita({ id: d.cita_id, estado: 'visitada', visita_id: d.id }); } catch (e) { /* la visita ya está guardada */ }
      A.cargarAgenda();
    }
    limpiarBorradorVisita();
    V.visitaBusy = false;
    if (typeof trasGuardar === 'function') { toast('Visita guardada como borrador.'); A.cargarVisitas(); return trasGuardar(); }
    toast(completar ? 'Visita cerrada. Ya se puede enviar a Teamleader.' : 'Guardada. La sigues cuando quieras.');
    if (completar) { A.cargarVisitas(); await A.verVisita(guardada.id); return subirVisitaDrive(); }
    V.view = esPresupuestos() ? 'agenda' : 'visitas'; render(); A.cargarVisitas();
  } catch (e) {
    V.visitaBusy = false; guardarBorradorVisita(); render();
    avisar('No se pudo guardar: ' + msgError(e) + '. La visita sigue en el móvil.');
  }
};

A.abrirVisita = (id) => {

A.editarVisita = async (id) => {
  if (leerBorradorVisita()) { toast('Primero termina o descarta la visita que tienes a medias.'); return; }

  V.visitaBusy = true; render();
  try {

      : null;
    delete d.cliente;
    Object.keys(d).forEach((k) => { if (d[k] != null && CAMPOS_COMUN.some((c) => c.key === k)) d._tocados[k] = true; });
    V.visitaDraft = d;
    V.visitaFichas = {};
    fichas.forEach((f) => {
      const tocados = {};
      Object.keys(f.datos || {}).forEach((k) => { if (f.datos[k] != null) tocados[k] = true; });
      V.visitaFichas[f.categoria] = { datos: f.datos || {}, tocados };

    V.visitaFotos = {}; V.visitaAdjuntos = adjuntos || [];
    V.visitaPaso = cats.length ? 4 : 1; V.visitaCat = null;
    guardarBorradorVisita();
    V.visitaBusy = false;
    irVisitaPaso();
    cargarUrlsFotos(V.visitaAdjuntos);
  } catch (e) {

A.verVisita = async (id) => {

A.enviarVisita = async () => {

/**

A.exportarVisitasCSV = () => {
  const lista = V.visitas || [];
  if (!lista.length) { avisar('No hay visitas que exportar.'); return; }
  const si = (b) => (b ? 'Sí' : 'No');
  const filas = [[
    'Código', 'Fecha', 'Cliente', 'Teléfono', 'Dirección', 'Población', 'CP',
    'Tipo de inmueble', 'Superficie m2', 'Plantas', 'Habitaciones', 'Baños',
    'Año', 'Ocupantes', 'Acceso', 'Grúa', 'Andamio', 'Categorías', 'Origen',
    'Plazo', 'Financiación', 'Subvención', 'Estado', 'En Teamleader', 'Observaciones',
  ]];
  lista.slice().sort((a, b) => String(b.fecha_visita || '').localeCompare(String(a.fecha_visita || ''))).forEach((v) => {
    filas.push([
      v.codigo || '', v.fecha_visita || '',
      (v.cliente && v.cliente.nombre) || '', (v.cliente && v.cliente.telefono) || '',
      v.direccion || '', v.poblacion || '', v.cp || '',
      v.tipo_inmueble || '', v.superficie_m2 ?? '', v.plantas ?? '', v.habitaciones ?? '', v.banos ?? '',
      v.anio_construccion ?? '', v.ocupantes ?? '', v.acceso || '',
      si(v.necesita_grua), si(v.necesita_andamio),
      (v.fichas || []).map((f) => nombreCat(f.categoria)).join(' + '),
      v.origen || '', v.plazo_deseado || '',
      si(v.interesa_financiacion), si(v.interesa_subvencion),
      v.estado === 'completada' ? 'Cerrada' : v.estado === 'borrador' ? 'Borrador' : v.estado || '',
      v.sync_estado === 'sincronizada' ? 'Sí' : 'No',
      (v.observaciones || '').replace(/\s+/g, ' '),
    ]);
  });
  const csv = '\uFEFF' + filas.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'visitas-' + hoyISO() + '.csv'; a.click();
  toast('Visitas exportadas en CSV');
};

 * La visita en papel: PDF, compartir y copia en Google Drive (sql/etapa29)
 *
 * El PDF es la ficha entera —cliente, inmueble, cada categoría y las fotos—,
 * que es lo que se usa para sentarse a presupuestar. La copia de Drive va a
 * Visitas / Cliente / fecha · código, junto con las fotos sueltas.

// Las fotos viven en Supabase Storage. Hay que traerlas como datos ANTES de
// dibujar: si fueran enlaces, el PDF saldría con los huecos en blanco.
async function cargarFotosVisita(vv) {
  const fotos = (vv.adjuntos || []).filter((a) => a.storage_path && !a.data);
  if (!fotos.length) return true;
  const faltan = fotos.map((a) => a.storage_path).filter((r) => !V.visitaFotoUrls[r]);
  if (faltan.length) {
    try { Object.assign(V.visitaFotoUrls, await visitasDB.urlsFotos(faltan)); } catch (e) { /* se ve abajo */ }
  }
  let fallos = 0;
  for (const a of fotos) {
    const url = V.visitaFotoUrls[a.storage_path];
    if (!url) { fallos++; continue; }
    try {
      const blob = await (await fetch(url)).blob();
      a.data = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob);
      });
    } catch (e) { fallos++; }
  }
  return fallos === 0;
}

async function pdfDeVisita(vv) {
  const todas = await cargarFotosVisita(vv);
  imprimirVisitaHTML(vv);

  return { blob, todas };
}

A.visitaPdf = async () => {
  const vv = V.visitaVer; if (!vv) return;
  toast('Preparando el PDF…');
  const todas = await cargarFotosVisita(vv);
  if (!todas) avisar('Alguna foto no se pudo descargar: saldrá sin ella.');
  imprimirVisitaHTML(vv);
  setTimeout(() => window.print(), 60);
};

A.compartirVisita = async () => {
  const vv = V.visitaVer; if (!vv) return;
  toast('Preparando el PDF…');
  try {
    const { blob } = await pdfDeVisita(vv);
    const nombre = 'visita-' + (vv.visita.codigo || 'sysefen') + '.pdf';
    const archivo = new File([blob], nombre, { type: 'application/pdf' });
    const cli = vv.visita.cliente;
    pdfParaCompartir = {
      archivo,
      title: 'Toma de datos ' + (vv.visita.codigo || ''),
      text: S.empresa + ' · Toma de datos' + (cli ? ' · ' + cli.nombre : ''),
    };
    if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
      await navigator.share({ files: [archivo], title: pdfParaCompartir.title, text: pdfParaCompartir.text });
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
    toast('PDF descargado.');
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    if (e && e.name === 'NotAllowedError' && pdfParaCompartir) { V.sheet = { tipo: 'compartirListo', nombre: pdfParaCompartir.archivo.name }; render(); return; }
    avisar('No se pudo preparar el PDF: ' + msgError(e));
  }
};

// Copia a Drive. Sale sola al cerrar la visita y se puede reintentar a mano.
async function subirVisitaDrive() {
  const vv = V.visitaVer; if (!vv) return;
  V.okVisitaDrive = { estado: 'subiendo' }; render();
  try {
    const { blob } = await pdfDeVisita(vv);
    const r = await visitasDB.subirVisitaADrive(vv.visita.id, blob);
    V.okVisitaDrive = { estado: 'ok', archivo: (r && r.archivo) || '', url: (r && r.carpeta_url) || '', fotos: (r && r.fotos) || 0 };
  } catch (e) {
    V.okVisitaDrive = { estado: 'error', error: msgError(e) };
  }
  render();
}
A.visitaDrive = () => subirVisitaDrive();

    const c = V.visitaCat;
    const esq = vSchemas.ESQUEMAS[c];
    const f = V.visitaFichas[c] || { datos: {}, tocados: {} };
    const faltan = vSchemas.loQueFalta(esq, f.datos).length;
    titulo = nombreCat(c);
    sub += faltan ? ` · Faltan ${faltan} obligatorio${faltan === 1 ? '' : 's'}` : ' · Todo lo obligatorio';
    volver = '<div class="volver" data-a="visitaCat" data-c="">‹ Fichas</div>';
    cuerpo = fotosHTML(c) + vForm.fichaHTML(esq, f.datos, f.tocados);
    pie = '<button class="btn btn-verde" data-a="visitaCat" data-c="">Volver a fichas</button>';

  } else if (p === 4) {
    if (d.direccion) sub += ' · ' + d.direccion;
    if (!cats.length) {
      cuerpo = `<div class="card"><div class="h2">Sin categorías</div>
        <div class="sub" style="margin-top:6px">Vuelve un paso y marca qué se presupuesta.</div></div>`;
    } else {
      cuerpo = `<div class="col g10">${cats.map((c) => {
        const esq = vSchemas.ESQUEMAS[c];
        const datos = (V.visitaFichas[c] || {}).datos;
        const faltan = vSchemas.loQueFalta(esq, datos);
        const total = esq.secciones.reduce((t, s) => t + s.campos.filter((k) => k.obligatorio).length, 0) || 1;
        const pct = Math.round(((total - faltan.length) / total) * 100);
        const fotos = fotosDeCat(c);
        const hechas = fotos.filter((x) => fotoSrc(c, x.key)).length;
        return `<div class="card" data-a="visitaCat" data-c="${c}" style="cursor:pointer">
          <div class="row">
            <div class="grow" style="font:600 17px/1.2 var(--sans)">${esc(nombreCat(c))}</div>
            ${faltan.length ? `<span class="pill" style="padding:8px 11px">Faltan ${faltan.length}</span>` : '<span class="pill pill-verde" style="padding:8px 11px">Completa</span>'}
            ${SVG_CHEV}
          </div>
          <div class="prog"><i style="width:${pct}%"></i></div>
          <div class="row" style="justify-content:space-between;margin-top:9px;gap:12px">
            <span class="tiny ell">${esc(faltan.length ? faltan.map((x) => x.campo).join(' · ') : 'Todo lo obligatorio')}</span>
            ${fotos.length ? `<span class="tiny" style="flex:none">${hechas}/${fotos.length} fotos</span>` : ''}
          </div>
        </div>`;
      }).join('')}</div>
      <div class="tiny" style="margin-top:16px">Se puede seguir con alguna a medias. Todo se exige al cerrar la visita.</div>`;
    }

  } else {
    sub += ' · Repasa antes de cerrar';
    const faltan = faltanVisita();
    const bloqueo = faltan.length ? `<div class="aviso-rojo" style="margin-bottom:14px"><span class="ex">!</span>
        <div class="col" style="gap:3px"><b style="font:600 13px/1.3 var(--sans)">${faltan.length === 1 ? 'Falta 1 dato' : 'Faltan ' + faltan.length + ' datos'} para cerrar</b>
        <span style="font:400 12px/1.4 var(--sans)">${esc(faltan.join(' · '))}</span></div></div>` : '';
    const tarjetaResumen = (titulo2, accion, html) => `<div class="card" style="margin-bottom:10px;padding:13px 15px 8px">
        <div class="row" style="justify-content:space-between"><div class="h2" style="font-size:17px">${esc(titulo2)}</div>${accion}</div>
        ${html}
      </div>`;
    cuerpo = bloqueo
      + tarjetaResumen(cli && cli.nombre ? cli.nombre : 'Sin cliente', '<span class="tiny" data-a="visitaPaso" data-n="2" style="cursor:pointer;color:var(--verde-o)">Editar</span>', vForm.resumenHTML(vSchemas.COMUN, d))
      + cats.map((c) => {
        const fotos = fotosDeCat(c);
        const hechas = fotos.filter((x) => fotoSrc(c, x.key)).length;
        return tarjetaResumen(nombreCat(c), `<span class="tiny" data-a="visitaIrFicha" data-c="${c}" style="cursor:pointer;color:var(--verde-o)">Editar</span>`,
          (fotos.length ? `<div class="tiny" style="margin-top:6px">${hechas} de ${fotos.length} fotos</div>` : '')
          + vForm.resumenHTML(vSchemas.ESQUEMAS[c], (V.visitaFichas[c] || {}).datos));
      }).join('');
    pieCol = true;
    pie = `<button class="btn btn-verde" data-a="guardarVisita" data-completar="1" ${faltan.length || V.visitaBusy ? 'disabled' : ''}>${V.visitaBusy ? 'Guardando…' : 'Cerrar la visita'}</button>
      <button class="btn btn-gris" data-a="guardarVisita" ${V.visitaBusy ? 'disabled' : ''}>Guardar y seguir luego</button>`;
  }

  return `<div class="hdr-dark">
    ${volver}
    <div style="font:600 27px/1.1 var(--cond)">${esc(titulo)}</div>
    <div class="sub" style="color:rgba(255,255,255,.5);margin-top:6px">${esc(sub)}</div>
    <div class="pasos">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= p ? 'on' : ''}" data-a="visitaPaso" data-n="${i}" style="cursor:pointer"></i>`).join('')}</div>
  </div>
  <div class="scroll pad sin-marca" style="padding-bottom:30px">${cuerpo}</div>
  <div class="pie${pieCol ? ' col' : ''}">${pie}</div>`;
}

function vVisita() {

    <div class="volver" data-a="ir" data-v="visitas">‹ Visitas</div>

  const v = vv.visita, fichas = vv.fichas || [], adj = vv.adjuntos || [];
  const cli = v.cliente;
  const cats = fichas.map((f) => f.categoria);

    bloque = `<div class="card">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:var(--verde)"></span><span class="lbl">En Teamleader</span></div>
      <div class="viaja">

        <span class="k">Deal</span><span class="v">${esc(cats.map(nombreCat).join(' + ') || '—')}<small>${esc([v.poblacion, v.tl_deal_fase].filter(Boolean).join(' · '))}</small></span>
      </div>
      <div class="tiny" style="margin-top:14px">Ya no se edita desde el móvil. Si hay que corregir algo, se hace en Teamleader.</div>

    bloque = `<div class="card">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:${error ? 'var(--rojo)' : 'var(--tinta)'}"></span><span class="lbl"${error ? ' style="color:var(--rojo)"' : ''}>${error ? 'No se pudo enviar' : 'Cerrada · por enviar'}</span></div>
      ${error && v.sync_error ? `<div class="aviso-rojo" style="margin-top:12px"><span class="ex">!</span><span style="font:400 13px/1.4 var(--sans)">${esc(v.sync_error)}</span></div>` : ''}
      <div class="viaja">
        <span class="k">Cliente</span><span class="v">${esc(cli ? cli.nombre : 'Sin cliente')}<small>${cli ? (cli.tl_id ? 'Ya existe en Teamleader' : 'Se da de alta al enviar') : 'Se enviará sin cliente'}</small></span>
        <span class="k">Deal</span><span class="v">${esc(cats.map(nombreCat).join(' + ') || '—')}<small>${esc(v.poblacion || '')}</small></span>
        <span class="k">Nota</span><span class="v">${fichas.length === 1 ? 'La ficha en texto' : 'Las ' + fichas.length + ' fichas en texto'}</span>
        <span class="k">Fotos</span><span class="v">${fotosN} ${fotosN === 1 ? 'archivo' : 'archivos'}</span>
      </div>
      <button class="btn btn-verde" data-a="enviarVisita" style="margin-top:16px" ${V.visitaBusy ? 'disabled' : ''}>${V.visitaBusy ? 'Enviando…' : error ? 'Reintentar el envío' : 'Enviar a Teamleader'}</button>
      <button class="btn btn-gris" data-a="editarVisita" data-id="${v.id}" style="margin-top:8px">Corregir algo</button>
    </div>`;
  } else {
    bloque = `<div class="card">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:var(--ambar)"></span><span class="lbl">Borrador</span></div>
      <div class="sub" style="margin-top:8px">Todavía no está cerrada.</div>
      <button class="btn btn-verde" data-a="editarVisita" data-id="${v.id}" style="margin-top:14px">Seguir rellenando</button>
    </div>`;
  }

  const miniaturas = (c) => {
    const lista = adj.filter((a) => String(a.campo_ref || '').startsWith(c + '.'));
    if (!lista.length) return '';
    return `<div class="rej3" style="margin-top:10px">${lista.map((a) => {
      const url = V.visitaFotoUrls[a.storage_path];
      return `<div class="foto-v" style="${url ? `background-image:url('${url}')` : ''};cursor:default"><span>${esc(a.descripcion || '')}</span></div>`;
    }).join('')}</div>`;

  // La ficha en papel: PDF para mirar o mandar, y la copia en Drive.

    <div class="lbl">La ficha en papel</div>
    <div class="sub" style="margin-top:6px;font-size:13px">El PDF lleva el inmueble, cada categoría y las fotos. La copia va a Drive, a la carpeta del cliente.</div>
    <div class="row g8" style="margin-top:14px">
      <button class="pill grow" data-a="visitaPdf" style="padding:12px;text-align:center">Ver PDF</button>
      <button class="pill grow" data-a="compartirVisita" style="padding:12px;text-align:center">Compartir</button>
    </div>
    <button class="pill" data-a="visitaDrive" style="margin-top:8px;padding:12px;width:100%;text-align:center" ${dr && dr.estado === 'subiendo' ? 'disabled' : ''}>${
      dr && dr.estado === 'subiendo' ? 'Subiendo a Drive…' : v.drive_id || (dr && dr.estado === 'ok') ? 'Volver a subir a Drive' : 'Copiar a Drive'}</button>
    ${dr ? `<div class="tiny" style="margin-top:10px${dr.estado === 'error' ? ';color:var(--rojo)' : ''}">${
      dr.estado === 'subiendo' ? 'Subiendo el PDF y las fotos…'
      : dr.estado === 'ok' ? '✓ En Drive' + (dr.archivo ? ' como ' + esc(dr.archivo) : '') + (dr.fotos ? ' · ' + dr.fotos + (dr.fotos === 1 ? ' foto' : ' fotos') : '')
      : 'No se pudo copiar a Drive: ' + esc(dr.error || '')}</div>` : v.drive_at ? `<div class="tiny" style="margin-top:10px">✓ Copiada a Drive el ${fechaCorta(v.drive_at)}</div>` : ''}
  </div>`;

  return cab(v.direccion || 'Visita', [cli && cli.nombre, v.poblacion, v.codigo].filter(Boolean).join(' · '))
    + `<div class="scroll pad pb-nav sin-marca">
      ${bloque}
      ${papel}
      <div class="lbl" style="margin:24px 0 10px">Inmueble</div>
      <div class="card" style="padding:4px 15px 10px">${vForm.resumenHTML(vSchemas.COMUN, v)}</div>
      ${fichas.map((f) => `<div class="lbl" style="margin:24px 0 10px">${esc(nombreCat(f.categoria))}</div>
        <div class="card" style="padding:4px 15px 12px">
          ${miniaturas(f.categoria)}
          ${vForm.resumenHTML(vSchemas.ESQUEMAS[f.categoria], f.datos)}
        </div>`).join('')}
    </div>`;
}

/* =============================================================================
 * AGENDA DE PRESUPUESTOS · clientes y citas (fase A)
 *
 * Primero se da de alta el cliente con su cita; el día llegado, "Empezar
 * visita" abre la toma de datos ya rellena. Requiere sql/etapa23.
 * Crean y cambian citas solo los de presupuestos; jefes y admin las ven.
 * ============================================================================= */
Object.assign(V, {
  agenda: { citas: [], clientes: [], cargado: false, cargando: false, error: null, filtro: 'todas', filtroCli: 'todos', buscar: '' },
  clienteDraft: null, citaDraft: null, clienteVerId: null, citaVerId: null, agBusy: false, agConfirmar: null,
});

const AG_VISTAS = ['agenda', 'clientes', 'clienteNuevo', 'clienteVer', 'citaNueva', 'citaVer'];
const AG_TIPOS = [['particular', 'Particular'], ['empresa', 'Empresa'], ['comunidad', 'Comunidad']];
const AG_ORIGENES = [['recomendacion', 'Recomendación'], ['web', 'Web'], ['llamada', 'Llamada'], ['cliente_existente', 'Cliente de siempre'], ['constructora', 'Constructora']];
const AG_DURACIONES = [30, 45, 60, 90, 120];
const AG_ESTADOS = { pendiente: 'Pendiente', visitada: 'Visitada', no_estaba: 'No estaba', anulada: 'Anulada' };
const puedeCitar = () => esPresupuestos();
const faltaAgendaSQL = (m) => /does not exist|schema cache|PGRST20[05]|could not find/i.test(String(m || ''));
const agErrorTxt = (e) => (faltaAgendaSQL(msgError(e)) ? 'Falta preparar Supabase: ejecuta sql/etapa23_agenda_citas.sql.' : msgError(e));

const agHoy = () => hoyISO();
const agDiaDe = (iso) => (iso ? fechaLocal(iso) : null);
const agHora = (iso) => (iso ? hhmm(iso) : '');
const agDur = (m) => (m >= 60 ? (m % 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m / 60 + ' h') : m + ' min');
const agSumaDias = (dia, n) => { const d = new Date(dia + 'T12:00'); d.setDate(d.getDate() + n); return fechaLocal(d); };
const agMayus = (s) => String(s || '').replace(/^./, (c) => c.toUpperCase());
function agEtiquetaDia(dia) {
  if (dia === agHoy()) return 'Hoy · ' + fechaLarga(dia);
  if (dia === agSumaDias(agHoy(), 1)) return 'Mañana · ' + fechaLarga(dia);
  return agMayus(fechaLarga(dia));
}
const agCliente = (id) => V.agenda.clientes.find((c) => c.id === id) || null;
const agCita = (id) => V.agenda.citas.find((c) => c.id === id) || null;
const agPresupuestos = () => S.users.filter((u) => u.rol === 'presupuestos' && u.activo !== false && u.empId);
const agNombreEmp = (empId) => { const u = S.users.find((x) => x.empId === empId); return u ? u.nombre : ''; };
const agTipoNombre = (c) => (AG_TIPOS.find((x) => x[0] === c.tipo) || [null, c.tl_tipo === 'company' ? 'Empresa' : 'Particular'])[1];
const agBadge = (txt) => `<span class="badge" style="background:rgba(20,23,15,.06);color:var(--tinta)">${esc(txt)}</span>`;

function agEstadoCliente(c) {
  const vis = c.visitas || [];
  const pend = (c.citas || []).filter((x) => x.estado === 'pendiente');
  if (vis.some((v) => v.sync_estado === 'sincronizada')) return { k: 'teamleader', color: 'var(--verde)', txt: 'En Teamleader' };
  const prox = pend.filter((x) => x.inicio).sort((a, b) => a.inicio.localeCompare(b.inicio))[0];
  if (prox) return { k: 'citado', color: 'var(--ambar)', txt: 'Citado · ' + (agDiaDe(prox.inicio) === agHoy() ? 'hoy' : fechaCorta(prox.inicio)) + ' ' + agHora(prox.inicio) };
  if (vis.length) return { k: 'visitado', color: 'var(--tinta)', txt: vis.some((v) => v.estado === 'completada') ? 'Visitado · por enviar' : 'Visitado · sin cerrar' };
  return { k: 'sin_cita', color: 'var(--rojo)', txt: pend.length ? 'Pendiente de fecha' : 'Sin cita' };
}

/* ---------- carga ---------- */
A.cargarAgenda = async () => {
  const ag = V.agenda; if (ag.cargando) return;
  ag.cargando = true;
  try {
    if (!empRows.length) { try { await cargarMapaEmpleados(); } catch (e) { /* los nombres saldrán vacíos */ } }
    const [citas, clientes] = await Promise.all([visitasDB.listarCitas(), visitasDB.listarClientesAgenda()]);
    ag.citas = citas; ag.clientes = clientes; ag.error = null;
  } catch (e) { ag.error = msgError(e); }
  finally { ag.cargando = false; ag.cargado = true; if (AG_VISTAS.includes(V.view)) render(); }
};

/* ---------- acciones: un solo despachador para todo lo que empieza por ag_ ---------- */
A.ag = (a, d, e) => {
  const cd = V.citaDraft;
  switch (a) {
    case 'ag_filtro': V.agenda.filtro = d.f; return render();
    case 'ag_filtroCli': V.agenda.filtroCli = d.f; return render();
    case 'ag_sinCita': V.agenda.filtroCli = 'sin_cita'; V.view = 'clientes'; return render();
    case 'ag_visitas': return A.ir('visitas');
    case 'ag_volver': V.view = d.v; return render();
    case 'ag_nuevoCliente': return agNuevoCliente();
    case 'ag_editarCliente': return agEditarCliente(d.id);
    case 'ag_cliTipo': if (V.clienteDraft) V.clienteDraft.tipo = d.t; return render();
    case 'ag_cliOrigen': if (V.clienteDraft) V.clienteDraft.origen = V.clienteDraft.origen === d.o ? null : d.o; return render();
    case 'ag_guardarCliente': return agGuardarCliente(d.cita === '1');
    case 'ag_abrirCliente': V.clienteVerId = d.id; V.view = 'clienteVer'; scrollMemo.clienteVer = 0; render(); return A.cargarAgenda();
    case 'ag_abrirCita': V.citaVerId = d.id; V.agConfirmar = null; V.view = 'citaVer'; scrollMemo.citaVer = 0; return render();
    case 'ag_nuevaCita': if (e) e.stopPropagation(); return agNuevaCita(d.id, false);
    case 'ag_editarCita': return agEditarCita(d.id);
    // Antes de repintar se lee la rueda: si no, se perdería la hora recién movida.
    case 'ag_citaDia': if (cd) { sincronizarRuedas(); cd.dia = d.dia || null; } return render();
    case 'ag_citaDur': if (cd) { sincronizarRuedas(); cd.duracion = +d.m; } return render();
    case 'ag_citaCat': if (cd) { sincronizarRuedas(); const i = cd.categorias.indexOf(d.c); if (i >= 0) cd.categorias.splice(i, 1); else cd.categorias.push(d.c); } return render();
    case 'ag_citaQuien': if (cd) { sincronizarRuedas(); cd.empleadoId = cd.empleadoId === d.id ? null : d.id; } return render();
    case 'ag_guardarCita': return agGuardarCita();
    case 'ag_estado': return agCambiarEstado(d.id, d.e);
    case 'ag_borrarCita': if (e) e.stopPropagation(); return agBorrarCita(d.id);
    case 'ag_confirmarBorrarCita': return agConfirmarBorrarCita();
    case 'ag_borrarCliente': if (e) e.stopPropagation(); return agBorrarCliente(d.id);
    case 'ag_confirmarBorrarCliente': return agConfirmarBorrarCliente();
    case 'ag_empezar': if (e) e.stopPropagation(); return agEmpezarVisita(d.id);
  }
};

function agNuevoCliente() {
  if (!puedeCitar()) return;
  V.clienteDraft = { id: null, nombre: '', tipo: 'particular', telefono: '', email: '', nif: '', direccion: '', poblacion: '', origen: null, nota: '' };
  V.view = 'clienteNuevo'; scrollMemo.clienteNuevo = 0; render();
}
function agEditarCliente(id) {
  const c = agCliente(id); if (!c || !puedeCitar()) return;
  V.clienteDraft = {
    id: c.id, nombre: c.nombre || '', tipo: c.tipo || (c.tl_tipo === 'company' ? 'empresa' : 'particular'),
    telefono: c.telefono || '', email: c.email || '', nif: c.nif || '', direccion: c.direccion || '',
    poblacion: c.poblacion || '', origen: c.origen || null, nota: c.nota || '',
  };
  V.view = 'clienteNuevo'; scrollMemo.clienteNuevo = 0; render();
}
async function agGuardarCliente(conCita) {
  const d = V.clienteDraft; if (!d || V.agBusy) return;
  const t = (k) => String(d[k] || '').trim();
  if (!t('nombre')) { avisar('Pon al menos el nombre del cliente.'); return; }
  if (t('email') && !esCorreo(t('email'))) { avisar('El email no parece válido. Corrígelo o déjalo vacío.'); return; }
  if (!navigator.onLine) { avisar('Sin conexión: el cliente no se ha guardado.'); return; }
  V.agBusy = true; render();
  try {
    const g = await visitasDB.guardarCliente({
      id: d.id, nombre: t('nombre'), tipo: d.tipo, tl_tipo: d.tipo === 'particular' ? 'contact' : 'company',
      telefono: t('telefono') || null, email: t('email').toLowerCase() || null, nif: t('nif') || null,
      direccion: t('direccion') || null, poblacion: t('poblacion') || null, origen: d.origen || null, nota: t('nota') || null,
    });
    V.agBusy = false; V.clienteDraft = null;
    clienteADrive(g.id);
    await A.cargarAgenda();
    V.clienteVerId = g.id;
    if (conCita) return agNuevaCita(g.id, true);
    toast('Cliente guardado.');
    V.view = 'clienteVer'; render();
  } catch (e) {
    V.agBusy = false; render();
    avisar('No se pudo guardar el cliente: ' + agErrorTxt(e));
  }
}

/**
 * Apunta al cliente en la hoja única de Drive (sql/etapa29). Una fila por
 * cliente: si ya tenía, se corrige esa misma fila.
 * No bloquea: el cliente ya está guardado en Supabase pase lo que pase con
 * Google. Si falla, se avisa por debajo y se puede reintentar desde su ficha.
 */
async function clienteADrive(id) {
  if (!id || !navigator.onLine) return;
  V.cliDrive = { id, estado: 'subiendo' }; render();
  try {
    const r = await visitasDB.clienteADrive(id);
    V.cliDrive = { id, estado: 'ok', url: (r && r.hoja_url) || '', fila: (r && r.fila) || 0, aviso: (r && r.aviso) || '' };
  } catch (e) {
    V.cliDrive = { id, estado: 'error', error: msgError(e) };
  }
  render();
}
A.cliDriveReintentar = (id) => clienteADrive(id);

function agNuevaCita(clienteId, desdeAlta) {
  if (!puedeCitar()) return;
  const c = agCliente(clienteId); if (!c) { avisar('No se encuentra el cliente.'); return; }
  V.clienteVerId = clienteId;
  V.citaDraft = {
    id: null, clienteId, desdeAlta: !!desdeAlta, dia: agSumaDias(agHoy(), 1), horaMin: 600, duracion: 60,
    categorias: [], empleadoId: miEmpId() || null, direccion: c.direccion || '', poblacion: c.poblacion || '', nota: '',
  };
  V.agConfirmar = null;
  V.view = 'citaNueva'; scrollMemo.citaNueva = 0; render();
}
function agEditarCita(id) {
  const x = agCita(id); if (!x || !puedeCitar()) return;
  const ini = x.inicio ? new Date(x.inicio) : null;
  V.citaDraft = {
    id: x.id, clienteId: x.cliente_id, desdeAlta: false, dia: ini ? fechaLocal(ini) : null,
    horaMin: ini ? ini.getHours() * 60 + ini.getMinutes() : 600, duracion: x.duracion_min || 60,
    categorias: (x.categorias || []).slice(), empleadoId: x.empleado_id || null,
    direccion: x.direccion || '', poblacion: x.poblacion || '', nota: x.nota || '',
  };
  V.agConfirmar = null;
  V.view = 'citaNueva'; scrollMemo.citaNueva = 0; render();
}
async function agGuardarCita() {
  sincronizarRuedas();
  const d = V.citaDraft; if (!d || V.agBusy) return;
  const choques = agSolapes(d).filter((o) => o.mismo);
  if (choques.length && V.agConfirmar !== 'solape') {
    V.agConfirmar = 'solape'; render();
    avisar('Esa hora choca con otra cita de ' + agNombreEmp(d.empleadoId) + '. Pulsa «Guardar igualmente» si es a propósito.');
    return;
  }
  V.agConfirmar = null;
  if (!navigator.onLine) { avisar('Sin conexión: la cita no se ha guardado.'); return; }
  let inicio = null;
  if (d.dia) {
    const h = Math.floor(d.horaMin / 60), m = d.horaMin % 60;
    inicio = new Date(`${d.dia}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`).toISOString();
  }
  const fila = {
    cliente_id: d.clienteId, inicio, duracion_min: d.duracion, categorias: d.categorias, empleado_id: d.empleadoId,
    direccion: String(d.direccion || '').trim() || null, poblacion: String(d.poblacion || '').trim() || null,
    nota: String(d.nota || '').trim() || null,
  };
  if (d.id) {
    fila.id = d.id;
    // Si cambia el momento de la cita, el aviso del día antes vuelve a tocar.
    const antes = agCita(d.id);
    if (!antes || antes.inicio !== inicio) fila.aviso_enviado_at = null;
    // Si el cliente ya había recibido el aviso, el correo nuevo tiene que decir
    // que es un cambio y desde cuándo.
    if (antes && antes.inicio && antes.inicio !== inicio) {
      fila.cambio_desde = (antes.aviso_enviado_at || antes.confirmacion_enviada_at) ? antes.inicio : null;
    }
  }
  V.agBusy = true; render();
  try {
    const g = await visitasDB.guardarCita(fila);
    V.agBusy = false; V.citaDraft = null;
    avisarDeCita(g.id);
    toast(inicio ? 'Cita guardada: ' + fechaCorta(inicio) + ' a las ' + hhmm(inicio) + '.' : 'Guardado como pendiente de fecha.');
    await A.cargarAgenda();
    V.citaVerId = g.id; V.view = 'citaVer'; render();
  } catch (e) {
    V.agBusy = false; render();
    avisar('No se pudo guardar la cita: ' + agErrorTxt(e));
  }
}

/**
 * El correo de la cita sale al momento: «cita nueva» al crearla, «cambio de
 * cita» al moverla y «cita anulada» al anularla, al cliente y a quien va.
 * Si esto falla (sin cobertura, por ejemplo) no se para nada: la tarea
 * programada lo recoge en la siguiente pasada.
 */
async function avisarDeCita(id) {
  if (!id || !navigator.onLine) return;
  try {
    const r = await visitasDB.avisarCita(id);
    if (r && r.enviados) {
      toast(r.tipo === 'anulada' ? 'Anulación avisada por correo.'
        : r.tipo === 'cambio' ? 'Cambio avisado por correo.'
        : 'Cita avisada por correo.');
    }
  } catch (e) { /* lo reintenta la tarea programada */ }
}

let agConfirmarT;
async function agCambiarEstado(id, estado) {
  if (!puedeCitar()) return;
  const clave = id + ':' + estado;
  if (V.agConfirmar !== clave) {
    V.agConfirmar = clave; render();
    clearTimeout(agConfirmarT);
    agConfirmarT = setTimeout(() => { if (V.agConfirmar === clave) { V.agConfirmar = null; if (V.view === 'citaVer') render(); } }, 3500);
    return;
  }
  V.agConfirmar = null;
  if (!navigator.onLine) { avisar('Sin conexión: no se ha cambiado.'); return render(); }
  try {
    await visitasDB.guardarCita({ id, estado });
    toast(estado === 'anulada' ? 'Cita anulada.' : 'Marcada: no estaba.');
    if (estado === 'anulada') avisarDeCita(id);
    await A.cargarAgenda();
  } catch (e) { avisar('No se pudo cambiar: ' + agErrorTxt(e)); render(); }
}

/* ---------- solapes: ¿esa hora pisa otra cita? ---------- */
const agMinDelDia = (iso) => { const t = new Date(iso); return t.getHours() * 60 + t.getMinutes(); };
const agRango = (s, e) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}–${Math.floor(e / 60)}:${String(e % 60).padStart(2, '0')}`;
function agSolapes(d) {
  if (!d || !d.dia) return [];
  const ini = d.horaMin, fin = d.horaMin + (d.duracion || 60);
  return V.agenda.citas
    .filter((x) => x.estado === 'pendiente' && x.inicio && x.id !== d.id && agDiaDe(x.inicio) === d.dia)
    .map((x) => { const s = agMinDelDia(x.inicio); return { x, s, e: s + (x.duracion_min || 60) }; })
    .filter((o) => o.s < fin && ini < o.e)
    .map((o) => Object.assign(o, { mismo: !!d.empleadoId && o.x.empleado_id === d.empleadoId }));
}
// Se repinta sola al mover la rueda (refrescarNumerosRueda), sin render().
function agSolapeHTML(d) {
  if (!d || !d.dia) return '';
  const quien = (o) => esc(((o.x.cliente || {}).nombre) || 'Cliente') + (o.x.empleado_id ? ' (' + esc(agNombreEmp(o.x.empleado_id)) + ')' : '');
  const tuya = 'Tu cita: ' + agRango(d.horaMin, d.horaMin + (d.duracion || 60)) + '.';
  const sol = agSolapes(d);
  const mismos = sol.filter((o) => o.mismo), otros = sol.filter((o) => !o.mismo);
  if (mismos.length) {
    return `<div class="aviso-rojo"><span class="ex">!</span><div class="col" style="gap:3px">
      <b style="font:600 13px/1.3 var(--sans)">Choca con otra cita de ${esc(agNombreEmp(d.empleadoId))}</b>
      <span style="font:400 12px/1.4 var(--sans)">${tuya} Ocupado: ${mismos.map((o) => agRango(o.s, o.e) + ' ' + quien(o)).join(' · ')}</span></div></div>`;
  }
  if (otros.length) {
    return `<div class="tiny" style="color:var(--ambar-o)">${tuya} A esa hora también hay: ${otros.map((o) => agRango(o.s, o.e) + ' ' + quien(o)).join(' · ')}</div>`;
  }
  const delDia = V.agenda.citas
    .filter((x) => x.estado === 'pendiente' && x.inicio && x.id !== d.id && agDiaDe(x.inicio) === d.dia)
    .map((x) => { const s = agMinDelDia(x.inicio); return agRango(s, s + (x.duracion_min || 60)); });
  return `<div class="tiny" style="color:var(--verde-o)">${tuya} No choca con ninguna cita.${delDia.length ? ' Ese día ocupado: ' + delDia.join(', ') + '.' : ''}</div>`;
}

// Qué pasa con el correo de aviso de una cita. La tarea de Supabase revisa
// cada 10 minutos y avisa de las citas de las próximas 24 horas.
// La confirmación sale en cuanto la cita tiene día y hora (salvo que ya entre
// en el recordatorio de 24 h, que dice lo mismo).
function agConfirmTxt(x, c) {
  if (x.confirmacion_enviada_at) return 'Enviada ' + fechaCorta(x.confirmacion_enviada_at) + ' ' + hhmm(x.confirmacion_enviada_at);
  if (x.estado !== 'pendiente' || !x.inicio) return '';
  if (new Date(x.inicio).getTime() < Date.now()) return '';
  if (!c.email) return 'Sin envío: el cliente no tiene email';
  if (new Date(x.inicio).getTime() - Date.now() <= 24 * 3600 * 1000) return 'No hace falta: entra en el aviso de 24 h';
  return 'En unos minutos · al cliente';
}
function agAvisoTxt(x, c) {
  if (x.aviso_enviado_at) return 'Enviado ' + fechaCorta(x.aviso_enviado_at) + ' ' + hhmm(x.aviso_enviado_at);
  if (x.cambio_desde) return 'Cambio de cita · en unos minutos · ' + esc(c.email ? 'al cliente' : 'el cliente no tiene email');
  if (x.estado !== 'pendiente' || !x.inicio) return x.inicio ? '' : 'Cuando tenga fecha';
  if (new Date(x.inicio).getTime() < Date.now()) return '';
  const row = empRowById(x.empleado_id) || {};
  const quien = agNombreEmp(x.empleado_id) || 'quien va';
  const para = [c.email ? 'al cliente' : '', row.email_avisos ? 'a ' + quien : ''].filter(Boolean);
  if (!para.length) return 'Sin envío: faltan el email del cliente y el email para avisos de ' + esc(quien);
  const sale = new Date(new Date(x.inicio).getTime() - 24 * 3600 * 1000);
  const cuandoSale = sale.getTime() <= Date.now() ? 'En unos minutos' : fechaCorta(sale.toISOString()) + ' ' + hhmm(sale.toISOString());
  return cuandoSale + ' · ' + esc(para.join(' y '));
}

/**
 * La fila del cliente en la hoja de Drive: si algo falló, se ve aquí y se
 * reintenta. Sin enlaces a Drive: el móvil de cada uno está con su cuenta de
 * Google, no con la de la empresa, y el enlace no le abriría nada.
 */
function agCarpetaHTML(c) {
  if (!puedeCitar()) return '';
  const d = V.cliDrive && V.cliDrive.id === c.id ? V.cliDrive : null;
  const trabajando = d && d.estado === 'subiendo';
  if (!d && c.drive_at) return '';          // ya está apuntado y sin novedad
  return `<div class="card" style="margin-bottom:18px">
    <div class="row g8"><span class="lbl">Hoja de clientes</span></div>
    ${trabajando ? '<div class="sub" style="margin-top:7px;font-size:13px">Apuntándolo…</div>' : ''}
    ${d && d.estado === 'ok' && !d.aviso ? `<div class="sub" style="margin-top:7px;font-size:13px">✓ Apuntado${d.fila ? ' en la fila ' + d.fila : ''}.</div>` : ''}
    ${d && d.estado === 'error' ? `<div class="sub" style="margin-top:7px;font-size:13px;color:var(--rojo)">No se pudo apuntar: ${esc(d.error || '')}</div>` : ''}
    ${d && d.aviso ? `<div class="sub" style="margin-top:7px;font-size:13px;color:var(--rojo)">Falló: ${esc(d.aviso)}</div>` : ''}
    ${!d && !c.drive_at ? '<div class="sub" style="margin-top:7px;font-size:13px">Todavía no está en la hoja.</div>' : ''}
    ${!trabajando ? `<button class="pill" data-a="cliDriveReintentar" data-id="${c.id}" style="margin-top:10px;padding:11px;width:100%;text-align:center">${c.drive_at ? 'Repasar su fila' : 'Apuntarlo en la hoja'}</button>` : ''}
  </div>`;
}

function vClienteVer() {

      ${c.email ? `<div class="fila"><span class="k">Email</span><span class="v">${esc(c.email)}</span></div>` : ''}
      ${c.nif ? `<div class="fila"><span class="k">NIF</span><span class="v">${esc(c.nif)}</span></div>` : ''}
      ${c.direccion ? `<div class="fila"><span class="k">Dirección</span><span class="v">${esc([c.direccion, c.poblacion].filter(Boolean).join(', '))}</span></div>` : ''}
      ${c.nota ? `<div class="fila"><span class="k">Nota</span><span class="v">${esc(c.nota)}</span></div>` : ''}
    </div>` : ''}
    ${agCarpetaHTML(c)}
    <div class="lbl" style="margin-bottom:12px">Historial</div>
    <div class="ag-linea">
      ${items.map(hito).join('')}
      <div class="ag-hito hecho"><div class="card" style="padding:12px 15px">

/* ---------- otra visita con una a medias ---------- */
// Antes se bloqueaba. Ahora la de medias se guarda como borrador en Supabase
// (con sus fotos) y se empieza la nueva. Sin cobertura no se puede guardar.
A.visitaAparcar = async () => {
  const s = V.sheet;
  if (!s || s.tipo !== 'visitaAMedias' || s.busy) return;
  const luego = () => { V.sheet = null; return s.citaId ? agEmpezarVisita(s.citaId) : A.nuevaVisita(); };
  const b = leerBorradorVisita();
  if (!b || !b.draft) return luego();
  if (!navigator.onLine) { avisar('Sin conexión: la visita a medias no se puede guardar ahora. Síguela o descártala.'); return; }
  s.busy = true; render();
  V.visitaDraft = b.draft; V.visitaFichas = b.fichas || {}; V.visitaFotos = b.fotos || {};
  V.visitaAdjuntos = b.adjuntos || []; V.visitaPaso = b.paso || 1; V.visitaCat = null;
  await A.guardarVisita(false, luego);
  if (V.sheet === s) { s.busy = false; render(); }   // falló: la hoja sigue abierta
};
A.visitaSeguirMedias = () => { V.sheet = null; A.seguirBorrador(); };

/* --- nav --- */
function nav(v) {
  const items = esPresupuestos()
    ? [['agenda', 'Agenda', '5px'], ['clientes', 'Clientes', '3px'], ['ajustes', 'Perfil', '99px']]
    : esAdmin()
    ? [['hoy', 'Hoy', '99px'], ['empleados', 'Empleados', '4px'], ['obras', 'Obras', '5px'], ['partes', 'Partes', '3px'], ['horas', 'Horas', '2px'], ['agenda', 'Citas', '6px'], ['ajustes', 'Ajustes', '99px']]
    : puedeCrear()
    ? [['hoy', 'Hoy', '99px'], ['obras', 'Obras', '5px'], ['partes', 'Partes', '3px'], ['horas', 'Horas', '2px'], ['agenda', 'Citas', '6px'], ['ajustes', 'Ajustes', '99px']]
    : [['hoy', 'Hoy', '99px'], ['obras', 'Obras', '5px'], ['horas', 'Horas', '2px'], ['ajustes', 'Perfil', '99px']];
  const act = (id) => v === id
    || (id === 'obras' && v === 'obra')
    || (id === 'horas' && v === 'imputar')
    || (id === 'empleados' && (v === 'empleado' || v === 'planilla'))
    || (id === 'visitas' && v === 'visita')
    || (id === 'agenda' && (v === 'citaVer' || (!esPresupuestos() && (v === 'clientes' || v === 'clienteVer'))))
    || (id === 'clientes' && ['clienteVer', 'visitas', 'visita'].includes(v));
  return `<div class="nav">${items.map(([id, l, r]) => `<div class="${act(id) ? 'on' : ''}" data-a="ir" data-v="${id}"><i style="border-radius:${r}"></i><span>${l}</span></div>`).join('')}</div>`;
}

/* --- toast --- */
let toastT;
function toast(msg, tipo) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const err = tipo === 'err';
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err shake' : '');
  d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), err ? 4200 : 2600);
}
// Avisos que BLOQUEAN algo (falta un dato, no hay conexión, falló el guardado):
// se ven en rojo y duran más. Los mensajes de "ha ido bien" siguen con toast().
function avisar(msg) { toast(msg, 'err'); }

  imprimirParteHTML(p);
  setTimeout(() => window.print(), 60);

document.addEventListener('input', (e) => {
  const t = e.target;
  const f = t.dataset.f, fm = t.dataset.fm;
  if (fm) {
    const [id, k] = fm.split(':');
    const m = V.draft.mats.find((x) => x.id === id); if (m) m[k] = t.value;
    return;
  }
  if (!f) return;
  if (f.startsWith('vf')) return A.vf(f, t.dataset, t.value);
  if (f === 'ag_buscar') { V.agenda.buscar = t.value; const box = document.getElementById('clientes-lista'); if (box) box.innerHTML = clientesListaHTML(); return; }
  if (f === 'ag_cli') { if (V.clienteDraft) V.clienteDraft[t.dataset.k] = t.value; return; }
  if (f === 'ag_cita') { if (V.citaDraft) V.citaDraft[t.dataset.k] = t.value; return; }
  if (f === 'ag_citaFecha') { if (V.citaDraft) { sincronizarRuedas(); V.citaDraft.dia = t.value || null; render(); } return; }
  if (f === 'loginNombre') { V.loginNombre = t.value; return; }
  if (f === 'visitaBuscar') return A.visitaBuscar(t.value);
  if (f === 'visitaCli') { const c = V.visitaDraft && V.visitaDraft._cliente; if (c) { c[t.dataset.k] = t.value; guardarBorradorVisita(); } return; }
  if (f === 'docProveedor') { if (V.sheet) V.sheet.proveedor = t.value; return; }
  if (f === 'docImporte') { if (V.sheet) V.sheet.importe = t.value; return; }
  if (f === 'docFecha') { if (V.sheet) V.sheet.fecha = t.value; return; }
  if (f === 'docNota') { if (V.sheet) V.sheet.nota = t.value; return; }
  if (f === 'impFecha') return A.impFecha(t.value);
  if (f === 'parteFecha') return A.parteFecha(t.value);
  if (f === 'empNombre') { A.empCampo('nombre', t.value); return; }
  if (f === 'empEmail') { A.empCampo('email', t.value); return; }
  if (f === 'empTelefono') { A.empCampo('telefono', t.value); return; }
  if (f === 'empEmailAvisos') { A.empCampo('emailAvisos', t.value); return; }
  if (f === 'envPara') { if (V.sheet) V.sheet.para = t.value; return; }
  if (f === 'orNombre') { if (V.sheet) V.sheet.nombre = t.value; return; }
  if (f === 'orCliente') { if (V.sheet) V.sheet.cliente = t.value; return; }
  if (f === 'orDir') { if (V.sheet) V.sheet.dir = t.value; return; }
  if (f === 'impNota') { const l = (V.impDraft || [])[Number(t.dataset.i)]; if (l) l.nota = t.value; return; }
  if (f === 'impGrupoNota') { const l = (V.impGrupoLineas || [])[Number(t.dataset.i)]; if (l) l.nota = t.value; return; }
  if (f === 'envCopia') { if (V.sheet) V.sheet.copia = t.value; return; }
  if (f === 'empPin') { t.value = t.value.replace(/\D/g, '').slice(0, 4); A.empCampo('pin', t.value); return; }
  if (f === 'ingresoPin') { t.value = t.value.replace(/\D/g, '').slice(0, 4); V.sheet.val = t.value; return; }
  if (f === 'empNombreCompleto') { A.empCampo('nombreCompleto', t.value); return; }
  if (f === 'empFechaAlta') { A.empCampo('fechaAlta', t.value); return; }
  if (f === 'empVacaciones') { t.value = t.value.replace(/\D/g, '').slice(0, 3); A.empCampo('vacacionesAnuales', t.value); return; }
  if (f === 'sheetVal') { V.sheet.val = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'sheetNombre') { V.sheet.nombre = t.value; return; }
  if (f === 'sheetPin') { V.sheet.pin = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'pinActual') { V.sheet.actual = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'pinNuevo') { V.sheet.val = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'pinNuevo2') { V.sheet.val2 = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'corrEntrada') { V.sheet.entrada = t.value; return; }
  if (f === 'corrSalida') { V.sheet.salida = t.value; return; }
  if (['empresa', 'cif', 'emailCopia'].includes(f)) { S[f] = t.value; save(); return; }
  if (V.view === 'alta') { V.draft[f] = t.value; return; }
  if (V.draft) V.draft[f] = t.value;
});

setInterval(() => {
  if (V.user && V.view === 'hoy' && !V.sheet) sincronizarFichajes().then(render);
}, 30000);

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  // Si esta página ya estaba controlada por un service worker antiguo y entra
  // uno nuevo, se recarga UNA vez para enseñar la versión nueva sin tener que
  // cerrar y abrir la app. En la primera instalación no hay anterior y no se
  // recarga.
  const habiaAnterior = !!navigator.serviceWorker.controller;
  let recargada = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!habiaAnterior || recargada) return;
    recargada = true;
    location.reload();
  });
  // updateViaCache: 'none' → al buscar si hay sw.js nuevo no se usa la caché
  // del navegador. GitHub Pages lo sirve con max-age=600 y, sin esto, la
  // comprobación podía tardar hasta 10 minutos en enterarse.
  window.addEventListener('load', () => navigator.serviceWorker
    .register('sw.js', { updateViaCache: 'none' })
    .then((reg) => reg.update())
    .catch(() => {}));
}
render();
restaurarSesion();

// Cambios de sesión de Supabase (expiración de token, cierre desde otro sitio).
sysAuth.onAuthChange((session) => {
  if (!session && V.user) { V.user = null; try { sessionStorage.removeItem('ch_user'); } catch (e) {} V.view = 'login'; render(); }
});
