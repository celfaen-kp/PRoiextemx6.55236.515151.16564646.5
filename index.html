<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sysefen · Control Horario y Partes</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#14170f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sysefen">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --tinta:#14170f; --papel:#f5f4ef; --blanco:#fff;
  --verde:#206028; --verde-c:#3d8f4a; --verde-o:#164a1d;
  --ambar:#c98a24; --ambar-o:#7d5410;
  --rojo:#a8402a; --rojo-cl:#f7eae6;
  --l1:rgba(20,23,15,.07); --l2:rgba(20,23,15,.14);
  --t2:rgba(20,23,15,.56); --t3:rgba(20,23,15,.42);
  --sh:0 2px 8px rgba(20,23,15,.06);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --sans:'Barlow',system-ui,-apple-system,sans-serif;
  --cond:'Barlow Semi Condensed','Barlow',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --script:'Dancing Script',cursive;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--papel);color:var(--tinta);-webkit-font-smoothing:antialiased;font-size:16px}
button,input,textarea,select{font-family:inherit;font-size:16px;color:inherit;background:none;border:none;outline:none}
textarea{resize:none}
::placeholder{color:rgba(20,23,15,.3)}
a{color:var(--verde-o);text-decoration:none}
a:hover{color:var(--tinta)}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.pad{padding:18px 20px}
.pb-nav{padding-bottom:calc(96px + var(--safe-b))}

.mono{font-family:var(--mono)}
.lbl{font:400 10px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:rgba(20,23,15,.45)}
.h1{font:700 30px/1.05 var(--cond);letter-spacing:-.01em}
.h2{font:600 19px/1.15 var(--sans)}
.num{font-family:var(--cond);font-weight:600}
.sub{font:400 13px/1.4 var(--sans);color:var(--t2)}
.tiny{font:400 11px/1.3 var(--mono);color:var(--t3)}

.card{background:var(--blanco);border-radius:18px;padding:15px;box-shadow:var(--sh)}
.row{display:flex;align-items:center;gap:11px}
.col{display:flex;flex-direction:column}
.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{display:block;width:100%;text-align:center;font:700 17px/1 var(--cond);letter-spacing:.06em;text-transform:uppercase;padding:18px;border-radius:99px;cursor:pointer;background:var(--tinta);color:#fff}
.btn:active{transform:scale(.985)}
.btn[disabled]{background:rgba(20,23,15,.11);color:rgba(20,23,15,.4)}
.btn-verde{background:var(--verde)}
.btn-rojo{background:var(--rojo)}
.btn-gris{background:rgba(20,23,15,.06);color:var(--tinta);font-weight:600;font-family:var(--sans);font-size:14px;letter-spacing:0;text-transform:none}
.pill{font:600 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:10px 12px;border-radius:99px;cursor:pointer;background:rgba(20,23,15,.06);color:var(--tinta);border:none;white-space:nowrap}
.pill-verde{background:var(--verde);color:#fff}
.pill-rojo{background:var(--rojo-cl);color:var(--rojo)}
.chip{font:500 13px/1 var(--sans);padding:10px 13px;border-radius:99px;cursor:pointer;background:#fff;color:var(--t2);border:1px solid var(--l2)}
.chip.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.chip.alerta{background:var(--rojo);color:#fff;border-color:var(--rojo)}
.chip.ok{background:var(--verde);color:#fff;border-color:var(--verde)}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.inp{width:100%;background:#fff;border:1px solid var(--l2);border-radius:14px;padding:14px}
.inp-lg{font:600 22px var(--cond)}
.dot{width:9px;height:9px;border-radius:99px;flex:none}
.badge{font:600 9px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 8px;border-radius:99px;flex:none}
.av{border-radius:99px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-family:var(--sans);overflow:hidden;background-size:cover;background-position:center}
.av.emoji{font-weight:400;line-height:1}
.sw{width:44px;height:26px;border-radius:99px;flex:none;padding:3px;display:flex;transition:.15s}
.sw i{width:20px;height:20px;border-radius:99px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.hr{height:1px;background:var(--l2);margin:14px 0}
.stat{flex:1;background:#fff;border-radius:18px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font:600 26px/1 var(--cond);margin-top:8px}

.hdr{flex:none;background:#fff;border-bottom:1px solid var(--l1);padding:calc(14px + var(--safe-t)) 20px 14px}
.hdr-dark{flex:none;background:var(--tinta);color:#fff;padding:calc(14px + var(--safe-t)) 20px 18px}
/* Volver / cancelar / cerrar. Eran textos de 13px casi sin margen: con el
   pulgar costaba acertarles. Ahora todos tienen 44px de alto real de toque
   (el mínimo cómodo en móvil), aunque el texto siga siendo discreto. */
.back,.volver{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px 8px 0;font:500 15px/1 var(--sans);color:var(--t2);cursor:pointer;-webkit-tap-highlight-color:transparent}
.volver.der{padding:8px 0 8px 14px}
.hdr-dark .back,.hdr-dark .volver,.semaforo .back,.semaforo .volver{color:rgba(255,255,255,.6)}
.semaforo{flex:none;padding:calc(18px + var(--safe-t)) 22px 26px;transition:background .25s}
.hoja{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--papel);border-radius:26px 26px 0 0;margin-top:-16px;padding:22px 20px calc(100px + var(--safe-b))}
.hoja-contenido{position:relative;z-index:1}
/* Marca de agua Sysefen GLOBAL: se aplica a los dos contenedores de contenido
   que usa toda la app (.hoja en Hoy/Admin, .scroll en el resto de secciones),
   así que aparece igual en Obras, Partes, Horas, Empleados y Ajustes sin
   tocar cada vista. Va como pseudo-elemento EN FLUJO NORMAL (no
   absolute/fixed): ocupa su propia franja de espacio arriba de cada sección,
   antes de la primera tarjeta. Así nunca queda a mitad de una tarjeta ni
   partida por los renglones de una lista (el problema de la versión
   anterior, que la superponía y una lista densa la cortaba en trozos):
   al reservar su propio hueco, la imagen se ve siempre completa y entera. */
.scroll::before,.hoja::before{
  content:'';
  display:block;
  width:100%;
  height:104px;
  margin-bottom:14px;
  background:url('logo-trans.png') center/contain no-repeat;
  opacity:.32;
  pointer-events:none;
}
@media (max-width:520px){
  .scroll::before,.hoja::before{height:76px;margin-bottom:10px}
}

.nav{flex:none;display:flex;align-items:flex-start;padding:10px 6px calc(6px + var(--safe-b));background:rgba(252,251,249,.97);border-top:1px solid rgba(20,23,15,.08);backdrop-filter:blur(12px)}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:3px 0;color:rgba(20,23,15,.32)}
.nav div.on{color:var(--tinta)}
.nav i{width:20px;height:20px;background:currentColor;display:block}
.nav span{font:500 10px/1 var(--sans)}
.pasos{display:flex;gap:5px;margin-top:14px}
.pasos i{flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.18)}
.pasos i.on{background:var(--verde-c)}

.sheet{position:fixed;inset:0;background:rgba(20,23,15,.55);display:flex;align-items:flex-end;padding:20px;padding-bottom:calc(20px + var(--safe-b));z-index:50;animation:fade .15s}
.sheet>div{width:100%;background:#fff;border-radius:26px;padding:24px 22px 22px;animation:up .22s cubic-bezier(.2,.9,.3,1)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(18px)}}
.toast{position:fixed;left:20px;right:20px;top:calc(56px + var(--safe-t));max-width:520px;margin:0 auto;background:var(--tinta);color:#fff;padding:14px 16px;border-radius:14px;font:500 14px/1.4 var(--sans);z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastIn .2s ease-out}
/* Aviso de error: rojo, más grande y con temblor, para que no pase inadvertido
   cuando bloquea una acción (falta la descripción, falta la firma…). */
.toast.err{background:var(--rojo);font:600 15px/1.35 var(--sans);padding:15px 17px;box-shadow:0 10px 30px rgba(168,64,42,.45);display:flex;gap:10px;align-items:flex-start}
.toast.err::before{content:'!';flex:none;width:21px;height:21px;border-radius:99px;background:#fff;color:var(--rojo);font:700 14px/21px var(--sans);text-align:center}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}}
.offline{flex:none;background:var(--ambar);color:var(--tinta);font:500 12px/1 var(--sans);text-align:center;padding:7px}

#firma{width:100%;height:190px;display:block;border-radius:10px;touch-action:none}
.firma-box{background:#fff;border:1.5px solid var(--l2);border-radius:18px;padding:10px;position:relative;box-shadow:var(--sh)}
.firma-box .ph{position:absolute;left:0;right:0;bottom:44px;text-align:center;pointer-events:none;font:400 13px var(--sans);color:rgba(20,23,15,.3)}
.firma-box .linea{position:absolute;left:34px;right:34px;bottom:38px;height:1px;background:var(--l2);pointer-events:none}

.docu{background:#fff;border-radius:8px;padding:20px;box-shadow:0 6px 18px rgba(20,23,15,.08)}
.docu .fila{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font:400 13px var(--sans);color:rgba(20,23,15,.78)}
.docu .fila span{font-family:var(--mono);font-size:12px;white-space:nowrap}
.docu .tot{display:flex;justify-content:space-between;padding-top:9px;margin-top:7px;border-top:1px solid var(--l2);font:600 14px var(--sans)}

.bar{display:flex;gap:3px;height:34px;align-items:flex-end;margin-top:14px}
.bar i{flex:1;border-radius:3px 3px 0 0;background:var(--verde-c)}
.bar i.off{background:rgba(20,23,15,.13)}
.prog{height:6px;border-radius:99px;background:rgba(20,23,15,.07);margin-top:8px;overflow:hidden}
.prog i{display:block;height:6px;border-radius:99px;background:var(--verde-c)}

.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}
.pin-pad button{height:62px;border-radius:16px;font:500 25px var(--sans);color:#fff;background:rgba(255,255,255,.1)}
.pin-pad button:active{background:rgba(255,255,255,.2)}
.pin-pad button.plain{background:none;font-size:20px;color:rgba(255,255,255,.55)}
.pin-dots{display:flex;gap:14px;margin-top:26px;justify-content:center}
.pin-dots i{width:14px;height:14px;border-radius:99px;background:rgba(255,255,255,.22)}
.pin-dots i.on{background:#fff}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.adj{background:#fff;border-radius:14px;padding:12px 13px;box-shadow:var(--sh)}
.adj .tipo{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font:600 9px var(--mono)}
.dash{text-align:center;font:500 13px var(--sans);padding:14px;border-radius:14px;border:1.5px dashed rgba(20,23,15,.22);color:var(--t2);cursor:pointer;flex:1}

/* Control de horas: dos ruedas (horas / minutos en pasos de 15) tipo selector
   nativo. El desplazamiento vertical con encastre (scroll-snap) es un gesto
   que ya se conoce de los pickers de fecha/hora del propio teléfono — mucho
   más preciso al dedo que un dial circular de arrastre. */
.rueda-marco{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);background:rgba(20,23,15,.06);border-radius:12px;pointer-events:none;z-index:0}
.rueda-col{overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:1;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 32%,#000 68%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 32%,#000 68%,transparent 100%)}
.rueda-col::-webkit-scrollbar{display:none}
.rueda-track{display:flex;flex-direction:column}
.rueda-item{display:flex;align-items:center;justify-content:center;font:500 19px var(--mono);color:var(--t3);scroll-snap-align:center}
.rueda-item.on{color:var(--tinta);font:700 24px var(--cond)}

#print{display:none}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #app,.toast,.sheet{display:none!important}
  #print{display:block;padding:0}
  @page{size:A4;margin:14mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="print"></div>

<script type="module">
'use strict';

import { supabase } from './supabase-client.js';
import * as sysAuth from './supabase-auth.js';
import * as sysDB from './supabase-db.js';

// Capa Supabase disponible para la Etapa 3 (integración progresiva) y pruebas.
// La app sigue funcionando con localStorage hasta que se enchufe pieza a pieza.
window.Sysefen = { supabase, auth: sysAuth, db: sysDB };

const KEY = 'ch_v1';
const APP_VERSION = '9.0'; // versión visible de la app (única fuente)
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---------- datos iniciales ---------- */
function semilla() {
  return {
    v: 1,
    empresa: 'Sysefen',
    cif: '',
    emailCopia: '',
    opts: { gps: true, recordatorio: true, importesOperario: false },
    users: [
      { id: 'u1', nombre: 'Bayron', rol: 'jefe', pin: '1111' },
      { id: 'u2', nombre: 'Jaime', rol: 'jefe', pin: '2222' },
      { id: 'u3', nombre: 'David', rol: 'operario', pin: '3333' },
      { id: 'u4', nombre: 'Ale', rol: 'operario', pin: '4444' },
      { id: 'u0', nombre: 'Administración', rol: 'admin', pin: '9999' },
    ],
    obras: [],
    fichajes: [],
    imputaciones: [],
    partes: [],
    seq: 1,
    bienvenida: true,
  };
}
let S = cargar();
function cargar() {
  try {
    const raw = localStorage.getItem(KEY);
    const base = raw ? Object.assign(semilla(), JSON.parse(raw)) : semilla();
    base.fichajes = [];      // fichajes -> Supabase (public.fichajes), nunca localStorage
    base.obras = [];         // obras -> Supabase (public.obras)
    base.imputaciones = [];  // imputaciones -> Supabase (public.imputaciones)
    base.partes = [];        // partes -> Supabase (public.partes/parte_horas/parte_materiales)
    return base;
  } catch (e) { return semilla(); }
}
let guardando = null;
function save() {
  clearTimeout(guardando);
  guardando = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(Object.assign({}, S, { fichajes: [], obras: [], imputaciones: [], partes: [] }))); }
    catch (e) { avisar('No hay espacio en el móvil. Borra algún adjunto antiguo.'); }
  }, 120);
}

/* ---------- sesión / vista ---------- */
let V = { view: 'login', pinUser: null, pin: '', pinBusy: false, err: false, obraId: null, tabHoras: 'empleado', sheet: null, draft: null, verParte: null, user: null, impFecha: null, impEmp: null, impDraft: null, impBorrar: [], impBusy: false, empEmp: null, empDraft: null, empBusy: false, planEmp: null, planMes: null };
try { const u = sessionStorage.getItem('ch_user'); if (u) V.user = JSON.parse(u); } catch (e) {}
if (V.user) V.view = 'hoy';

/* --- login: mapeo empleado local <-> cuenta de Supabase Auth --- */
const CUENTAS_AUTH = sysAuth.CUENTAS;
const nombreDeEmail = (email) => Object.keys(CUENTAS_AUTH).find((n) => CUENTAS_AUTH[n].email === (email || '').toLowerCase()) || null;
const localPorNombre = (nombre) => S.users.find((u) => u.nombre === nombre) || null;

// Restaura la sesión de Supabase existente al arrancar (funciona sin conexión:
// lee el token persistido, no llama a la red).
async function restaurarSesion() {
  try {
    const session = await sysAuth.sesionActual();
    const authUser = session && session.user;
    const VISTAS_PRIVADAS = ['hoy', 'obras', 'obra', 'alta', 'partes', 'horas', 'ajustes', 'p1', 'p2', 'p3', 'ok'];
    if (authUser) {
      const local = localPorNombre(nombreDeEmail(authUser.email));
      if (local) {
        V.user = { id: local.id };
        try { sessionStorage.setItem('ch_user', JSON.stringify(V.user)); } catch (e) {}
        if (V.view === 'login' || V.view === 'pin') V.view = 'hoy';
      } else {
        V.user = null; V.view = 'login';
        try { sessionStorage.removeItem('ch_user'); } catch (e) {}
      }
    } else {
      // No hay sesión de Supabase: no dejar entrar aunque quede rastro en sessionStorage.
      V.user = null;
      try { sessionStorage.removeItem('ch_user'); } catch (e) {}
      if (VISTAS_PRIVADAS.includes(V.view)) V.view = 'login';
    }
  } catch (e) { /* sin token y sin red: se queda en login */ }
  render();
  refrescarDatos().then(render);
}

/* ---------- fichajes: espejo en memoria de public.fichajes (Supabase) ---------- */
let empIdPorNombre = {};   // 'Bayron' -> uuid empleados.id
let nombrePorEmpId = {};   // uuid empleados.id -> 'Bayron'
let empRows = [];          // filas crudas de public.empleados
let sincronizando = false;
let mapaEmpPromesa = null;

async function cargarMapaEmpleados() {
  if (mapaEmpPromesa) return mapaEmpPromesa;
  mapaEmpPromesa = (async () => {
    const filas = await Sysefen.db.listarEmpleados();
    empRows = filas || [];
    empIdPorNombre = {}; nombrePorEmpId = {};
    empRows.forEach((e) => {
      empIdPorNombre[e.nombre] = e.id; nombrePorEmpId[e.id] = e.nombre;
      // Vincula/actualiza la identidad local con la de Supabase (rol/activo/perfil).
      // Se busca por empId (soporta renombrar) y, si no, por nombre.
      let local = S.users.find((u) => u.empId === e.id) || S.users.find((u) => u.nombre === e.nombre);
      if (!local) {
        local = { id: 'e_' + e.id, nombre: e.nombre, rol: e.rol || 'operario', pin: null };
        S.users.push(local);
      }
      local.nombre = e.nombre;
      // Copia local del avatar: la pantalla de entrada se pinta SIN sesión, así
      // que no puede preguntarle nada a Supabase. Este espejo es lo que permite
      // que cada móvil enseñe las caras de quienes ya han entrado en él.
      local.avatarEmoji = e.avatar_emoji || null;
      local.avatarRuta = e.avatar_foto || null;
      if (!e.avatar_foto) local.avatarFoto = null;
      local.rol = e.rol || local.rol;
      local.activo = e.activo !== false;
      local.email = e.email || null;
      local.telefono = e.telefono || null;
      local.empId = e.id;
      local.altaEn = e.creado_en || null;
      local.bajaEn = e.fecha_baja || null;
    });
  })();
  try { await mapaEmpPromesa; } finally { mapaEmpPromesa = null; }
}
const empRowById = (empId) => empRows.find((e) => e.id === empId) || null;
// ¿Existe ya esa columna en public.empleados? Las de la Etapa 11
// (nombre_completo, fecha_alta) son opcionales: si la migración no está
// ejecutada, la app tira del nombre corto y de creado_en en vez de fallar.
const columnaEmp = (k) => !!(empRows.length && Object.prototype.hasOwnProperty.call(empRows[0], k));
// Nombre para DOCUMENTOS (planilla, PDF, CSV): nombre y apellidos si constan.
// En pantalla y en el login se sigue usando el nombre corto.
const nombreLegal = (userId) => {
  const row = empRowById(empIdDeUser(userId));
  const largo = row && row.nombre_completo && String(row.nombre_completo).trim();
  return largo || (userById(userId) || {}).nombre || '—';
};
// Alta REAL como trabajador. `creado_en` solo dice cuándo se creó la ficha.
const altaEmp = (row) => {
  if (!row) return null;
  if (row.fecha_alta) return String(row.fecha_alta).slice(0, 10) + 'T12:00';
  return row.creado_en || null;
};

function mapFichajeDeDB(row) {
  const local = localPorNombre(nombrePorEmpId[row.empleado_id]);
  return {
    id: row.id,
    userId: local ? local.id : null,
    obraId: row.obra_id || null,
    entrada: row.entrada,
    salida: row.salida || null,
  };
}

// Recarga S.fichajes desde Supabase. No usa localStorage. Si falla (p. ej. sin
// conexión) deja lo que hubiera y no rompe la vista.
async function sincronizarFichajes() {
  if (!V.user || sincronizando) return;
  sincronizando = true;
  try {
    if (!Object.keys(empIdPorNombre).length) await cargarMapaEmpleados();
    const filas = await Sysefen.db.listarFichajes();
    S.fichajes = filas.map(mapFichajeDeDB).filter((f) => f.userId);
  } catch (e) { /* sin conexión / RLS: se mantiene el estado actual */ }
  finally { sincronizando = false; }
}

let sincObras = false;

// Fila de public.obras -> forma que usa la UI. La obra NO lleva lista de empleados.
function mapObraDeDB(row) {
  return {
    id: row.id,

    dir: row.direccion || '',

}

/* ---------- imputación de horas (public.imputaciones · Supabase) ---------- */
// FICHAJE = presencia (cuándo).  IMPUTACIÓN = reparto del tiempo (en qué).
// Los fichajes NO se tocan. El fichaje no tiene obra: la obra la decide el jefe
// al imputar. Las horas de obra salen SIEMPRE de las imputaciones.
const IMP_CATS = [
  ['obra', 'Obra'],
  ['despacho', 'Despacho / oficina'],
  ['preparacion', 'Preparación / carga / descarga'],
  ['desplazamiento', 'Desplazamiento'],
  ['otros', 'Otros'],
];
// Paleta categórica validada (5 colores, orden fijo, distinguibles también con
// daltonismo) para el resumen por categoría de Horas. Mismo orden que IMP_CATS.
const IMP_COLORES = { obra: '#2a78d6', despacho: '#eb6834', preparacion: '#1baf7a', desplazamiento: '#eda100', otros: '#e87ba4' };
let sincImp = false;

function mapImputacionDeDB(row) {
  const local = localPorNombre(nombrePorEmpId[row.empleado_id]);
  return {
    id: row.id,
    userId: local ? local.id : null,
    empleado_id: row.empleado_id,

    categoria: row.categoria,
    obraId: row.obra_id || null,
    minutos: row.minutos || 0,
    origen: row.origen,
    bloqueado: !!row.bloqueado,
    actualizadoPor: row.actualizado_por || null,
    actualizadoEn: row.actualizado_en || null,
  };
}

/* ---------- partes: espejo en memoria de public.partes/parte_horas/parte_materiales ---------- */
// Esquema REAL (confirmado, sin columna `ref`, sin adjuntos, sin importe en partes):
//   partes(id, obra_id, fecha, autor_id, descripcion, nivel_incidencia, incidencia,
//          observaciones, firmante, firma, email_cliente, estado, creado_en, actualizado_en)
//   parte_horas(id, parte_id, empleado_id, horas numeric, creado_en)
//   parte_materiales(id, parte_id, nombre, cantidad, importe, compra, creado_en)
let sincPartes = false;

// La tabla NO tiene columna `ref`: se deriva de forma determinista (fecha + id),
// nunca se guarda en Supabase. Mismo resultado en cualquier dispositivo.
const refDeParte = (row) => 'PT-' + String(row.fecha || '').slice(5, 7) + String(row.fecha || '').slice(8, 10) + '-' + String(row.id || '').slice(0, 4).toUpperCase();

function mapParteDeDB(row, horasFilas, matsFilas, adjFilas) {
  const horas = {};
  (horasFilas || []).forEach((h) => {
    const local = localPorNombre(nombrePorEmpId[h.empleado_id]);
    if (local) horas[local.id] = Number(h.horas) || 0;
  });
  const mats = (matsFilas || []).map((m) => ({ id: m.id, nombre: m.nombre || '', cant: m.cantidad || '', importe: '', compra: m.compra !== false }));
  const autorLocal = localPorNombre(nombrePorEmpId[row.autor_id]);
  return {
    id: row.id,
    ref: refDeParte(row),
    obraId: row.obra_id,
    fecha: row.fecha,
    autorId: autorLocal ? autorLocal.id : null,
    desc: row.descripcion || '',
    horas, mats,
    nivel: row.nivel_incidencia || 'Sin incidencias',
    inc: row.incidencia || '',
    // Las fotos viven en Supabase Storage (Etapa 12). Aquí solo llega la
    // ficha: la imagen se pide con un enlace firmado cuando hace falta verla.
    adjuntos: (adjFilas || []).map((a) => ({
      id: a.id, ruta: a.ruta, nombre: a.nombre || 'foto.jpg',
      ext: (a.nombre && a.nombre.includes('.') ? a.nombre.split('.').pop() : 'JPG').toUpperCase().slice(0, 4),
      peso: a.bytes ? (a.bytes / 1024 > 900 ? (a.bytes / 1048576).toFixed(1) + ' MB' : Math.round(a.bytes / 1024) + ' KB') : '',
      img: a.es_imagen !== false, data: null,
    })),
    importe: '',  // `partes` no tiene columna importe
    obs: row.observaciones || '',
    firmante: row.firmante || '',
    firma: row.firma || null,
    email: row.email_cliente || '',
    estado: row.estado || 'firmado',
    creado: row.creado_en,
  };
}

// Espejo de partes visibles (RLS acota: jefe/admin todos; operario, los suyos).
async function sincronizarPartes() {
  if (!V.user || sincPartes) return;
  sincPartes = true;
  try {
    if (!Object.keys(empIdPorNombre).length) await cargarMapaEmpleados();
    const [filas, horasFilas, matsFilas, adjFilas] = await Promise.all([
      Sysefen.db.listarPartes(),
      Sysefen.db.listarHorasPartes(),
      Sysefen.db.listarMaterialesPartes(),
      // Si falta la Etapa 12 la tabla no existe: se sigue sin adjuntos en vez
      // de dejar la lista de partes en blanco.
      Sysefen.db.listarAdjuntosPartes().catch(() => []),
    ]);
    const horasPorParte = {}; (horasFilas || []).forEach((h) => { (horasPorParte[h.parte_id] = horasPorParte[h.parte_id] || []).push(h); });
    const matsPorParte = {}; (matsFilas || []).forEach((m) => { (matsPorParte[m.parte_id] = matsPorParte[m.parte_id] || []).push(m); });
    const adjPorParte = {}; (adjFilas || []).forEach((a) => { (adjPorParte[a.parte_id] = adjPorParte[a.parte_id] || []).push(a); });
    S.partes = (filas || [])
      .map((row) => mapParteDeDB(row, horasPorParte[row.id], matsPorParte[row.id], adjPorParte[row.id]))
      .sort((a, b) => String(b.creado || '').localeCompare(String(a.creado || '')));
  } catch (e) { /* sin conexión / RLS: se mantiene lo que haya */ }
  finally { sincPartes = false; }
}

const refrescarDatos = () => Promise.all([sincronizarFichajes(), sincronizarObras(), sincronizarImputaciones(), sincronizarPartes(), cargarAvatares()]);

// Presencia CERRADA (jornada terminada) de un empleado en un día, desde S.fichajes.
// Minutos REALES exactos. NO se redondea aquí.
function presenciaCerradaDia(userId, dia) {
  return S.fichajes
    .filter((f) => f.userId === userId && f.salida && fechaLocal(f.entrada) === dia)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida), 0);
}
// Redondeo al múltiplo de 15 min MÁS CERCANO (0-7→0, 8-22→15, 23-37→30, 38-52→45…).
const redondear15 = (min) => Math.round((min || 0) / 15) * 15;
// Disponibilidad para IMPUTAR: presencia cerrada redondeada al 15 más cercano.
// Tolerancia. NO afecta al fichaje real ni a la planilla de horas del personal.
const disponibleImputar = (userId, dia) => redondear15(presenciaCerradaDia(userId, dia));
const impLineasDe = (userId, fecha) => S.imputaciones.filter((i) => i.userId === userId && (!fecha || i.fecha === fecha));
const impMinImputados = (userId, fecha) => impLineasDe(userId, fecha).reduce((t, i) => t + (i.minutos || 0), 0);

// --- Avatares -------------------------------------------------------------
// Cada persona puede poner un emoji o una foto; si no, sus iniciales. Las fotos
// viven en el bucket privado `avatares`, así que se piden enlaces firmados una
// vez por sesión y se guardan aquí. En la pantalla de entrada todavía no hay
// sesión: allí siempre salen las iniciales.
const urlAvatar = {};   // empleado_id -> enlace firmado

let avataresBajados = false;   // una vez por apertura de la app, no por sincronización
async function cargarAvatares() {
  try {
    // Igual que las demás sincronizaciones: sin el mapa de empleados cargado,
    // `empRows` está vacío y esto se salía sin hacer nada.
    if (!empRows.length) await cargarMapaEmpleados();
    const rutas = empRows.filter((e) => e.avatar_foto).map((e) => e.avatar_foto);
    if (!rutas.length) return;
    const urls = await Sysefen.db.urlsFirmadasAvatar(rutas);
    empRows.forEach((e) => { if (e.avatar_foto && urls[e.avatar_foto]) urlAvatar[e.id] = urls[e.avatar_foto]; });
    if (avataresBajados) return;
    avataresBajados = true;
    // Y se deja una copia en el móvil para la pantalla de entrada. Son ~15 KB
    // por persona. Se refresca una vez por apertura, así que un cambio de foto
    // se ve en los demás móviles la próxima vez que abran la app.
    for (const e of empRows) {
      if (!e.avatar_foto || !urlAvatar[e.id]) continue;
      const local = S.users.find((x) => x.empId === e.id || x.nombre === e.nombre);
      if (!local) continue;
      try {
        const blob = await (await fetch(urlAvatar[e.id])).blob();
        local.avatarFoto = await new Promise((ok, mal) => {
          const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = mal; r.readAsDataURL(blob);
        });
      } catch (_) { /* si no baja, quedan las iniciales */ }
    }
    save();
  } catch (e) { /* sin avatares: se ven las iniciales, que no es un fallo grave */ }
}

// `estilo` trae el color y el tamaño que ya usaba cada sitio; `attrs` permite
// colgarle un data-a para que se pueda pulsar.
function avatarHTML(userId, estilo, attrs, clases) {
  const u = userById(userId) || { nombre: '—' };
  const row = empRowById(empIdDeUser(userId));
  const a = attrs ? ' ' + attrs : '';
  const cl = 'av' + (clases ? ' ' + clases : '');
  // Con sesión: enlace firmado, siempre al día. Sin sesión (pantalla de
  // entrada): la copia guardada en este móvil.
  const foto = (row && urlAvatar[row.id]) || u.avatarFoto || null;
  if (foto) return `<div class="${cl}"${a} style="${estilo};background-image:url('${foto}')"></div>`;
  const emoji = (row && row.avatar_emoji) || u.avatarEmoji || null;
  if (emoji) return `<div class="${cl} emoji"${a} style="${estilo}">${esc(emoji)}</div>`;
  return `<div class="${cl}"${a} style="${estilo}">${esc(ini(u.nombre))}</div>`;
}

/* ---------- tiempo ---------- */
// Fecha LOCAL (del dispositivo, = hora de Palma) en formato YYYY-MM-DD.
// Debe coincidir con la fecha local que usa Supabase (v_presencia_diaria,
// imputaciones.fecha). Nunca usar toISOString() (UTC) para agrupar por día.
const fechaLocal = (d) => {
  const x = d ? new Date(d) : new Date();
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
};
const hoyISO = () => fechaLocal();
const hhmm = (iso) => { const d = new Date(iso); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const fmtH = (h) => Math.floor(h) + ':' + String(Math.round((h % 1) * 60)).padStart(2, '0');
const cuarto = (h) => Math.max(0, Math.min(16, Math.round(h * 4) / 4));
function fechaLarga(iso) {
  const d = iso ? new Date(iso + 'T12:00') : new Date();
  return d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
}
function fechaCorta(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'short' });
}
// Con año: para altas, bajas y cualquier fecha de un documento que puede
// abarcar varios años. fechaCorta() se queda para listas del día a día.
function fechaConAnio(iso) {
  return new Date(iso).toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' });
}
function durMin(min) { return Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0'); }
function minEntre(a, b) { return Math.max(0, Math.round((new Date(b) - new Date(a)) / 60000)); }

const fichajeAbierto = (uid_) => S.fichajes.find((f) => f.userId === uid_ && !f.salida);
function minutosDia(uid_, dia) {
  return S.fichajes.filter((f) => f.userId === uid_ && fechaLocal(f.entrada) === dia)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida || new Date().toISOString()), 0);
}
function minutosSemana(uid_) {
  const hoy = new Date(); const lunes = new Date(hoy);
  lunes.setDate(hoy.getDate() - ((hoy.getDay() + 6) % 7)); lunes.setHours(0, 0, 0, 0);
  return S.fichajes.filter((f) => f.userId === uid_ && new Date(f.entrada) >= lunes)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida || new Date().toISOString()), 0);
}
// Horas de obra: partes firmados + imputaciones, sin contar dos veces.
// (El fichaje no lleva obra, por eso no entra aquí.) Ver minutosObraRango.
function minutosObra(obraId, uid_) {
  return minutosObraRango(obraId, uid_, 'total');
}
function minutosMes(uid_) {
  const m = hoyISO().slice(0, 7);
  return S.fichajes.filter((f) => f.userId === uid_ && fechaLocal(f.entrada).slice(0, 7) === m)
    .reduce((t, f) => t + minEntre(f.entrada, f.salida || new Date().toISOString()), 0);
}

/* --- imputación de horas --- */
const impDraftDeLineas = (userId, fecha) => impLineasDe(userId, fecha).map((l) => ({
  id: l.id, categoria: l.categoria, obraId: l.obraId, minutos: l.minutos, origen: l.origen, bloqueado: l.bloqueado,
}));
// La imputación en GRUPO es ahora la entrada principal: seleccionar a la
// gente y repartir un bloque de horas es el caso normal. La lista clásica
// (una persona a la vez) queda como modo secundario, para corregir a alguien
// puntual — se llega a ella desde dentro de la pantalla de grupo.
A.abrirImputar = () => {
  if (!V.impFecha) V.impFecha = hoyISO();
  V.impEmp = null; V.impDraft = null; V.impBorrar = [];
  A.abrirImputGrupo();
};
A.abrirImputLista = () => {
  if (!V.impFecha) V.impFecha = hoyISO();
  V.impEmp = null; V.impDraft = null; V.impBorrar = [];
  V.view = 'imputar'; render();
  refrescarDatos().then(render);
};
// Desde el aviso "Jornada cerrada": abre directamente la imputación en GRUPO
// de HOY, con todo el mundo que tenga jornada cerrada ya marcado (el caso
// típico: varios terminan juntos y el jefe reparte el mismo bloque de horas
// a todos de una vez). Quien no corresponda se desmarca a mano.
A.imputarTrasSalida = () => {
  V.sheet = null;
  V.impFecha = hoyISO(); V.impEmp = null; V.impDraft = null; V.impBorrar = [];
  A.abrirImputGrupo();
};
A.impFecha = (v) => {
  if (!v) return;
  V.impFecha = v; V.impEmp = null; V.impDraft = null; V.impBorrar = [];
  if (V.view === 'imputarGrupo') {
    const cand = impGrupoCandidatos(v);
    V.impGrupoSel = cand.map((x) => x.u.id);
    impGrupoReiniciarLineas();
  }
  render();
  refrescarDatos().then(render);
};
A.abrirImputEmp = (userId) => {
  V.impEmp = userId;
  V.impDraft = impDraftDeLineas(userId, V.impFecha);
  // El reloj arranca en lo que queda por imputar (presencia real, redondeada
  // a 15 min), no en 0: el jefe solo tiene que RESTAR hasta donde quiere
  // llegar con esta línea, no partir siempre de cero. Cubre dos casos con
  // la misma cuenta: no hay ninguna línea todavía (se crea una), o ya había
  // una línea guardada pero sin minutos puestos (se completa esa). Las
  // líneas que ya tienen horas repartidas no se tocan.
  const disp = disponibleImputar(userId, V.impFecha);
  if (disp > 0) {
    if (!V.impDraft.length) {
      V.impDraft.push({ categoria: 'otros', obraId: null, minutos: disp, origen: 'manual' });
    } else {
      const asignado = V.impDraft.reduce((t, l) => t + (l.minutos || 0), 0);
      const restante = redondear15(Math.max(0, disp - asignado));
      const vacia = V.impDraft.find((l) => !l.minutos);
      if (restante > 0 && vacia) vacia.minutos = restante;
    }
  }
  V.impBorrar = [];
  V.view = 'imputarEmp'; render();
};
// Acceso directo a la imputación individual de HOY desde "Horas" (tarjeta por
// empleado). A.abrirImputEmp asume V.impFecha ya puesto (normal si se llega
// desde vImputar, que siempre lo fija antes de entrar); aquí puede no estarlo,
// o quedar de una fecha pasada de una sesión anterior de "Imputar horas": se
// fuerza siempre a HOY (coincide con la etiqueta del botón) y se reutiliza la
// misma acción, sin duplicar su lógica.
A.abrirImputHoy = (userId) => {
  V.impFecha = hoyISO();
  A.abrirImputEmp(userId);
};
A.volverImputar = () => { V.impEmp = null; V.impDraft = null; V.impBorrar = []; V.view = 'imputar'; render(); };

/* --- imputación en GRUPO: mismo bloque de horas a varias personas a la vez.
   Cada "Aplicar" INSERTA una línea nueva por persona seleccionada (nunca
   edita ni borra líneas existentes), así que no hace falta el patrón de
   "borrar todo y reinsertar" que usa la edición individual: simplemente se
   suma. Pensado para repetirse varias veces seguidas (una línea por
   categoría) hasta que a cada uno no le quede nada pendiente. --- */
// Quién puede entrar en esta línea de grupo: jornada cerrada y con minutos
// todavía sin imputar hoy (o en la fecha elegida).
const impGrupoCandidatos = (fecha) => equipo()
  .map((u) => ({ u, disp: disponibleImputar(u.id, fecha), imp: impMinImputados(u.id, fecha) }))
  .map((x) => ({ ...x, restante: Math.max(0, x.disp - x.imp) }))
  .filter((x) => x.disp > 0 && x.restante > 0);
// Lo MÍNIMO que le queda pendiente a los seleccionados: es el tope común que
// se puede repartir de una tanda sin pasarse de nadie.
function impGrupoRestanteMin() {
  const cand = impGrupoCandidatos(V.impFecha);
  const restantes = (V.impGrupoSel || [])
    .map((id) => cand.find((x) => x.u.id === id))
    .filter(Boolean)
    .map((x) => x.restante);
  return restantes.length ? Math.min(...restantes) : 0;
}
// Lo ya repartido entre las líneas del borrador (todavía sin guardar).
const impGrupoAsignado = () => (V.impGrupoLineas || []).reduce((t, l) => t + (l.minutos || 0), 0);
// Lo que queda por repartir: el tope común menos lo ya puesto en las líneas.
const impGrupoLibre = () => redondear15(Math.max(0, impGrupoRestanteMin() - impGrupoAsignado()));
// Línea nueva: arranca con TODO lo que quede libre (lo normal es que la
// primera categoría se lleve el grueso y luego se le vaya restando).
const impGrupoLineaNueva = () => ({ categoria: 'obra', obraId: null, minutos: impGrupoLibre() });
// Deja el borrador con UNA línea que arranca con todo lo pendiente. Hay que
// vaciar antes de calcular: si no, las líneas viejas siguen contando como
// "ya repartido" y la línea nueva saldría en 0.
function impGrupoReiniciarLineas() {
  V.impGrupoLineas = [];
  V.impGrupoLineas = [impGrupoLineaNueva()];
}
A.abrirImputGrupo = () => {
  if (!V.impFecha) V.impFecha = hoyISO();
  const cand = impGrupoCandidatos(V.impFecha);
  V.impGrupoSel = cand.map((x) => x.u.id);
  impGrupoReiniciarLineas();
  V.impGrupoBusy = false;
  V.view = 'imputarGrupo'; render();
  refrescarDatos().then(() => {
    const cand2 = impGrupoCandidatos(V.impFecha);
    V.impGrupoSel = (V.impGrupoSel || []).filter((id) => cand2.some((x) => x.u.id === id));
    impGrupoReiniciarLineas();
    render();
  });
};
A.impGrupoToggle = (userId) => {
  const sel = V.impGrupoSel || (V.impGrupoSel = []);
  const i = sel.indexOf(userId);
  if (i < 0) sel.push(userId); else sel.splice(i, 1);
  // Cambia el tope común: si alguna línea se pasó, se recorta a lo que hay.
  const tope = impGrupoRestanteMin();
  let acum = 0;
  (V.impGrupoLineas || []).forEach((l) => {
    l.minutos = Math.max(0, Math.min(l.minutos || 0, Math.max(0, tope - acum)));
    acum += l.minutos;
  });
  render();
};
A.impGrupoAddLinea = () => {
  (V.impGrupoLineas = V.impGrupoLineas || []).push(impGrupoLineaNueva());
  render();
};
A.impGrupoDelLinea = (i) => {
  if (!V.impGrupoLineas) return;
  V.impGrupoLineas.splice(i, 1);
  if (!V.impGrupoLineas.length) impGrupoReiniciarLineas();
  render();
};
A.impGrupoCat = (i, c) => {
  const l = (V.impGrupoLineas || [])[i]; if (!l) return;
  l.categoria = c; if (c !== 'obra') l.obraId = null;
  render();
};
A.impGrupoObra = (i, id) => {
  const l = (V.impGrupoLineas || [])[i]; if (l) { l.obraId = id || null; render(); }
};
A.impGrupoReloj = (i, minutos) => {
  const l = (V.impGrupoLineas || [])[i]; if (!l) return;
  l.minutos = Math.max(0, Math.round(Number(minutos) / 15) * 15);
  render();
};
A.impGrupoGuardar = async () => {
  if (!puedeCrear() || V.impGrupoBusy) return;
  sincronizarRuedas();
  if (!navigator.onLine) { avisar('Sin conexión — no se ha guardado'); return; }
  const fecha = V.impFecha;
  const lineas = (V.impGrupoLineas || []).filter((l) => (l.minutos || 0) > 0);
  if (!lineas.length) { avisar('Pon algo de tiempo en alguna categoría.'); return; }
  if (lineas.some((l) => l.categoria === 'obra' && !l.obraId)) { avisar('Elige la obra en las líneas de tipo Obra.'); return; }
  const cand = impGrupoCandidatos(fecha);
  const seleccionados = cand.filter((x) => (V.impGrupoSel || []).includes(x.u.id));
  if (!seleccionados.length) { avisar('Selecciona al menos a una persona.'); return; }
  const total = lineas.reduce((t, l) => t + l.minutos, 0);
  const excede = seleccionados.find((x) => total > x.restante);
  if (excede) { avisar(excede.u.nombre + ' solo tiene ' + durMin(excede.restante) + ' pendiente.'); return; }
  const mio = miEmpId();
  const filas = [];
  seleccionados.forEach((x) => {
    const empId = empIdDeUser(x.u.id);
    if (!empId) return;
    lineas.forEach((l) => filas.push({
      empleado_id: empId, fecha, categoria: l.categoria,
      obra_id: l.categoria === 'obra' ? l.obraId : null,
      minutos: l.minutos, origen: 'manual',
      creado_por: mio, actualizado_por: mio,
    }));
  });
  V.impGrupoBusy = true; render();
  try {
    await Sysefen.db.guardarImputaciones(filas);
    await sincronizarImputaciones();
    toast(lineas.length + (lineas.length === 1 ? ' categoría' : ' categorías') + ' a ' + seleccionados.length + (seleccionados.length === 1 ? ' persona' : ' personas'));
    const cand2 = impGrupoCandidatos(fecha);
    V.impGrupoSel = (V.impGrupoSel || []).filter((id) => cand2.some((x) => x.u.id === id));
    impGrupoReiniciarLineas();
  } catch (e) {
    avisar('No se pudo guardar: ' + (e && e.message ? e.message : 'error'));
  } finally {
    V.impGrupoBusy = false; render();
  }
};
A.impCat = (i, cat) => {
  const l = V.impDraft[i]; if (!l) return;
  l.categoria = cat;
  if (cat !== 'obra') l.obraId = null;
  render();
};
A.impObra = (i, obraId) => { const l = V.impDraft[i]; if (l) { l.obraId = obraId || null; render(); } };
// nuevo control tipo reloj: fija el valor en minutos (pasos de 15)
A.impReloj = (i, minutos) => {
  const l = V.impDraft[i]; if (!l) return;
  l.minutos = Math.max(0, Math.round(Number(minutos) / 15) * 15);
  render();
};
A.impAddLinea = () => {
  const draft = (V.impDraft = V.impDraft || []);
  // Igual criterio que al abrir: la línea nueva arranca en lo que queda
  // pendiente (disponible menos lo ya puesto en el resto de líneas), no en 0.
  const disp = disponibleImputar(V.impEmp, V.impFecha);
  const yaImp = draft.reduce((t, l) => t + (l.minutos || 0), 0);
  const restante = redondear15(Math.max(0, disp - yaImp));
  draft.push({ categoria: 'otros', obraId: null, minutos: restante, origen: 'manual' });
  render();
};
A.impDelLinea = (i) => {
  const l = V.impDraft[i]; if (!l) return;
  if (l.id) V.impBorrar.push(l.id);
  V.impDraft.splice(i, 1); render();
};
A.impGuardar = async () => {
  if (!puedeCrear()) return;
  sincronizarRuedas();
  if (!navigator.onLine) { avisar('Sin conexión — no se ha guardado'); return; }
  const empId = empIdDeUser(V.impEmp);
  if (!empId) { avisar('Empleado no vinculado en Supabase.'); return; }
  const lineas = V.impDraft || [];
  if (lineas.some((l) => l.categoria === 'obra' && !l.obraId)) { avisar('Elige la obra en las líneas de tipo Obra.'); return; }
  const disp = disponibleImputar(V.impEmp, V.impFecha);
  if (disp <= 0) { avisar('Ese empleado no tiene jornada fichada y cerrada ese día.'); return; }
  const total = lineas.reduce((t, l) => t + (l.minutos || 0), 0);
  if (total > disp) { avisar('Excede la disponibilidad en ' + durMin(total - disp) + '. Disponible: ' + durMin(disp) + '.'); return; }
  const mio = miEmpId();
  // Estrategia simple y robusta frente al trigger de "no superar presencia":
  // se borran TODAS las líneas de ese empleado/día y se reinsertan las nuevas
  // en orden (así el acumulado nunca supera la presencia a mitad de guardado).
  const idsPrevios = S.imputaciones
    .filter((i) => i.userId === V.impEmp && i.fecha === V.impFecha && !i.bloqueado)
    .map((i) => i.id);
  const nuevas = lineas.filter((l) => (l.minutos || 0) > 0).map((l) => ({
    empleado_id: empId,
    fecha: V.impFecha,
    categoria: l.categoria,
    obra_id: l.categoria === 'obra' ? l.obraId : null,
    minutos: l.minutos || 0,
    origen: 'manual',
    creado_por: mio,
    actualizado_por: mio,
  }));
  V.impBusy = true; render();
  try {
    for (const id of idsPrevios) await Sysefen.db.borrarImputacion(id);
    for (const fila of nuevas) await Sysefen.db.guardarImputaciones([fila]);
    await refrescarDatos();
    V.impBusy = false;
    toast('Imputación guardada');
    A.volverImputar();
  } catch (e) {
    V.impBusy = false;
    avisar('No se pudo guardar: ' + (e && e.message ? e.message : 'error'));
    await refrescarDatos(); render();
  }
};

/* --- ADMINISTRACIÓN: gestión de empleados (perfil) --- */
const emailSugerido = (nombre) => (nombre || '').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '.').replace(/^\.|\.$/g, '') + '@sysefen.app';

A.abrirEmpleados = () => { V.empEmp = null; V.empDraft = null; V.view = 'empleados'; render(); refrescarDatos().then(render); };
A.abrirEmpleado = (userId) => {
  const u = userById(userId);
  V.empEmp = userId;
  const row = empRowById(empIdDeUser(userId)) || {};
  V.empDraft = {
    nombre: u.nombre || '', email: u.email || '', telefono: u.telefono || '',
    rol: u.rol || 'operario', activo: u.activo !== false, nuevo: false,
    nombreCompleto: row.nombre_completo || '',
    fechaAlta: row.fecha_alta ? String(row.fecha_alta).slice(0, 10) : '',
  };
  V.view = 'empleado'; render();
};
A.empNuevo = () => {
  V.empEmp = null;
  V.empDraft = { nombre: '', email: '', telefono: '', rol: 'operario', activo: true, pin: '', nombreCompleto: '', fechaAlta: '', nuevo: true };
  V.view = 'empleado'; render();
};
A.volverEmpleados = () => { V.empEmp = null; V.empDraft = null; V.view = 'empleados'; render(); };
A.empCampo = (k, v) => { if (V.empDraft) V.empDraft[k] = v; };
A.empRol = (r) => { if (V.empDraft) { V.empDraft.rol = r; render(); } };
A.empToggleActivo = () => { if (V.empDraft) { V.empDraft.activo = !V.empDraft.activo; render(); } };
A.empGuardar = async () => {
  if (!esAdmin()) return;
  const d = V.empDraft; if (!d) return;
  if (!d.nombre.trim()) { avisar('Pon el nombre.'); return; }
  if (!navigator.onLine) { avisar('Sin conexión — no se ha guardado.'); return; }
  if (d.nuevo && !d.email.trim()) d.email = emailSugerido(d.nombre);
  const campos = {
    nombre: d.nombre.trim(),
    email: (d.email || '').trim().toLowerCase() || null,
    telefono: (d.telefono || '').trim() || null,
    rol: d.rol,
    activo: d.activo,
    fecha_baja: d.activo ? null : (empRowById(empIdDeUser(V.empEmp)) || {}).fecha_baja || hoyISO(),
  };
  // Solo se mandan si la Etapa 11 está ejecutada: si no, PostgREST rechazaría
  // la fila entera por columnas desconocidas y no se podría guardar nada.
  if (columnaEmp('nombre_completo')) campos.nombre_completo = (d.nombreCompleto || '').trim() || null;
  if (columnaEmp('fecha_alta')) campos.fecha_alta = (d.fechaAlta || '').trim() || null;
  V.empBusy = true; render();
  try {
    if (d.nuevo) {
      const pin = (d.pin || '').trim();
      if (pin && !/^\d{4}$/.test(pin)) { V.empBusy = false; avisar('El PIN son 4 números (o déjalo en blanco).'); return render(); }
      const creado = await Sysefen.db.crearEmpleado(campos);
      mapaEmpPromesa = null; await cargarMapaEmpleados();
      if (pin) {
        // Alta completa: perfil + acceso, en un solo paso.
        try {
          await sysAuth.adminCrearAcceso(creado.id, campos.email, pin);
          mapaEmpPromesa = null; await cargarMapaEmpleados();
          toast(campos.nombre + ' ya puede entrar con su PIN.');
        } catch (e) {
          // El perfil sí quedó creado: se dice qué falta y cómo hacerlo a mano.
          toast('Perfil creado. Falta el acceso (ver aviso).');
          V.sheet = { tipo: 'accesoEmpleado', nombre: campos.nombre, email: campos.email, pin, motivo: e && e.noDesplegada ? '' : (e && e.message) || '' };
        }
      } else {
        toast('Empleado creado. Falta darle acceso (ver aviso).');
        V.sheet = { tipo: 'accesoEmpleado', nombre: campos.nombre, email: campos.email };
      }
    } else {
      const empId = empIdDeUser(V.empEmp);
      await Sysefen.db.actualizarEmpleado(empId, campos);
      mapaEmpPromesa = null; await cargarMapaEmpleados();
      toast('Cambios guardados.');
    }
    V.empBusy = false;
    V.view = 'empleados'; V.empEmp = null; V.empDraft = null; render();
  } catch (e) {
    V.empBusy = false;
    avisar('No se pudo guardar: ' + (e && e.message ? e.message : 'error'));
    render();
  }
};

/* --- ADMINISTRACIÓN: fichar entrada/salida de OTRO empleado (solo presencia) --- */
A.adminFichar = (userId) => {
  if (!esAdmin()) return;
  // Administración no tiene jornada que registrar: revisa y corrige, no trabaja
  // en obra. Fichar a esa cuenta ensuciaría el registro con horas que no son de
  // nadie.
  const u = userById(userId);
  if (u && u.rol === 'admin') { avisar('Administración no ficha: no es una jornada de trabajo.'); return; }
  const f = fichajeAbierto(userId);
  V.sheet = { tipo: 'adminFichaje', userId, salida: !!f };
  render();
};
A.adminConfirmarFichaje = async () => {
  const { userId, salida } = V.sheet;
  V.sheet = null; render();
  if (!navigator.onLine) { avisar('Sin conexión.'); return; }
  const empId = empIdDeUser(userId);
  if (!empId) { avisar('Empleado no vinculado.'); return; }
  try {
    if (salida) {
      const abierto = await Sysefen.db.fichajeAbierto(empId);
      if (!abierto) { avisar('Ese empleado no tiene ningún fichaje abierto.'); await refrescarDatos(); return render(); }
      const cerrado = await Sysefen.db.ficharSalida(abierto.id);
      await refrescarDatos();
      toast(userById(userId).nombre + ' — salida registrada ' + hhmm(cerrado.salida));
    } else {
      const abierto = await Sysefen.db.fichajeAbierto(empId);
      if (abierto) { avisar('Ese empleado ya tiene un fichaje abierto.'); await refrescarDatos(); return render(); }
      const nuevo = await Sysefen.db.ficharEntrada(empId, null);
      await refrescarDatos();
      toast(userById(userId).nombre + ' — entrada registrada ' + hhmm(nuevo.entrada));
    }
    render();
  } catch (e) {
    avisar('No se pudo registrar el fichaje: ' + (e && e.message ? e.message : 'error'));
    await refrescarDatos(); render();
  }
};

// Corrección administrativa de un fichaje puntual (entrada y/o salida exactas,
// no "ahora"). Para casos como una salida olvidada que sigue acumulando horas.
// El backend (RLS + trigger de fichajes_hora_servidor) ya distingue jefe/admin
// de operario y respeta los valores enviados solo para jefe/admin.
const isoALocalInput = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
};
A.abrirCorregirFichaje = (id) => {
  if (!esAdmin()) return;
  const f = S.fichajes.find((x) => x.id === id); if (!f) return;
  V.sheet = { tipo: 'corregirFichaje', id, userId: f.userId, entrada: isoALocalInput(f.entrada), salida: isoALocalInput(f.salida), err: '', busy: false };
  render();
};
A.corrGuardar = async () => {
  const s = V.sheet; if (!s || s.tipo !== 'corregirFichaje') return;
  if (!s.entrada) { s.err = 'Falta la hora de entrada.'; return render(); }
  if (s.salida && s.salida <= s.entrada) { s.err = 'La salida tiene que ser después de la entrada.'; return render(); }
  s.err = ''; s.busy = true; render();
  if (!navigator.onLine) { s.busy = false; avisar('Sin conexión — no se ha guardado'); return render(); }
  try {
    await Sysefen.db.corregirFichaje(s.id, {
      entrada: new Date(s.entrada).toISOString(),
      salida: s.salida ? new Date(s.salida).toISOString() : null,
    });
    await refrescarDatos();
    V.sheet = null;
    toast('Fichaje corregido');
    render();
  } catch (e) {
    s.busy = false;
    avisar('No se pudo guardar: ' + (e && e.message ? e.message : 'error'));
    await refrescarDatos(); render();
  }
};

// Lista de meses 'YYYY-MM' que cubre el rango elegido (mes / año / historial).
// 'ano': todo el año del mes que se está viendo, sin pasarse del mes actual.
// 'historial': desde el alta del empleado (o su primer fichaje si no hay alta
// registrada) hasta el mes actual.
function mesesEnRango(userId, rango, mesBase) {
  const hoy = hoyISO().slice(0, 7);
  if (rango === 'ano') {
    const anio = mesBase.slice(0, 4);
    const out = [];
    for (let m = 1; m <= 12; m++) {
      const mm = anio + '-' + String(m).padStart(2, '0');
      if (mm > hoy) break;
      out.push(mm);
    }
    return out;
  }
  if (rango === 'historial') {
    const empId = empIdDeUser(userId);
    const row = empId ? empRowById(empId) : null;
    // Se arranca por lo MÁS ANTIGUO entre el alta y el primer fichaje. Si solo
    // se mirara el alta, un histórico importado de antes de crear la ficha se
    // quedaría fuera del papel sin que nadie se diera cuenta.
    const alta = altaEmp(row);
    const fs = S.fichajes.filter((f) => f.userId === userId);
    const primerFichaje = fs.length
      ? fs.reduce((min, f) => (f.entrada < min ? f.entrada : min), fs[0].entrada).slice(0, 7)
      : null;
    const candidatos = [alta ? alta.slice(0, 7) : null, primerFichaje].filter(Boolean);
    const desde = candidatos.length ? candidatos.sort()[0] : mesBase;
    const out = [];
    let [y, m] = desde.split('-').map(Number);
    const [hy, hm] = hoy.split('-').map(Number);
    while (y < hy || (y === hy && m <= hm)) {
      out.push(y + '-' + String(m).padStart(2, '0'));
      m++; if (m > 12) { m = 1; y++; }
    }
    return out;
  }
  return [mesBase];
}
A.exportarPlanillaCSV = () => {
  const userId = V.planEmp;
  const u = userById(userId);
  const rango = V.planRango || 'mes';
  const mesBase = V.planMes || hoyISO().slice(0, 7);
  const meses = mesesEnRango(userId, rango, mesBase);
  const row = empRowById(empIdDeUser(userId));
  // Cabecera: el CSV salía sin decir de quién era. Un registro de jornada tiene
  // que identificar a la persona y a la empresa por sí solo.
  const filas = [
    ['REGISTRO DE JORNADA'],
    ['Empresa', S.empresa + (S.cif ? ' · ' + S.cif : '')],
    ['Empleado', nombreLegal(userId)],
  ];
  if (altaEmp(row)) filas.push(['Fecha de alta', fechaConAnio(altaEmp(row))]);
  if (row && row.fecha_baja) filas.push(['Fecha de baja', fechaConAnio(row.fecha_baja + 'T12:00')]);
  filas.push(['Periodo', rango === 'mes' ? mesLargo(mesBase) : rango === 'ano' ? 'Año ' + mesBase.slice(0, 4) : 'Historial completo']);
  filas.push([]);
  filas.push(['Fecha', 'Entrada', 'Salida', 'Horas', 'Estado']);
  let totalMin = 0;
  meses.forEach((mes) => {
    planillaMes(userId, mes).dias.forEach((x) => {
      if (x.min != null) totalMin += x.min;
      filas.push([mes + '-' + String(x.dd).padStart(2, '0'), x.entrada ? hhmm(x.entrada) : '', x.salida ? hhmm(x.salida) : '', x.min != null ? horasLargas(x.min) : '', x.estado]);
    });
  });
  filas.push([]);
  filas.push(['Total', '', '', horasLargas(totalMin), '']);
  const csv = '\uFEFF' + filas.map((r) => r.map((c) => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'planilla-' + sinTildes(nombreLegal(userId) || 'empleado').replace(/\s+/g, '-') + '-' + rango + '-' + hoyISO() + '.csv';
  a.click();
  toast('Planilla exportada en CSV');
};

// Minutos imputados a una obra (categoría 'obra'), opcionalmente por empleado
// y/o por fecha. Las horas de obra salen SIEMPRE de las imputaciones.
function minutosObraImp(obraId, userId, fecha) {
  return S.imputaciones
    .filter((i) => i.categoria === 'obra' && i.obraId === obraId
      && (!userId || i.userId === userId) && (!fecha || i.fecha === fecha))
    .reduce((t, i) => t + (i.minutos || 0), 0);
}
// Empleados con horas imputadas a esta obra.
const empleadosDeObra = (obraId) => {
  const ids = new Set(S.imputaciones.filter((i) => i.categoria === 'obra' && i.obraId === obraId).map((i) => i.userId));
  return equipo().filter((u) => ids.has(u.id));
};
// Rango de fechas (strings 'YYYY-MM-DD', comparables directo con imputaciones.fecha)
// para los desgloses "por período" de una obra. null = sin filtro (todo el histórico).
function rangoFechas(rango) {
  const hoy = hoyISO();
  if (rango === 'hoy') return { desde: hoy, hasta: hoy };
  if (rango === 'semana') {
    const d = new Date(); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return { desde: fechaLocal(d), hasta: hoy };
  }
  if (rango === 'mes') return { desde: hoy.slice(0, 7) + '-01', hasta: hoy };
  if (rango === 'ano') return { desde: hoy.slice(0, 4) + '-01-01', hasta: hoy };
  return null;
}
// Igual que minutosObraImp, pero por período (hoy/semana/mes) en vez de un
// único día. Base de "Horas de obra" con desglose diario/semanal/mensual/total.
// Horas dedicadas a una obra. Salen de DOS sitios y hay que sumarlos sin
// contar nada dos veces:
//   1. Las IMPUTACIONES de categoría 'obra'. Es la fuente PRINCIPAL, y no por
//      costumbre: el servidor no deja imputar más minutos de los que esa
//      persona tiene realmente fichados ese día, así que reparten la jornada
//      real y cuadran con el registro horario.
//   2. Los PARTES de trabajo, como red de seguridad. Sus horas se escriben
//      libres, sin tope de presencia, así que solo se cuentan cuando esa
//      persona NO imputó nada a esa obra ese día: si no, esas horas se
//      perderían por no haber hecho el segundo paso.
//
// Antes esto solo miraba las imputaciones, así que una obra con partes hechos y
// sin imputar aparecía con cero horas.
function minutosObraRango(obraId, userId, rango) {
  const r = rangoFechas(rango);
  const enRango = (f) => !r || (f >= r.desde && f <= r.hasta);
  const imputado = new Set();
  let total = 0;

  S.imputaciones
    .filter((i) => i.categoria === 'obra' && i.obraId === obraId
      && (!userId || i.userId === userId) && enRango(i.fecha))
    .forEach((i) => {
      total += i.minutos || 0;
      imputado.add(i.userId + '|' + i.fecha);
    });

  S.partes
    .filter((p) => p.obraId === obraId && p.estado !== 'anulado' && enRango(p.fecha))
    .forEach((p) => {
      Object.keys(p.horas || {}).forEach((uid) => {
        if (userId && uid !== userId) return;
        if (imputado.has(uid + '|' + p.fecha)) return;
        total += Math.round((p.horas[uid] || 0) * 60);
      });
    });

  return total;
}
// Resumen de imputaciones por categoría (Obra/Despacho/Preparación/Desplazamiento/
// Otros) en un período, para el gráfico de "Horas" > "Resumen por categoría".
// admin/jefe ven todo el equipo; un operario solo ve las suyas (mismo criterio
// que el resto de la sección Horas).
function resumenCategorias(rango) {
  const r = rangoFechas(rango);
  const soloYo = !puedeCrear();
  const base = S.imputaciones.filter((i) =>
    (!r || (i.fecha >= r.desde && i.fecha <= r.hasta)) && (!soloYo || i.userId === V.user.id));
  const totalMin = base.reduce((t, i) => t + (i.minutos || 0), 0);
  const filas = IMP_CATS.map(([c, lab]) => {
    const min = base.filter((i) => i.categoria === c).reduce((t, i) => t + (i.minutos || 0), 0);
    return { cat: c, lab, min, pct: totalMin > 0 ? Math.round((min / totalMin) * 100) : 0 };
  });
  return { filas, totalMin };
}

// Personal y horas sugeridos del parte = imputaciones REALES a esa obra ese
// día. (No es la presencia: es el tiempo que se imputó a esta obra.)
function horasDeObraEnFecha(oid, fecha) {
  const horas = {};
  S.imputaciones
    .filter((i) => i.categoria === 'obra' && i.obraId === oid && i.fecha === fecha && i.userId)
    .forEach((i) => { horas[i.userId] = (horas[i.userId] || 0) + i.minutos / 60; });
  Object.keys(horas).forEach((k) => { horas[k] = cuarto(horas[k]); });
  return horas;
}

  if (!oid) { A.nuevoParteElegir(); return; }

  const fecha = hoyISO(); // por defecto, siempre el día en curso

A.togglePersona = (id) => {
  const inc = V.draft.incluidos; const i = inc.indexOf(id);
  if (i < 0) {
    // Al sumar a alguien, arranca con las MISMAS horas que ya tiene el resto:
    // lo normal es que vayan y vuelvan juntos de la obra. Si hace falta que
    // uno lleve otras horas, se le cambian aparte con su propia rueda.
    if (!(V.draft.horas[id] > 0)) {
      const ref = inc.map((x) => V.draft.horas[x] || 0).find((h) => h > 0);
      if (ref) V.draft.horas[id] = ref;
    }
    inc.push(id);
  } else inc.splice(i, 1);
  render();
};

async function añadirArchivo(file) {
  try {
    const esImg = /^image\//.test(file.type);
    const data = esImg ? await comprimir(file) : await leerDataURL(file);
    const peso = data.length * 0.75;
    if (peso > 1.6e6 && !esImg) { avisar('El archivo es muy grande (máx ~1,5 MB).'); return; }
    V.draft.adjuntos.push({
      id: uid(), nombre: file.name || 'foto.jpg',
      ext: (file.name.split('.').pop() || (esImg ? 'jpg' : 'file')).toUpperCase().slice(0, 4),
      peso: (peso / 1024 > 900 ? (peso / 1048576).toFixed(1) + ' MB' : Math.round(peso / 1024) + ' KB'),
      img: esImg, data,
    });
    render();
  } catch (e) { avisar('No se pudo adjuntar ese archivo.'); }
}
const leerDataURL = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
// `max` y `calidad` con valores por defecto para las fotos de parte; el avatar
// pide 256 px, que es de sobra para un círculo de 76.
async function comprimir(file, max = 1100, calidad = 0.72) {
  const url = await leerDataURL(file);
  return new Promise((res) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL('image/jpeg', calidad));
    };
    img.onerror = () => res(url);
    img.src = url;
  });
}

A.guardarEnviar = async (enviar) => {
  const d = V.draft; if (!d) return;
  if (!navigator.onLine) { avisar('Sin conexión — el parte no se ha guardado'); return; }
  const empId = empIdDeUser(V.user.id);
  const ahora = new Date().toISOString();
  const campos = {
    obra_id: d.obraId,
    fecha: d.fecha,
    autor_id: empId || null,
    descripcion: d.desc,
    nivel_incidencia: d.nivel,
    incidencia: d.nivel !== 'Sin incidencias' ? (d.inc || null) : null,
    observaciones: d.obs || null,
    firmante: d.firmante || null,
    firma: d.firma || null,
    email_cliente: d.email || null,
    estado: enviar ? 'enviado' : 'firmado',
    actualizado_en: ahora,
  };
  const horasFilas = d.incluidos
    .filter((id) => (d.horas[id] || 0) > 0)
    .map((id) => { const eId = empIdDeUser(id); return eId ? { empleado_id: eId, horas: d.horas[id] } : null; })
    .filter(Boolean);
  const matsFilas = d.mats.filter((m) => m.nombre.trim()).map((m) => ({
    nombre: m.nombre.trim(), cantidad: m.cant || null, importe: null, compra: !!m.compra,
  }));
  try {
    const nuevo = await Sysefen.db.crearParte(campos);
    if (horasFilas.length) await Sysefen.db.guardarHorasParte(nuevo.id, horasFilas);
    if (matsFilas.length) await Sysefen.db.guardarMaterialesParte(nuevo.id, matsFilas);
    // Las fotos van a Supabase Storage. Si alguna falla no se tira el parte
    // entero a la basura: se guarda igual y se dice cuántas no subieron, que
    // es mejor que perder el trabajo escrito por una foto.
    const fallos = [];
    let motivo = '';
    for (const adj of (d.adjuntos || [])) {
      try { await Sysefen.db.subirAdjunto(nuevo.id, adj); }
      catch (err) { fallos.push(adj.nombre || 'archivo'); motivo = motivo || (err && err.message) || ''; }
    }
    await sincronizarPartes();
    if (fallos.length) {
      // Decir POR QUÉ. Y no prometer "vuelve a adjuntarla desde el parte": en un
      // parte ya guardado todavía no se pueden añadir fotos.
      const sinAlmacen = /bucket not found|does not exist|PGRST205|schema cache/i.test(motivo);
      avisar(sinAlmacen
        ? 'El parte se guardó, pero las fotos no tienen dónde guardarse: falta ejecutar sql/etapa12_adjuntos.sql en Supabase.'
        : 'El parte se guardó, pero no subió ' + fallos.length + (fallos.length === 1 ? ' foto' : ' fotos') + (motivo ? ': ' + motivo : '.'));
    }
    const p = S.partes.find((x) => x.id === nuevo.id);
    V.verParte = nuevo.id; V.draft = null;
    if (enviar && p) enviarEmail(p);
    V.view = 'ok'; render();
  } catch (e) {
    avisar('No se pudo guardar el parte: ' + (e && e.message ? e.message : 'error'));
    render();
  }
};
function enviarEmail(p) {
  const o = obraById(p.obraId);
  const lineas = [

    'Parte de trabajo ' + p.ref,
    '',
    'Cliente: ' + o.cliente,
    'Obra: ' + (o.dir || '—'),
    'Fecha: ' + fechaLarga(p.fecha),
    '',
    'TRABAJOS REALIZADOS',
    p.desc,
    '',
    'HORAS',
    ...Object.keys(p.horas).map((id) => '- ' + userById(id).nombre + ': ' + fmtH(p.horas[id]) + ' h'),
    'Total: ' + fmtH(totalHoras(p)) + ' h',
  ];
  const mats = p.mats.filter((m) => m.nombre && m.nombre.trim());
  if (mats.length) {
    lineas.push('', 'MATERIALES UTILIZADOS', ...mats.map((m) => '- ' + m.nombre + (m.cant ? ' — ' + m.cant : '')));
  }
  if (p.nivel !== 'Sin incidencias') lineas.push('', 'INCIDENCIA (' + p.nivel + ')', p.inc || '—');
  // No se promete un adjunto: esto es un `mailto:`, que abre el borrador en la
  // app de correo del móvil y NO puede llevar archivos. Decir "se adjunta el
  // PDF" hacía que el cliente recibiera un correo prometiendo algo que no iba.

  lineas.push('', 'Firmado por ' + (p.firmante || 'el cliente') + ' el ' + fechaLarga(p.fecha) + '.', '', 'Si necesita el PDF firmado, respóndanos a este correo y se lo hacemos llegar.');
  const dest = [p.email, S.emailCopia].filter(Boolean).join(',');
  const url = 'mailto:' + encodeURIComponent(dest) + '?subject=' + encodeURIComponent('Parte de trabajo ' + p.ref + ' — ' + o.cliente) + '&body=' + encodeURIComponent(lineas.join('\n'));
  location.href = url;
}

// traerlas ANTES de imprimir: si se pusieran como enlace, el navegador podría
// mandar el papel a la impresora con los huecos todavía en blanco.
async function cargarFotosParte(p) {
  const pendientes = (p.adjuntos || []).filter((a) => a.img && a.ruta && !a.data);
  if (!pendientes.length) return true;
  let fallos = 0;
  for (const a of pendientes) {
    try {
      const blob = await Sysefen.db.descargarAdjunto(a.ruta);
      a.data = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob);
      });
    } catch (e) { fallos++; }
  }
  return fallos === 0;
}

   Transcribe a la app las horas que ya estaban anotadas en otro sitio (partes

// Parte el CSV en filas ya validadas. No toca la base de datos: solo decide qué
// entraría y qué no, y por qué, para poder enseñarlo antes de escribir nada.
function analizarCSV(texto) {
  const limpio = String(texto).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const lineas = limpio.split('\n').map((l) => l.trim()).filter((l) => l && !l.startsWith('#'));
  if (!lineas.length) return { error: 'El archivo está vacío.' };

  const sep = [';', ',', '\t'].map((s) => [s, lineas[0].split(s).length]).sort((a, b) => b[1] - a[1])[0];
  if (sep[1] < 4) return { error: 'No encuentro las 4 columnas (empleado, fecha, entrada, salida). Revisa el separador.' };
  const parte = (l) => l.split(sep[0]).map((c) => c.trim().replace(/^"|"$/g, ''));

  const cab = parte(lineas[0]).map(sinTildes);
  const col = {};
  ['empleado', 'fecha', 'entrada', 'salida'].forEach((n) => { col[n] = cab.indexOf(n); });
  const falta = Object.keys(col).filter((n) => col[n] < 0);
  if (falta.length) return { error: 'Faltan columnas en la cabecera: ' + falta.join(', ') + '.' };

  // Índice de personas por nombre y por email, sin tildes ni mayúsculas.
  const porNombre = {};
  S.users.forEach((u) => {
    porNombre[sinTildes(u.nombre)] = u;
    const row = empRowById(empIdDeUser(u.id));
    if (row && row.email) porNombre[sinTildes(row.email)] = u;
  });

  const aFecha = (v) => {
    const s = String(v).trim();
    let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/);
    if (m) return m[3] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[1]).padStart(2, '0');
    return null;
  };
  const aHora = (v) => {
    const m = String(v).trim().match(/^(\d{1,2})[:.h](\d{2})(?::\d{2})?$/);
    if (!m) return null;
    const h = +m[1], mi = +m[2];
    if (h > 23 || mi > 59) return null;
    return String(h).padStart(2, '0') + ':' + m[2];
  };

  const hoy = hoyISO();
  const ok = [], mal = [];
  const vistas = {};                       // duplicados dentro del propio CSV
  const yaEnBase = {};                     // duplicados contra lo ya cargado
  S.fichajes.forEach((f) => { yaEnBase[f.userId + '|' + new Date(f.entrada).getTime()] = true; });
  const tramos = {};                       // solapes por persona y día

  lineas.slice(1).forEach((linea, i) => {
    const n = i + 2;                       // nº de línea en el archivo, para el aviso
    const c = parte(linea);
    const crudo = c.join(' · ');
    const rechaza = (motivo) => mal.push({ n, crudo, motivo });

    const u = porNombre[sinTildes(c[col.empleado])];
    if (!u) return rechaza('No hay ningún empleado que se llame "' + (c[col.empleado] || '') + '"');
    const empId = empIdDeUser(u.id);
    if (!empId) return rechaza(u.nombre + ' no está vinculado en Supabase');

    const fecha = aFecha(c[col.fecha]);
    if (!fecha) return rechaza('Fecha no válida: "' + (c[col.fecha] || '') + '"');
    if (fecha > hoy) return rechaza('Fecha en el futuro: ' + fecha);

    const h1 = aHora(c[col.entrada]), h2 = aHora(c[col.salida]);
    if (!h1) return rechaza('Hora de entrada no válida: "' + (c[col.entrada] || '') + '"');
    if (!h2) return rechaza('Hora de salida no válida: "' + (c[col.salida] || '') + '"');
    if (h2 <= h1) return rechaza('La salida (' + h2 + ') no es posterior a la entrada (' + h1 + ')');

    const entrada = new Date(fecha + 'T' + h1);
    const salida = new Date(fecha + 'T' + h2);
    const min = Math.round((salida - entrada) / 60000);
    if (min > 16 * 60) return rechaza('Más de 16 h seguidas (' + durMin(min) + '): revisa esa fila');

    const clave = u.id + '|' + entrada.getTime();
    if (vistas[clave]) return rechaza('Repetida en el propio archivo');
    if (yaEnBase[clave]) return rechaza('Ya estaba cargada en la app');
    vistas[clave] = true;

    const k = u.id + '|' + fecha;
    tramos[k] = tramos[k] || [];
    if (tramos[k].some((t) => h1 < t.h2 && h2 > t.h1)) return rechaza('Se solapa con otro tramo de ' + u.nombre + ' ese mismo día');
    tramos[k].push({ h1, h2 });

    ok.push({ userId: u.id, empleado_id: empId, nombre: u.nombre, fecha, h1, h2, min, entrada: entrada.toISOString(), salida: salida.toISOString() });
  });

  // Resumen por persona: lo que de verdad va a quedar en la planilla.
  const porPersona = {};
  ok.forEach((f) => {
    const p = porPersona[f.userId] = porPersona[f.userId] || { nombre: f.nombre, tramos: 0, min: 0, dias: {}, desde: f.fecha, hasta: f.fecha };
    p.tramos++; p.min += f.min; p.dias[f.fecha] = true;
    if (f.fecha < p.desde) p.desde = f.fecha;
    if (f.fecha > p.hasta) p.hasta = f.fecha;
  });
  return { ok, mal, personas: Object.values(porPersona).map((p) => ({ ...p, dias: Object.keys(p.dias).length })) };
}

A.importarConfirmar = async () => {
  const im = V.imp; if (!im || im.busy || !im.ok.length) return;
  if (!navigator.onLine) { avisar('Sin conexión — no se ha importado nada.'); return; }
  im.busy = true; im.hechas = 0; render();
  const LOTE = 100;
  try {
    for (let i = 0; i < im.ok.length; i += LOTE) {
      const trozo = im.ok.slice(i, i + LOTE);
      await Sysefen.db.importarFichajes(trozo.map((f) => ({ empleado_id: f.empleado_id, entrada: f.entrada, salida: f.salida })));
      im.hechas = Math.min(i + LOTE, im.ok.length); render();
    }
    await refrescarDatos();
    const n = im.hechas;
    V.imp = null; V.view = 'ajustes';
    toast(n + (n === 1 ? ' fichaje importado' : ' fichajes importados'));
    render();
  } catch (e) {
    im.busy = false;
    const msg = e && e.message ? e.message : 'error';
    if (msg === 'FALTA_ETAPA9') {
      im.error = 'Falta ejecutar sql/etapa9_importar_historico.sql en Supabase: sin esa migración el servidor pisaría todas las horas con la fecha de hoy. No se ha guardado nada.';
    } else if (/fichajes_empleado_entrada_uk|duplicate key/i.test(msg)) {
      im.error = 'Hay filas que ya estaban cargadas. Vuelve a exportar el CSV solo con lo que falte, o recarga la app para que se vea lo que ya hay.';
    } else {
      im.error = 'No se pudo importar: ' + msg + (im.hechas ? ' (se guardaron las ' + im.hechas + ' primeras)' : '');
    }
    render();
  }
};

A.instalar = async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; return; }
  V.sheet = { tipo: 'instalar' }; render();
};

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  const v = V.view;
  let html = '';
  if (!V.user) html = v === 'pin' ? vPin() : vLogin();
  else if (v === 'hoy') html = vHoy();
  else if (v === 'obras') html = vObras();
  else if (v === 'obra') html = vObra();
  else if (v === 'alta') html = vAlta();
  else if (v === 'partes') html = vPartes();
  else if (v === 'horas') html = vHoras();
  else if (v === 'resumenImp') html = vResumenImp();
  else if (v === 'imputar' && puedeCrear()) html = vImputar();
  else if (v === 'imputarGrupo' && puedeCrear()) html = vImputarGrupo();
  else if (v === 'imputarEmp' && puedeCrear()) html = vImputarEmpleado();
  else if (v === 'empleados' && esAdmin()) html = vEmpleados();
  else if (v === 'empleado' && esAdmin()) html = vEmpleado();
  else if (v === 'planilla' && (esAdmin() || V.planEmp === V.user.id)) html = vPlanilla();
  else if (v === 'importar' && esAdmin()) html = vImportar();
  else if (v === 'ajustes') html = vAjustes();
  else if (v === 'p1') html = vP1();
  else if (v === 'p2') html = vP2();
  else if (v === 'p3') html = vP3();
  else if (v === 'ok') html = vOk();
  if (V.user && ['hoy', 'obras', 'obra', 'partes', 'horas', 'imputar', 'empleados', 'ajustes'].includes(v)) html += nav(v);
  if (!navigator.onLine && V.user) html = '<div class="offline">Sin conexión — todo se guarda en el móvil</div>' + html;
  // Red de seguridad: si un sheet revienta al pintarse (p. ej. depende de
  // datos que cambiaron justo antes, como el usuario tras salir), que se
  // cierre solo en vez de dejar toda la pantalla congelada sin avisar.
  if (V.sheet) { try { html += sheet(); } catch (e) { V.sheet = null; } }
  app.innerHTML = html;
  if (V.view === 'p2') montarFirma();
  if (V.sheet && V.sheet.tipo === 'firmaPlanilla') montarFirmaPlanilla();
  if (V.view === 'imputarEmp' || V.view === 'imputarGrupo' || V.view === 'p1') montarRelojes();
  const sc = app.querySelector('.scroll,.hoja'); if (sc && scrollMemo[V.view] != null) sc.scrollTop = scrollMemo[V.view];
}
const scrollMemo = {};
document.addEventListener('scroll', (e) => {
  if (e.target.classList && (e.target.classList.contains('scroll') || e.target.classList.contains('hoja'))) scrollMemo[V.view] = e.target.scrollTop;
}, true);

const OBRA_RANGOS = [['hoy', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['total', 'Total']];
function vObra() {
  const o = obraById(V.obraId);
  if (!o) { V.view = 'obras'; return vObras(); }
  const partes = S.partes.filter((p) => p.obraId === o.id);
  const rango = V.obraRango || 'total';
  // Se listan los asignados MÁS cualquiera que tenga horas en esta obra: si
  // alguien echó horas sin estar asignado, sus horas están igual de firmadas y
  // no pueden desaparecer del reparto.
  const conHoras = equipoTodos().filter((x) => minutosObraRango(o.id, x.id, rango) > 0);
  const gente = empleadosDeObra(o.id).slice();
  conHoras.forEach((x) => { if (!gente.some((g) => g.id === x.id)) gente.push(x); });
  const filas = gente
    .map((x) => ({ x, m: minutosObraRango(o.id, x.id, rango) }))
    .filter((f) => rango === 'total' || f.m > 0)
    .sort((a, b) => b.m - a.m);
  const total = filas.reduce((t, f) => t + f.m, 0) || 1;
  return `<div class="hdr-dark">
    <div class="back" data-a="ir" data-v="obras">‹ Obras</div>
    <div style="font:600 27px/1.1 var(--cond)">${esc(o.cliente)}</div>
    <div class="sub" style="color:rgba(255,255,255,.5);margin-top:6px">${esc(o.dir || '')}${o.contacto ? ' · ' + esc(o.contacto) : ''}</div>
    ${puedeCrear() ? `<div class="row g8" style="margin-top:16px">
      <button class="pill pill-verde grow" data-a="nuevoParte" data-id="${o.id}" style="padding:14px">Nuevo parte</button>
      <button class="pill grow" data-a="editarObra" data-id="${o.id}" style="padding:14px;background:rgba(255,255,255,.12);color:#fff">Editar</button>
    </div>` : ''}
  </div>
  <div class="scroll pad pb-nav">
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:10px">
      <div class="lbl" style="font-weight:600;font-size:12px;color:var(--t2)">Horas por empleado</div>
      <div class="wrap">${OBRA_RANGOS.map(([r, l]) => `<div class="chip" style="padding:6px 11px;font-size:11px${r === rango ? ';background:var(--tinta);color:#fff;border-color:var(--tinta)' : ''}" data-a="obraRango" data-r="${r}">${l}</div>`).join('')}</div>
    </div>
    <div class="card" style="padding:6px 15px 13px">
      ${filas.map(({ x, m }) => `<div style="padding:11px 0;border-bottom:1px solid var(--l1)">
        <div class="row" style="align-items:baseline;justify-content:space-between;gap:14px">
          <div style="font:500 15px/1.2 var(--sans)" class="grow">${esc(x.nombre)}</div>
          <div class="num" style="font-size:16px;flex:none">${durMin(m)}</div>
        </div><div class="prog"><i style="width:${Math.round((m / total) * 100)}%"></i></div>
      </div>`).join('') || `<div class="tiny" style="padding:11px 0">${rango === 'total' ? 'Nadie ha imputado horas a esta obra todavía.' : 'Sin horas imputadas en este período.'}</div>`}
      <div class="row" style="justify-content:space-between;padding-top:12px"><div class="sub">Total ${rango === 'total' ? 'obra' : OBRA_RANGOS.find((r) => r[0] === rango)[1].toLowerCase()}</div><div class="num" style="font-size:19px">${durMin(filas.reduce((t, f) => t + f.m, 0))}</div></div>
    </div>
    ${puedeCrear() ? `<div class="row g8" style="margin-top:10px">
      <button class="pill grow" data-a="imprimirHorasObra" style="padding:12px;text-align:center;background:var(--tinta);color:#fff">Imprimir PDF</button>
      <button class="pill grow" data-a="exportarHorasObraCSV" style="padding:12px;text-align:center">Exportar CSV</button>
    </div>` : ''}
