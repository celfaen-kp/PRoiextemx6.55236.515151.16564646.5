/* --- albaranes y recibos de la obra (control interno: jefe y admin) --- */
const DOC_TIPOS = [['albaran', 'Albarán'], ['recibo', 'Recibo'], ['factura', 'Factura'], ['otro', 'Otro']];
const docTipoNombre = (t) => (DOC_TIPOS.find((x) => x[0] === t) || [t, 'Documento'])[1];
const euros = (n) => Number(n || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const faltaTablaDocs = (msg) => /does not exist|schema cache|PGRST205|bucket not found/i.test(String(msg || ''));
Object.assign(V, { obraDocs: {}, obraDocsUrls: {}, obraDocsError: {}, confirmarBorrarDoc: null });
// El archivo elegido va fuera de V.sheet: un PDF puede pesar megas y V se
// recorre en cada repintado.
let docArchivo = null;

A.cargarDocsObra = async (obraId) => {
  try {
    const filas = await Sysefen.db.listarDocumentosObra(obraId);
    V.obraDocs[obraId] = filas; V.obraDocsError[obraId] = null;
    // Los enlaces firmados caducan en una hora: se piden al abrir la obra.
    const rutas = filas.map((d) => d.ruta);
    if (rutas.length) Object.assign(V.obraDocsUrls, await Sysefen.db.urlsFirmadasDocs(rutas));
  } catch (e) {
    V.obraDocsError[obraId] = (e && e.message) || 'error';
  }
  if (V.view === 'obra' && V.obraId === obraId) render();
};

A.nuevoDocObra = () => {
  if (!puedeCrear()) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*,application/pdf';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    const esImg = /^image\//.test(file.type);
    if (!esImg && file.size > 10 * 1048576) { avisar('Ese PDF pesa más de 10 MB. Prueba con una foto del documento.'); return; }
    try {
      const data = esImg ? await comprimir(file, 1600, 0.75) : await leerDataURL(file);
      const base = String(file.name || (esImg ? 'foto' : 'documento')).replace(/\.[^.]+$/, '');
      docArchivo = { data, nombre: base + (esImg ? '.jpg' : '.pdf'), esImagen: esImg };
      V.sheet = { tipo: 'docObra', obraId: V.obraId, tipoDoc: 'albaran', proveedor: '', importe: '', fecha: hoyISO(), nota: '', busy: false, err: '' };
      render();
    } catch (e) { avisar('No se pudo leer ese archivo.'); }
  };
  inp.click();
};

A.docTipo = (t) => { if (V.sheet && V.sheet.tipo === 'docObra') { V.sheet.tipoDoc = t; render(); } };

A.guardarDocObra = async () => {
  const s = V.sheet;
  if (!s || s.tipo !== 'docObra' || s.busy || !docArchivo) return;
  if (!navigator.onLine) { s.err = 'Sin conexión: no se ha guardado.'; return render(); }
  let importe = null;
  if (String(s.importe || '').trim()) {
    importe = numeroVisita(s.importe, false);
    if (importe == null) { s.err = 'El importe no es un número.'; return render(); }
  }
  s.busy = true; s.err = ''; render();
  try {
    await Sysefen.db.subirDocumentoObra(s.obraId, {
      data: docArchivo.data, nombre: docArchivo.nombre, esImagen: docArchivo.esImagen,
      tipo: s.tipoDoc, proveedor: String(s.proveedor || '').trim() || null, importe,
      fecha: s.fecha || hoyISO(), nota: String(s.nota || '').trim() || null,
    });
    docArchivo = null; V.sheet = null;
    toast(docTipoNombre(s.tipoDoc) + ' guardado en la obra.');
    await A.cargarDocsObra(s.obraId);
    render();
  } catch (e) {
    s.busy = false;
    const msg = (e && e.message) || 'error';
    s.err = faltaTablaDocs(msg) ? 'Falta preparar Supabase: ejecuta sql/etapa21_obra_documentos.sql.' : 'No se pudo guardar: ' + msg;
    render();
  }
};

let borrarDocT;
A.borrarDocObra = async (id) => {
  const d = (V.obraDocs[V.obraId] || []).find((x) => x.id === id); if (!d) return;
  if (V.confirmarBorrarDoc !== id) {
    V.confirmarBorrarDoc = id; render();
    clearTimeout(borrarDocT);
    borrarDocT = setTimeout(() => { if (V.confirmarBorrarDoc === id) { V.confirmarBorrarDoc = null; if (V.view === 'obra') render(); } }, 3500);
    return;
  }
  V.confirmarBorrarDoc = null;
  if (!navigator.onLine) { avisar('Sin conexión: no se ha borrado.'); return render(); }
  try {
    await Sysefen.db.borrarDocumentoObra(d.id, d.ruta);
    toast(docTipoNombre(d.tipo) + ' borrado.');
    await A.cargarDocsObra(V.obraId);
  } catch (e) { avisar('No se pudo borrar: ' + ((e && e.message) || 'error')); render(); }
};

    <div class="tiny" style="margin-top:8px">Foto o PDF. Solo lo ven jefes y Administración.</div>` : ''}`;

/* ---------- material pendiente y notas del equipo (sql/etapa36) ------------
 * Una lista común: lo que hay que comprar o traer del despacho. Cualquiera lo
 * apunta (escrito o dictado), otro se apunta a llevarlo para que no lo compren
 * dos, y al tacharlo se le puede poner obra e importe: lo tachado con obra es
 * MATERIAL EXTRA de esa obra (sale en su ficha, aparte de los partes).
 * ------------------------------------------------------------------------- */
Object.assign(V, {
  mat: { items: [], notas: [], cargado: false, cargando: false, error: null, tab: 'pend', filtro: 'todo', avisado: false },
  matNuevo: { texto: '', tipo: 'comprar', obraId: null, urgente: false, voz: false },
  notaNueva: { texto: '', voz: false },
  dicta: null,
});
const faltaTablaMat = (msg) => /does not exist|schema cache|PGRST205|material_pedidos|notas_equipo/i.test(String(msg || '')) && /exist|schema|PGRST205/i.test(String(msg || ''));
const nombreEmp = (empId) => { const r = empRowById(empId); return r ? String(r.nombre || '').split(' ')[0] : '—'; };
const matPend = () => V.mat.items.filter((i) => !i.hecho_en);
const obrasAbiertas = () => S.obras.filter((o) => o.estado !== 'Cerrada');
const obraTitulo = (id) => { const o = obraById(id); return o ? o.titulo : ''; };
function cuandoCorto(iso) {
  if (!iso) return '';
  const d = new Date(iso), hoy = hoyISO();
  const dia = fechaLocal(iso);
  const ayer = fechaLocal(new Date(Date.now() - 86400000).toISOString());
  return (dia === hoy ? 'hoy' : dia === ayer ? 'ayer' : fechaCorta(iso)) + ' ' + hhmm(d.toISOString());
}

A.cargarMaterial = async () => {
  const m = V.mat; if (m.cargando || !V.user) return;
  m.cargando = true;
  try {
    if (!empRows.length) { try { await cargarMapaEmpleados(); } catch (e) { /* nombres vacíos */ } }
    if (!S.obras.length) { try { await sincronizarObras(); } catch (e) { /* sin obras */ } }
    const [items, notas] = await Promise.all([Sysefen.db.listarMaterial(), Sysefen.db.listarNotas()]);
    m.items = items || []; m.notas = notas || []; m.error = null;
  } catch (e) { m.error = (e && e.message) || 'error'; }
  finally { m.cargando = false; m.cargado = true; }
  // Al entrar: si hay algo URGENTE que nadie se ha apuntado a llevar, se avisa
  // una vez por sesión. Lo demás ya está en el recuadro amarillo de Hoy.
  if (!m.avisado && !V.sheet && ['hoy', 'agenda'].includes(V.view) && matPend().some((i) => i.urgente && !i.lleva_id)) {
    m.avisado = true; V.sheet = { tipo: 'matAviso' };
  }
  if (['hoy', 'material', 'obra', 'agenda'].includes(V.view)) render();
};

/* --- apuntar --- */
A.matTipo = (t) => { V.matNuevo.tipo = t; render(); };
A.matUrgente = () => { V.matNuevo.urgente = !V.matNuevo.urgente; render(); };
A.matObra = (id) => { V.matNuevo.obraId = V.matNuevo.obraId === id ? null : id; render(); };
A.matAnadir = async () => {
  const n = V.matNuevo, texto = String(n.texto || '').trim();
  if (!texto) { const el = document.getElementById('mat-texto'); if (el) el.focus(); return; }
  if (!navigator.onLine) { avisar('Sin conexión: no se ha apuntado.'); return; }
  try {
    const fila = await Sysefen.db.crearMaterial({ texto, tipo: n.tipo, obra_id: n.obraId || null, urgente: !!n.urgente, voz: !!n.voz, pedido_por: miEmpId() || undefined });
    V.mat.items.unshift(fila);
    V.matNuevo = { texto: '', tipo: n.tipo, obraId: null, urgente: false, voz: false };
    toast('Apuntado.'); render();
  } catch (e) { avisar(faltaTablaMat(e.message) ? 'Falta preparar Supabase (sql/etapa36_material.sql).' : 'No se pudo apuntar: ' + e.message); }
};
A.matLlevo = async (id) => {
  const i = V.mat.items.find((x) => x.id === id); if (!i) return;
  const yoId = miEmpId(); if (!yoId) return;
  const antes = i.lleva_id;
  i.lleva_id = antes === yoId ? null : yoId; render();
  try { Object.assign(i, await Sysefen.db.actualizarMaterial(id, { lleva_id: i.lleva_id })); }
  catch (e) { i.lleva_id = antes; render(); avisar('No se pudo guardar: ' + e.message); }
};

/* --- tachar, poner obra e importe, borrar --- */
A.matAbrir = (id) => {
  const i = V.mat.items.find((x) => x.id === id); if (!i) return;
  V.sheet = { tipo: 'matItem', id, obraId: i.obra_id || null, importe: i.importe != null ? String(i.importe).replace('.', ',') : '', busy: false, borrar: false };
  render();
};
A.matItemObra = (oid) => { const s = V.sheet; if (s && s.tipo === 'matItem') { s.obraId = s.obraId === oid ? null : oid; render(); } };
A.matGuardarItem = async (hecho) => {
  const s = V.sheet; if (!s || s.tipo !== 'matItem' || s.busy) return;
  const i = V.mat.items.find((x) => x.id === s.id); if (!i) return;
  let importe = null;
  if (String(s.importe || '').trim()) {
    importe = numeroVisita(s.importe, false);
    if (importe == null || importe < 0) { avisar('El importe no es un número.'); return; }
  }
  const cambios = { obra_id: s.obraId || null, importe };
  if (hecho === true) Object.assign(cambios, { hecho_en: new Date().toISOString(), hecho_por: miEmpId() || null });
  if (hecho === false) Object.assign(cambios, { hecho_en: null, hecho_por: null });
  s.busy = true; render();
  try {
    Object.assign(i, await Sysefen.db.actualizarMaterial(i.id, cambios));
    V.sheet = null; toast(hecho === true ? 'Tachado.' : hecho === false ? 'Vuelve a estar pendiente.' : 'Guardado.'); render();
  } catch (e) { s.busy = false; render(); avisar('No se pudo guardar: ' + e.message); }
};
A.matBorrar = async () => {
  const s = V.sheet; if (!s || s.tipo !== 'matItem' || s.busy) return;
  if (!s.borrar) { s.borrar = true; return render(); }
  s.busy = true; render();
  try {
    await Sysefen.db.borrarMaterial(s.id);
    V.mat.items = V.mat.items.filter((x) => x.id !== s.id);
    V.sheet = null; toast('Borrado.'); render();
  } catch (e) { s.busy = false; render(); avisar('No se pudo borrar: ' + e.message); }
};

/* --- notas --- */
A.notaGuardar = async () => {
  const n = V.notaNueva, texto = String(n.texto || '').trim(); if (!texto) return;
  if (!navigator.onLine) { avisar('Sin conexión: la nota no se ha guardado.'); return; }
  try {
    const fila = await Sysefen.db.crearNota({ texto, voz: !!n.voz, autor_id: miEmpId() || undefined });
    V.mat.notas.unshift(fila); V.notaNueva = { texto: '', voz: false }; toast('Nota guardada.'); render();
  } catch (e) { avisar(faltaTablaMat(e.message) ? 'Falta preparar Supabase (sql/etapa36_material.sql).' : 'No se pudo guardar: ' + e.message); }
};
A.notaBorrar = async (id) => {
  if (V.notaBorrando !== id) { V.notaBorrando = id; render(); setTimeout(() => { if (V.notaBorrando === id) { V.notaBorrando = null; render(); } }, 3500); return; }
  V.notaBorrando = null;
  try { await Sysefen.db.borrarNota(id); V.mat.notas = V.mat.notas.filter((x) => x.id !== id); render(); }
  catch (e) { avisar('No se pudo borrar: ' + e.message); }
};

/* --- dictado ---------------------------------------------------------------
 * Con el reconocimiento de voz del navegador. Si el móvil no lo deja (algunos
 * iPhone con la app instalada), se avisa de que el micrófono del teclado sirve
 * igual. Mientras se dicta NO se repinta la pantalla: se escribe directo en la
 * caja, para no perder el foco ni lo dicho.
 * ------------------------------------------------------------------------- */
let dictado = null;
A.dictar = (donde) => {
  if (dictado) { dictado.stop(); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { avisar('Este móvil no deja dictar aquí. Toca la caja de texto y usa el micrófono del teclado.'); return; }
  const campo = donde === 'nota' ? V.notaNueva : V.matNuevo;
  const caja = () => document.getElementById(donde === 'nota' ? 'nota-texto' : 'mat-texto');
  const base = String(campo.texto || '').trim();
  let final = '';
  const rec = new SR();
  rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = donde === 'nota';
  rec.onresult = (e) => {
    let parcial = '';
    for (let k = e.resultIndex; k < e.results.length; k++) {
      if (e.results[k].isFinal) final += e.results[k][0].transcript; else parcial += e.results[k][0].transcript;
    }
    campo.texto = [base, final.trim()].filter(Boolean).join(' ');
    campo.voz = true;
    const c = caja(); if (c) c.value = [campo.texto, parcial.trim()].filter(Boolean).join(' ');
  };
  const fin = () => { dictado = null; V.dicta = null; render(); };
  rec.onend = fin;
  rec.onerror = (e) => { if (e && e.error === 'not-allowed') avisar('Sin permiso para el micrófono. Puedes usar el del teclado.'); };
  try { rec.start(); dictado = rec; V.dicta = donde; render(); }
  catch (e) { avisar('No se pudo empezar a dictar. Usa el micrófono del teclado.'); }
};

/* --- control de horas: dos ruedas (horas / minutos, minutos SIEMPRE en pasos
   de 15) tipo selector nativo de fecha/hora. Reemplaza al dial circular de
   arrastre: arrastrar en círculo con el dedo era poco preciso; deslizar una
   rueda hasta que encastra es un gesto que ya se conoce y no depende de
   puntería. Mismo contrato que antes: misma firma de relojHTML, mismas
   acciones al soltar (impReloj / impGrupoReloj / horaReloj), así que ningún
   punto donde se usa el control necesitó cambiar. --- */
const RELOJ_MAX_DEFECTO = 600; // 10:00 h por línea
const RUEDA_ITEM_H = 44;       // alto de fila, en px (debe coincidir con el CSS)
const RUEDA_VISIBLES = 5;      // filas visibles a la vez (impar, para tener centro)
function relojHTML(scope, key, valMin, maxMin, editable, paso) {
  paso = paso || 15;
  const max = Math.max(paso * 2, Math.round((maxMin || RELOJ_MAX_DEFECTO) / paso) * paso);
  const val = Math.max(0, Math.min(max, Math.round((valMin || 0) / paso) * paso));
  if (!editable) {
    return `<div class="rueda ro" style="margin:10px auto 4px;text-align:center"><div style="font:700 28px var(--cond)">${durMin(val)}</div></div>`;
  }
  const maxH = Math.max(1, Math.floor(max / 60));
  const horas = Array.from({ length: maxH + 1 }, (_, i) => i);
  const mins = [0, 15, 30, 45];
  const h0 = Math.min(maxH, Math.floor(val / 60)), m0 = val % 60;
  const pad = (RUEDA_VISIBLES - 1) / 2 * RUEDA_ITEM_H;
  const colHTML = (items, sel, fmt) => `<div class="rueda-col" style="height:${RUEDA_VISIBLES * RUEDA_ITEM_H}px;width:56px">
      <div class="rueda-track">
        <div style="height:${pad}px;flex:none"></div>
        ${items.map((v) => `<div class="rueda-item${v === sel ? ' on' : ''}" data-v="${v}" style="height:${RUEDA_ITEM_H}px">${fmt(v)}</div>`).join('')}
        <div style="height:${pad}px;flex:none"></div>
      </div>
    </div>`;
  return `<div class="rueda" data-scope="${scope}" data-key="${key}" data-max="${max}" data-h="${h0}" data-m="${m0}" style="position:relative;height:${RUEDA_VISIBLES * RUEDA_ITEM_H}px;margin:6px auto 2px;width:150px">
    <div class="rueda-marco" style="height:${RUEDA_ITEM_H}px"></div>
    <div class="row" style="position:relative;z-index:1;height:100%;justify-content:center;align-items:stretch;gap:0">
      ${colHTML(horas, h0, (v) => v)}
      <div style="display:flex;align-items:center;font:600 20px var(--cond);color:var(--t3)">h</div>
      ${colHTML(mins, m0, (v) => String(v).padStart(2, '0'))}
      <div style="display:flex;align-items:center;font:600 20px var(--cond);color:var(--t3)">m</div>
    </div>
  </div>`;
}
// Item más cercano al centro visible de una columna de rueda (el "elegido").
function ruedaCentrado(col) {
  const centro = col.scrollTop + col.clientHeight / 2;
  let best = null, bestD = Infinity;
  col.querySelectorAll('.rueda-item').forEach((it) => {
    const d = Math.abs((it.offsetTop + it.offsetHeight / 2) - centro);
    if (d < bestD) { bestD = d; best = it; }
  });
  return best;
}
// Aplica el valor de una rueda al sitio de V donde vive (mismo destino que el
// commit de montarRelojes, pero sin pasar por A.*: lo usa sincronizarRuedas
// para escribir directo en el draft sin disparar un render a mitad de otra
// acción que ya va a renderizar por su cuenta).
function ruedaEscribir(el, v) {
  const scope = el.dataset.scope, key = el.dataset.key;
  if (scope === 'imp') { const l = V.impDraft && V.impDraft[+key]; if (l) l.minutos = v; }
  else if (scope === 'impGrupo') { const l = V.impGrupoLineas && V.impGrupoLineas[+key]; if (l) l.minutos = v; }
  else if (scope === 'parte') { if (V.draft) V.draft.horas[key] = v / 60; }
  else if (scope === 'parteGrupo') V.horasGrupoMin = v;
  else if (scope === 'cita') { if (V.citaDraft) V.citaDraft.horaMin = v; }
}
// Fuerza a leer AHORA MISMO la posición real de cada rueda montada y la
// vuelca a su sitio en V, sin esperar los 140ms de "asentado" del scroll.
// Se llama justo antes de cualquier acción que lea esos valores para actuar
// (Guardar, Aplicar, Continuar...): si el usuario arrastró la rueda y tocó
// ese botón enseguida, sin esto se leería el valor de ANTES de arrastrar.
function sincronizarRuedas() {
  document.querySelectorAll('.rueda:not(.ro)').forEach((el) => {
    const max = +el.dataset.max;
    const [colH, colM] = el.querySelectorAll('.rueda-col');
    if (!colH || !colM) return;
    const hEl = ruedaCentrado(colH), mEl = ruedaCentrado(colM);
    if (!hEl || !mEl) return;
    const v = Math.max(0, Math.min(max, (+hEl.dataset.v) * 60 + (+mEl.dataset.v)));
    ruedaEscribir(el, v);
  });
}
function montarRelojes() {
  document.querySelectorAll('.rueda:not(.ro)').forEach((el) => {
    const max = +el.dataset.max;
    const [colH, colM] = el.querySelectorAll('.rueda-col');
    if (!colH || !colM) return;
    const pintar = () => [colH, colM].forEach((col) => {
      const activo = ruedaCentrado(col);
      col.querySelectorAll('.rueda-item').forEach((it) => it.classList.toggle('on', it === activo));
    });
    // Al colocar la rueda por código, el navegador dispara igual un evento de
    // scroll. Sin esta bandera, ese scroll "nuestro" se tomaba como si lo
    // hubiera hecho el dedo: confirmaba el valor, eso re-renderizaba la
    // pantalla, el render volvía a colocar la rueda, y vuelta a empezar. Era
    // un bucle: la rueda se destruía y recreaba varias veces por segundo, y
    // por eso costaba que "agarrara" el gesto y se perdía lo que ibas moviendo.
    let programatico = false;
    const posicionar = (col, v) => {
      const item = col.querySelector(`.rueda-item[data-v="${v}"]`);
      if (!item) return;
      const destino = item.offsetTop - (col.clientHeight - item.offsetHeight) / 2;
      if (Math.abs(col.scrollTop - destino) < 1) return;
      programatico = true;
      col.scrollTop = destino;
      setTimeout(() => { programatico = false; }, 60);
    };
    posicionar(colH, +el.dataset.h);
    posicionar(colM, +el.dataset.m);
    pintar();
    let t = null;
    const onScroll = () => {
      if (programatico) return;
      pintar();
      clearTimeout(t);
      t = setTimeout(() => {
        if (!colH.isConnected || !colM.isConnected) return;
        const h = +ruedaCentrado(colH).dataset.v, m = +ruedaCentrado(colM).dataset.v;
        const v = Math.max(0, Math.min(max, h * 60 + m));
        // Se escribe el valor y se refrescan SOLO los números que dependen de
        // él. No se llama a render(): volver a pintar toda la pantalla mata el
        // elemento que el dedo está tocando en ese momento.
        ruedaEscribir(el, v);
        refrescarNumerosRueda();
      }, 140);
    };
    colH.addEventListener('scroll', onScroll, { passive: true });
    colM.addEventListener('scroll', onScroll, { passive: true });
  });
}
// Refresca a mano los números que dependen de las ruedas, sin re-renderizar
// (ver montarRelojes). Cada hueco lleva un data-num en su vista.
function refrescarNumerosRueda() {
  const set = (sel, txt) => document.querySelectorAll(sel).forEach((n) => { n.textContent = txt; });
  if (V.view === 'citaNueva' && V.citaDraft) {
    V.agConfirmar = null;
    document.querySelectorAll('[data-num="citaSolape"]').forEach((n) => { n.innerHTML = agSolapeHTML(V.citaDraft); });
  }
  if (V.view === 'imputarEmp' && V.impEmp) {
    const disp = disponibleImputar(V.impEmp, V.impFecha);
    const imp = (V.impDraft || []).reduce((t, l) => t + (l.minutos || 0), 0);
    const exceso = imp > disp, sinImp = Math.max(0, disp - imp);
    set('[data-num="impImputado"]', durMin(imp));
    document.querySelectorAll('[data-num="impSinImputar"]').forEach((n) => {
      n.textContent = exceso ? '⚠ +' + durMin(imp - disp) : durMin(sinImp);
      n.style.color = exceso ? 'var(--rojo)' : (sinImp === 0 ? 'var(--verde-c)' : 'var(--ambar)');
    });
    document.querySelectorAll('[data-a="impGuardar"]').forEach((b) => { b.disabled = !!(V.impBusy || exceso); });
  } else if (V.view === 'p1' && V.draft) {
    const d = V.draft;
    d.incluidos.forEach((id) => set(`[data-num="parteHoras"][data-id="${id}"]`, fmtH(d.horas[id] || 0) + ' h'));
    set('[data-num="parteTotal"]', fmtH(d.incluidos.reduce((t, id) => t + (d.horas[id] || 0), 0)) + ' h');
  } else if (V.view === 'imputarGrupo') {
    const cand = impGrupoCandidatos(V.impFecha);
    const seleccionados = cand.filter((x) => (V.impGrupoSel || []).includes(x.u.id));
    const lineas = V.impGrupoLineas || [];
    const asignado = lineas.reduce((t, l) => t + (l.minutos || 0), 0);
    const exceso = seleccionados.some((x) => asignado > x.restante);
    const faltaObra = lineas.some((l) => (l.minutos || 0) > 0 && l.categoria === 'obra' && !l.obraId);
    const ok = seleccionados.length > 0 && asignado > 0 && !exceso && !faltaObra && !V.impGrupoBusy;
    set('[data-num="grupoAsignado"]', durMin(asignado));
    set('[data-num="grupoLibre"]', durMin(Math.max(0, impGrupoRestanteMin() - asignado)));
    document.querySelectorAll('[data-a="impGrupoGuardar"]').forEach((b) => {
      b.disabled = !ok;
      b.textContent = V.impGrupoBusy ? 'Guardando…' : 'Guardar ' + durMin(asignado) + ' a ' + seleccionados.length + (seleccionados.length === 1 ? ' persona' : ' personas');
    });
  }
}

const RESUMEN_RANGOS = [['hoy', 'Hoy'], ['semana', 'Semana'], ['mes', 'Mes'], ['ano', 'Año']];
// Barra apilada en vez de torta: con 6 categorías, un gráfico de torta no pasa
// las pruebas de distinción por color (daltonismo); una barra apilada muestra
// exactamente lo mismo (parte del total, con porcentaje y horas) sin ese
// riesgo, y es más fácil de leer con precisión.
// La barra va SIEMPRE en el orden de la paleta, no por horas: solo en ese orden
// los vecinos se distinguen con daltonismo (el verde de 'sysefen' junto al
// naranja de despacho no). La lista de abajo sí va por horas: lleva el nombre.

    ${e.filas.map((f) => `<div class="card" style="margin-bottom:9px">

function vRevisarImp() {
  const u = userById(V.revEmp);
  const mes = V.revMes || hoyISO().slice(0, 7);
  const [anio, m] = mes.split('-').map(Number);
  const ultimo = new Date(anio, m, 0).getDate();
  const hoy = hoyISO();
  const nombreMes = new Date(anio, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  const catLab = (c) => (IMP_CATS.find((x) => x[0] === c) || [c, c])[1];

  // Solo los días con algo: presencia fichada o líneas imputadas.
  const dias = [];
  for (let d = ultimo; d >= 1; d--) {
    const fecha = `${mes}-${String(d).padStart(2, '0')}`;
    if (fecha > hoy) continue;
    const pres = presenciaCerradaDia(V.revEmp, fecha);
    const disp = disponibleImputar(V.revEmp, fecha);
    const lineas = impLineasDe(V.revEmp, fecha);
    const imp = lineas.reduce((t, l) => t + (l.minutos || 0), 0);
    if (!pres && !imp && !lineas.length) continue;
    dias.push({ fecha, pres, disp, imp, lineas });
  }

  const totPres = dias.reduce((t, d) => t + d.disp, 0);
  const totImp = dias.reduce((t, d) => t + d.imp, 0);
  const problemas = dias.filter((d) => d.imp !== d.disp).length;

  const estado = (d) => {
    if (d.imp > d.disp) return ['var(--rojo)', 'Sobra ' + durMin(d.imp - d.disp)];
    if (d.imp < d.disp) return ['var(--ambar-o)', 'Falta ' + durMin(d.disp - d.imp)];
    return ['var(--verde-o)', 'Cuadra'];
  };

  return `<div class="hdr">
    <div class="row" style="justify-content:space-between">
      <div class="h1" style="font-size:24px">Revisar imputaciones</div>
      <div data-a="ir" data-v="horas" class="volver der">Cerrar</div>
    </div>
    <div class="wrap" style="margin-top:12px">${equipoTodos().filter((x) => x.rol !== 'presupuestos').map((x) =>
      `<div class="chip ${x.id === V.revEmp ? 'on' : ''}" data-a="revEmp" data-id="${x.id}" style="cursor:pointer">${esc(x.nombre)}</div>`).join('')}</div>
    <div class="row" style="justify-content:space-between;align-items:center;margin-top:12px">
      <div class="pill" data-a="revMes" data-n="-1" style="padding:8px 14px;cursor:pointer">‹</div>
      <div style="font:600 15px var(--cond);text-transform:capitalize">${esc(nombreMes)}</div>
      <div class="pill" data-a="revMes" data-n="1" style="padding:8px 14px;cursor:pointer;${mes >= hoy.slice(0, 7) ? 'opacity:.3' : ''}">›</div>
    </div>
  </div>
  <div class="scroll pad pb-nav">
    <div class="card" style="margin-bottom:14px">
      <div class="row" style="gap:14px">
        <div><div class="lbl">Jornada</div><div class="num" style="font-size:17px;margin-top:4px">${durMin(totPres)}</div></div>
        <div><div class="lbl">Imputado</div><div class="num" style="font-size:17px;margin-top:4px">${durMin(totImp)}</div></div>
        <div><div class="lbl">Días a revisar</div><div class="num" style="font-size:17px;margin-top:4px;color:${problemas ? 'var(--ambar-o)' : 'var(--verde-o)'}">${problemas}</div></div>
      </div>
      <div class="tiny" style="margin-top:10px">Toca un día para corregirlo. Se abre la misma pantalla de imputar, ya en ese día y esa persona.</div>
    </div>
    ${dias.map((d) => {
      const [color, txt] = estado(d);
      const ult = impUltimaImputacion(V.revEmp, d.fecha);
      return `<div class="card" data-a="revDia" data-f="${d.fecha}" style="margin-bottom:10px;cursor:pointer">
        <div class="row" style="align-items:baseline;justify-content:space-between;gap:12px">
          <div class="h2 grow" style="font-size:16px">${esc(agMayus(fechaLarga(d.fecha)))}</div>
          <span class="badge" style="background:rgba(20,23,15,.05);color:${color}">${txt}</span>
        </div>
        <div class="row" style="gap:14px;margin-top:10px">
          <div><div class="lbl">Jornada</div><div class="num" style="font-size:14px;margin-top:3px">${durMin(d.disp)}</div></div>
          <div><div class="lbl">Imputado</div><div class="num" style="font-size:14px;margin-top:3px">${durMin(d.imp)}</div></div>
        </div>
        ${d.lineas.length ? `<div class="col g8" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--l1)">
          ${d.lineas.map((l) => `<div class="row" style="justify-content:space-between;gap:12px;align-items:baseline">
            <div class="grow" style="font:500 14px/1.3 var(--sans)">${esc(catLab(l.categoria))}${l.obraId ? ' · ' + esc((obraById(l.obraId) || {}).titulo || '') : ''}
              ${l.nota ? `<div class="tiny" style="margin-top:3px">${esc(l.nota)}</div>` : ''}</div>
            <div class="num" style="font-size:14px;flex:none">${durMin(l.minutos || 0)}</div>
          </div>`).join('')}
        </div>` : '<div class="tiny" style="margin-top:10px">Sin imputar nada este día.</div>'}
        ${ult ? `<div class="tiny" style="margin-top:10px;opacity:.7">Última vez: ${esc(ult.nombre)} · ${new Date(ult.en).toLocaleString('es-ES', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</div>` : ''}
      </div>`;
    }).join('') || '<div class="card"><div class="sub">Sin jornadas fichadas en este mes.</div></div>'}
  </div>`;
}

/* --- imputación de horas --- */
// Trazabilidad: quién hizo la última imputación de este empleado/día.
function impUltimaImputacion(userId, fecha) {
  const filas = S.imputaciones.filter((i) => i.userId === userId && i.fecha === fecha && i.actualizadoEn);
  if (!filas.length) return null;
  const last = filas.reduce((a, b) => (a.actualizadoEn > b.actualizadoEn ? a : b));
  return { nombre: nombrePorEmpId[last.actualizadoPor] || '—', en: last.actualizadoEn };
}
function vImputar() {
  const fecha = V.impFecha || hoyISO();
  const jefe = puedeCrear();
  const base = jefe ? equipo() : (yo() ? [yo()] : []);
  const conCierre = base
    .map((u) => ({ u, pres: presenciaCerradaDia(u.id, fecha), disp: disponibleImputar(u.id, fecha), imp: impMinImputados(u.id, fecha) }))
    .filter((x) => x.disp > 0)
    .sort((a, b) => (a.imp >= a.disp ? 1 : 0) - (b.imp >= b.disp ? 1 : 0));
  const sinCierre = base.filter((u) => disponibleImputar(u.id, fecha) === 0);
  return `<div class="hdr">
    <div class="row" style="justify-content:space-between">
      <div class="h1" style="font-size:24px">Imputar una por una</div>
      <div data-a="${jefe ? 'abrirImputGrupo' : 'ir'}" data-v="horas" style="font:500 13px var(--sans);color:var(--t2);cursor:pointer">${jefe ? '‹ Grupo' : 'Cerrar'}</div>
    </div>
    <div class="row g10" style="margin-top:12px;align-items:center">
      <div class="lbl">Día</div>
      <input class="inp" data-f="impFecha" type="date" value="${fecha}" max="${hoyISO()}" style="flex:1;padding:11px 12px">
    </div>
  </div>
  <div class="scroll pad pb-nav">
    ${conCierre.map(({ u, pres, disp, imp }) => {
      const completa = imp >= disp;
      const sinImp = Math.max(0, disp - imp);
      const exceso = imp > disp;
      return `<div class="card" data-a="abrirImputEmp" data-id="${u.id}" style="margin-bottom:10px;cursor:pointer">
        <div class="row" style="align-items:baseline;justify-content:space-between">
          <div class="h2 grow">${esc(u.nombre)}</div>
          ${exceso ? '<span class="badge" style="background:var(--rojo-cl);color:var(--rojo)">⚠ Revisar</span>' : (completa ? '<span class="badge" style="background:#e3efe5;color:var(--verde-o)">✓ Completa</span>' : `<span class="num" style="font-size:16px;color:var(--ambar-o)">${durMin(sinImp)} sin imputar</span>`)}
        </div>
        <div class="row" style="gap:12px;margin-top:12px">
          <div><div class="lbl">Presencia</div><div class="num" style="font-size:15px;margin-top:4px">${durMin(pres)}</div></div>
          <div><div class="lbl">Disponible</div><div class="num" style="font-size:15px;margin-top:4px">${durMin(disp)}</div></div>
          <div><div class="lbl">Imputado</div><div class="num" style="font-size:15px;margin-top:4px">${durMin(imp)}</div></div>
          <div><div class="lbl">Sin imputar</div><div class="num" style="font-size:15px;margin-top:4px;color:${exceso ? 'var(--rojo)' : (completa ? 'var(--verde-o)' : 'var(--ambar-o)')}">${exceso ? '⚠ +' + durMin(imp - disp) : durMin(sinImp)}</div></div>
        </div>
      </div>`;
    }).join('') || '<div class="card"><div class="sub">Nadie tiene jornada cerrada este día.</div></div>'}
    ${sinCierre.length ? `<div class="lbl" style="margin:16px 0 8px">Sin fichaje cerrado (no imputable)</div>
      <div class="col g8">${sinCierre.map((u) => `<div class="card row" style="padding:11px 13px;opacity:.7">
        <div class="grow" style="font:500 14px var(--sans)">${esc(u.nombre)}</div>
        <div class="tiny">${fichajeAbierto(u.id) ? 'jornada en curso' : 'sin fichar'}</div>
      </div>`).join('')}</div>` : ''}
    ${!jefe ? '<div class="tiny" style="margin-top:10px">Solo puedes consultar tus imputaciones. Las hace un jefe o administración.</div>' : ''}
  </div>`;
}
function vImputarGrupo() {
  const fecha = V.impFecha || hoyISO();
  const cand = impGrupoCandidatos(fecha);
  const sel = V.impGrupoSel || [];
  const obras = S.obras.filter((o) => o.estado !== 'Cerrada');
  const lineas = (V.impGrupoLineas && V.impGrupoLineas.length) ? V.impGrupoLineas : [impGrupoLineaNueva()];
  const seleccionados = cand.filter((x) => sel.includes(x.u.id));
  const tope = impGrupoRestanteMin();
  const asignado = lineas.reduce((t, l) => t + (l.minutos || 0), 0);
  const libre = Math.max(0, tope - asignado);
  const exceso = seleccionados.some((x) => asignado > x.restante);
  const faltaObra = lineas.some((l) => (l.minutos || 0) > 0 && l.categoria === 'obra' && !l.obraId);
  const puedeGuardar = seleccionados.length > 0 && asignado > 0 && !exceso && !faltaObra && !V.impGrupoBusy;
  return `<div class="hdr">
    <div class="row" style="justify-content:space-between">
      <div class="h1" style="font-size:24px">Imputar horas</div>
      <div data-a="ir" data-v="horas" class="volver der">Cerrar</div>
    </div>
    <div class="row g10" style="margin-top:12px;align-items:center">
      <div class="lbl">Día</div>
      <input class="inp" data-f="impFecha" type="date" value="${fecha}" max="${hoyISO()}" style="flex:1;padding:11px 12px">
    </div>
    <div data-a="abrirImputLista" style="margin-top:10px;font:500 12px var(--sans);color:var(--t2);cursor:pointer;text-decoration:underline">Imputar a una sola persona</div>
  </div>
  <div class="scroll pad" style="padding-bottom:${cand.length ? '150px' : 'calc(100px + var(--safe-b))'}">
    ${cand.length ? `
    <div class="lbl" style="margin-bottom:8px">Quiénes estuvieron (desmarca quien no)</div>
    <div class="col g8" style="margin-bottom:18px">
      ${cand.map((x) => { const on = sel.includes(x.u.id); return `<div class="card row" data-a="impGrupoToggle" data-id="${x.u.id}" style="padding:12px 14px;cursor:pointer">
        <div style="width:22px;height:22px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font:700 12px var(--sans);color:#fff;background:${on ? 'var(--verde)' : 'transparent'};border:1.5px solid ${on ? 'var(--verde)' : 'rgba(20,23,15,.25)'}">${on ? '✓' : ''}</div>
        <div class="grow" style="font:500 15px var(--sans)">${esc(x.u.nombre)}</div>
        <div class="tiny">${durMin(x.restante)} pendiente</div>
      </div>`; }).join('')}
    </div>
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <div class="lbl">Reparto</div>
      <div class="tiny"><span data-num="grupoAsignado">${durMin(asignado)}</span> de ${durMin(tope)} · <span data-num="grupoLibre">${durMin(libre)}</span> sin repartir</div>
    </div>
    ${lineas.map((l, i) => `<div class="card" style="margin-bottom:10px">
      <div class="wrap">${IMP_CATS.map(([c, lab]) => `<div class="chip ${l.categoria === c ? 'on' : ''}" data-a="impGrupoCat" data-i="${i}" data-c="${c}">${lab}</div>`).join('')}</div>

        <div class="wrap">${obras.map((o) => `<div class="chip ${l.obraId === o.id ? 'on' : ''}" data-a="impGrupoObra" data-i="${i}" data-id="${o.id}">${esc(o.titulo)}</div>`).join('')}<div class="chip" data-a="obraRapida" data-o="impGrupo" data-i="${i}" style="border:1.5px dashed var(--verde-o);color:var(--verde-o)">+ Nueva obra</div></div>` : ''}
      <input class="inp" data-f="impGrupoNota" data-i="${i}" value="${esc(l.nota || '')}" placeholder="Nota (opcional): ida, vuelta…" style="margin-top:10px;font-size:14px;padding:10px 12px">
      ${relojHTML('impGrupo', i, l.minutos || 0, RELOJ_MAX_DEFECTO, seleccionados.length > 0, 15)}
      ${lineas.length > 1 ? `<button class="pill pill-rojo" data-a="impGrupoDelLinea" data-i="${i}" style="display:block;margin:2px auto 0">Quitar línea</button>` : ''}
    </div>`).join('')}
    <button class="btn btn-gris" data-a="impGrupoAddLinea" style="border-radius:14px;margin-top:4px">+ Añadir categoría</button>
    ${exceso ? `<div class="tiny" style="text-align:center;color:var(--rojo);margin-top:10px">El total supera lo pendiente de alguien del grupo. Baja el tiempo o desmárcalo.</div>` : ''}

/* --- ADMINISTRACIÓN · Planilla mensual (horas REALES de fichaje) --- */
function planillaMes(userId, mes) {
  const [y, m] = mes.split('-').map(Number);
  const ultimo = new Date(y, m, 0).getDate();
  const dias = [];
  let totalMin = 0, diasTrab = 0;
  for (let dd = 1; dd <= ultimo; dd++) {
    const fecha = mes + '-' + String(dd).padStart(2, '0');
    const fs = S.fichajes.filter((f) => f.userId === userId && fechaLocal(f.entrada) === fecha)
      .sort((a, b) => a.entrada.localeCompare(b.entrada));
    const au = ausenciaDe(userId, fecha);
    if (!fs.length) {
      dias.push({ fecha, dd, estado: au ? etiqAusencia(au) : 'Sin fichaje', min: null, ausencia: au ? au.tipo : null });
      continue;
    }
    const entrada = fs[0].entrada;
    const cerrados = fs.filter((f) => f.salida);
    const salida = cerrados.length ? cerrados[cerrados.length - 1].salida : null;
    const min = fs.reduce((t, f) => t + (f.salida ? minEntre(f.entrada, f.salida) : 0), 0);
    const abierto = fs.some((f) => !f.salida);
    if (min > 0) { totalMin += min; diasTrab++; }
    // Un día puede tener las dos cosas: media jornada y luego permiso.
    const base = abierto ? 'En curso' : 'Trabajado';
    dias.push({ fecha, dd, estado: au ? base + ' · ' + etiqAusencia(au) : base,
                entrada, salida, min: abierto ? null : min, ausencia: au ? au.tipo : null });
  }
  const ausencias = {};
  dias.forEach((d) => { if (d.ausencia) ausencias[d.ausencia] = (ausencias[d.ausencia] || 0) + 1; });
  return { dias, totalMin, diasTrab, ultimo, ausencias };
}
function horasEmpleadoDesde(userId, desdeISO) {
  return S.fichajes
    .filter((f) => f.userId === userId && f.salida && (!desdeISO || f.entrada >= desdeISO))
    .reduce((t, f) => t + minEntre(f.entrada, f.salida), 0);
}
function resumenPorMes(userId, nMeses) {
  const out = [];
  const hoy = new Date();
  for (let k = 0; k < nMeses; k++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - k, 1);
    const mes = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    const min = S.fichajes.filter((f) => f.userId === userId && f.salida && fechaLocal(f.entrada).slice(0, 7) === mes)
      .reduce((t, f) => t + minEntre(f.entrada, f.salida), 0);
    out.push({ mes, min });
  }
  return out;
}
const mesLargo = (mes) => { const [y, m] = mes.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }); };
const horasLargas = (min) => Math.floor(min / 60) + ':' + String(min % 60).padStart(2, '0');

// "3 vacaciones · 1 festivo" a partir del recuento por tipo. Cadena vacía si no
// hay ninguna, para no ensuciar la línea de totales.
function resumenAusencias(a) {
  const ks = Object.keys(a || {}).filter((k) => a[k] > 0);
  if (!ks.length) return '';
  // "1 festivo" / "2 festivos"; las vacaciones se cuentan en días.
  const nombre = (k, n) => k === 'vacaciones' ? (n === 1 ? 'día de vacaciones' : 'días de vacaciones')
    : ETIQ_AUSENCIA[k].toLowerCase() + (n === 1 ? '' : 's');
  return ' · ' + ks.map((k) => a[k] + ' ' + nombre(k, a[k])).join(' · ');
}

// Lienzo de firma reutilizable: el parte lo usa para la firma del cliente y la
// planilla de horas para la del trabajador. `leer`/`guardar` dicen dónde vive
// el trazo, y `alFirmar` reacciona al primer garabato (habilitar el botón…).
function montarLienzo(sel, leer, guardar, alFirmar) {
  const c = $(sel); if (!c) return;
  const ctx = c.getContext('2d');
  const r = c.getBoundingClientRect();
  c.width = Math.round(r.width * 2); c.height = 380;
  ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14170f';
  const previo = leer();
  if (previo) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height); img.src = previo; }
  let dib = false, movido = false;
  const pos = (e) => { const b = c.getBoundingClientRect(); return [(e.clientX - b.left) * (c.width / b.width), (e.clientY - b.top) * (c.height / b.height)]; };
  c.addEventListener('pointerdown', (e) => { e.preventDefault(); dib = true; c.setPointerCapture(e.pointerId); const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y); });
  c.addEventListener('pointermove', (e) => { if (!dib) return; e.preventDefault(); const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke(); movido = true; });
  const fin = () => {
    if (!dib) return; dib = false;
    if (movido) {
      guardar(c.toDataURL('image/png'));
      const ph = c.parentElement && c.parentElement.querySelector('.ph'); if (ph) ph.remove();
      if (alFirmar) alFirmar();
    }
  };
  c.addEventListener('pointerup', fin); c.addEventListener('pointercancel', fin); c.addEventListener('pointerleave', fin);
}
function montarFirma() {
  montarLienzo('#firma', () => V.draft.firma, (dato) => { V.draft.firma = dato; }, () => {
    const b = $('.btn[data-a="aPaso"]'); if (b) { b.removeAttribute('disabled'); b.textContent = 'Revisar y enviar'; }
  });
}
// Firma del trabajador en la planilla de horas (registro de jornada).
function montarFirmaPlanilla() {
  montarLienzo('#firmaPlan', () => V.planFirma, (dato) => { V.planFirma = dato; }, () => {

}

/* =============================================================================
 * TOMA DE DATOS · rol presupuestos (Ramón)
 *
 * Ramón no ficha, no ve obras, no hace partes ni firma. Rellena la visita en
 * cinco pasos y la manda a Teamleader, que es donde se hace el presupuesto.
 * Los cuestionarios viven en visitas-schemas.js; aquí solo están las
 * pantallas y las acciones. Ver TOMA-DATOS.md.
 * ============================================================================= */
Object.assign(V, {
  visitas: [], visitasCargadas: false, visitasCargando: false, visitasError: null,

  visitaPaso: 1, visitaCat: null, visitaBusy: false,

const VISITA_VISTAS = ['visitas', 'visita', 'visitaNueva', 'ajustes', 'material', 'presupuestos', 'presuNuevo', 'presupuestoVer', 'agenda', 'clientes', 'clienteNuevo', 'clienteVer', 'citaNueva', 'citaVer'];
const PASOS_VISITA = ['Cliente', 'El inmueble', '¿Qué se presupuesta?', 'Fichas', 'Cierre'];
const KEY_VISITA = 'sysefen.visita.borrador';
const CAMPOS_COMUN = vSchemas.COMUN.secciones.flatMap((s) => s.campos);
const nombreCat = (c) => (vSchemas.CATEGORIAS.find((x) => x.key === c) || { nombre: c }).nombre;
const msgError = (e) => (e && e.message) || 'error desconocido';
const inicialesCli = (n) => String(n || '?').trim().split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();
const tipoCliente = (c) => (c && c.tl_tipo === 'company' ? 'Empresa' : 'Particular');

const SVG_TICK = (color = '#fff', s = 14) => `<svg width="${s}" height="${s}" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SVG_MAS = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M8 3v10M3 8h10" stroke="rgba(20,23,15,.45)" stroke-width="2" stroke-linecap="round"/></svg>';
const SVG_CHEV = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="flex:none;color:var(--t3)"><path d="M6 3.5L10.5 8 6 12.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const SVG_CAMARA = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 8.5A1.5 1.5 0 015.5 7h2l1.5-2h6l1.5 2h2A1.5 1.5 0 0120 8.5v9a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 17.5v-9z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.2" stroke="currentColor" stroke-width="1.6"/></svg>';

/* ---------- borrador en el móvil ---------- */
// Una visita a medias tiene que sobrevivir a cerrar la app o quedarse sin
// cobertura en mitad de una casa.
let avisoSinEspacio = false;
function guardarBorradorVisita() {
  if (!V.visitaDraft) return;
  const b = { draft: V.visitaDraft, fichas: V.visitaFichas, fotos: V.visitaFotos, adjuntos: V.visitaAdjuntos, paso: V.visitaPaso };
  try { localStorage.setItem(KEY_VISITA, JSON.stringify(b)); }
  catch (e) {
    // Sin sitio casi siempre es por las fotos: se guarda el resto.
    try { localStorage.setItem(KEY_VISITA, JSON.stringify(Object.assign({}, b, { fotos: {} }))); } catch (_) {}
    if (!avisoSinEspacio) { avisoSinEspacio = true; avisar('El móvil va justo de espacio: las fotos no se guardan si cierras la app. Guarda la visita en cuanto puedas.'); }
  }
}
function leerBorradorVisita() {
  try { const raw = localStorage.getItem(KEY_VISITA); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
}
function limpiarBorradorVisita() {
  try { localStorage.removeItem(KEY_VISITA); } catch (e) {}
  V.visitaDraft = null; V.visitaFichas = {}; V.visitaFotos = {}; V.visitaAdjuntos = []; V.visitaCat = null;
}

/* ---------- números ---------- */
// "2.100", "9,5" y "120" tienen que llegar a la base como números.
function numeroVisita(v, entero) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return v;
  let s = String(v).trim().replace(/\s/g, '');
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s);
  if (!Number.isFinite(n)) return null;
  return entero ? Math.round(n) : n;
}
function normalizarDatos(esquema, datos) {
  const out = Object.assign({}, datos);
  delete out._tocados;
  for (const sec of esquema.secciones) {
    for (const c of sec.campos) {
      if (c.tipo === 'numero' || c.tipo === 'entero') out[c.key] = numeroVisita(out[c.key], c.tipo === 'entero');
      if (c.tipo === 'lista' && Array.isArray(out[c.key])) {
        out[c.key] = out[c.key].map((f) => {
          const g = Object.assign({}, f);
          (c.subcampos || []).forEach((s) => {
            if (s.tipo === 'numero' || s.tipo === 'entero') g[s.key] = numeroVisita(g[s.key], s.tipo === 'entero');
          });
          return g;
        });
      }
    }
  }
  return out;
}

function faltanVisita() {
  const d = V.visitaDraft; const out = [];
  if (!d) return out;
  if (!d._cliente || !String(d._cliente.nombre || '').trim()) out.push('Cliente');
  vSchemas.loQueFalta(vSchemas.COMUN, d).forEach((x) => out.push('Inmueble: ' + x.campo));
  const cats = d.categorias || [];
  if (!cats.length) out.push('Elegir al menos una categoría');
  cats.forEach((c) => vSchemas.loQueFalta(vSchemas.ESQUEMAS[c], (V.visitaFichas[c] || {}).datos)
    .forEach((x) => out.push(nombreCat(c) + ': ' + x.campo)));
  return out;
}

/* ---------- fotos ---------- */
const fotosDeCat = (c) => (vSchemas.ESQUEMAS[c] && vSchemas.ESQUEMAS[c].fotos_minimas) || [];
// La foto local (recién hecha) manda sobre la ya subida. 'pendiente' = subida
// pero todavía sin enlace firmado para verla.
function fotoSrc(c, key, adjuntos = V.visitaAdjuntos) {
  const local = (V.visitaFotos[c] || {})[key];
  if (local) return local;
  const adj = (adjuntos || []).slice().reverse().find((a) => a.campo_ref === c + '.' + key);
  return adj ? (V.visitaFotoUrls[adj.storage_path] || 'pendiente') : null;
}
async function cargarUrlsFotos(adjuntos) {
  const rutas = (adjuntos || []).map((a) => a.storage_path).filter((r) => r && !V.visitaFotoUrls[r]);
  if (!rutas.length) return;
  try { Object.assign(V.visitaFotoUrls, await visitasDB.urlsFotos(rutas)); render(); } catch (e) { /* sin miniaturas */ }
}

/* ---------- acciones ---------- */
A.cargarVisitas = async () => {
  if (V.visitasCargando) return;
  V.visitasCargando = true;
  try { V.visitas = await visitasDB.listarVisitas(); V.visitasError = null; }

function irVisitaPaso() { scrollMemo.visitaNueva = 0; V.view = 'visitaNueva'; render(); }

A.nuevaVisita = () => {

  V.visitaFichas = {}; V.visitaFotos = {}; V.visitaAdjuntos = [];
  V.visitaPaso = 1; V.visitaCat = null; V.visitaClientes = null; V.visitaBuscarTxt = '';
  guardarBorradorVisita();
  irVisitaPaso();
};
A.seguirBorrador = () => {
  const b = leerBorradorVisita(); if (!b || !b.draft) return;
  V.visitaDraft = b.draft; V.visitaFichas = b.fichas || {}; V.visitaFotos = b.fotos || {};
  V.visitaAdjuntos = b.adjuntos || []; V.visitaPaso = b.paso || 1; V.visitaCat = null;
  V.visitaClientes = null; V.visitaBuscarTxt = '';

};
let descartarT;
A.descartarBorrador = () => {

};
A.visitaSalir = () => { guardarBorradorVisita(); V.view = esPresupuestos() ? 'agenda' : 'visitas'; render(); A.cargarVisitas(); if (esPresupuestos()) A.cargarAgenda(); };
A.visitaPaso = (n) => {

// Cliente
let buscarClienteT;

};
A.visitaElegirCliente = (id) => {

  V.visitaDraft._cliente = { id: c.id, nombre: c.nombre, telefono: c.telefono || '', tl_id: c.tl_id || null, tl_tipo: c.tl_tipo || 'contact', nuevo: false };

};
A.visitaClienteNuevo = () => {

A.visitaCliTipo = (t) => {

// Categorías y fichas
A.visitaToggleCat = (c) => {
  const d = V.visitaDraft; if (!d) return;
  const cats = d.categorias || (d.categorias = []);
  const i = cats.indexOf(c);
  // Al desmarcar NO se borra lo ya rellenado: un toque sin querer no debe
  // costar media ficha. Solo se deja de guardar.
  if (i >= 0) cats.splice(i, 1); else cats.push(c);
  guardarBorradorVisita(); render();
};
A.visitaCat = (c) => {
  V.visitaCat = c || null;
  if (c) {
    const f = V.visitaFichas[c] || (V.visitaFichas[c] = { datos: {}, tocados: {} });
    const esq = vSchemas.ESQUEMAS[c];
    esq.secciones.forEach((s) => s.campos.forEach((k) => {
      if (k.defecto != null && f.datos[k.key] == null) f.datos[k.key] = k.defecto;
    }));
    // Las propuestas dependen de datos del inmueble que pueden haber cambiado.
    const p = vSchemas.proponer(c, f.datos, V.visitaDraft);
    for (const [k, v] of Object.entries(p)) {
      if (!f.tocados[k] && v != null && !Number.isNaN(v)) f.datos[k] = v;
    }
  }
  guardarBorradorVisita();
  scrollMemo.visitaNueva = 0;
  render();
};
A.visitaIrFicha = (c) => { V.visitaPaso = 4; A.visitaCat(c); };

// Único manejador del formulario: delega en visitas-form.js
A.vf = (accion, d, valor) => {
  const dr = V.visitaDraft; if (!dr) return;
  const cat = V.visitaPaso === 4 ? V.visitaCat : null;
  let estado, esquema = null;
  if (cat) {
    estado = V.visitaFichas[cat] || (V.visitaFichas[cat] = { datos: {}, tocados: {} });
    esquema = vSchemas.ESQUEMAS[cat];
  } else {
    estado = { datos: dr, tocados: dr._tocados || (dr._tocados = {}) };
  }
  if (!vForm.manejar(accion, d, valor, estado, esquema, dr)) return;

  // Los campos de texto no se repintan: perderían el foco y el cursor.
  if (accion !== 'vfCampo' && accion !== 'vfLista') render();
};

A.visitaFoto = (c, key) => {
  const inp = document.createElement('input');
  // Sin `capture`: el móvil pregunta si hacerla ahora o coger una del carrete.
  // Con `capture` se abría la cámara directamente y no había forma de adjuntar
  // una foto de antes, que muchas veces es la que vale: la placa del equipo,
  // el cuadro, una visita anterior a la misma casa.
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = async () => {
    const file = inp.files && inp.files[0]; if (!file) return;
    try {
      const data = await comprimir(file);
      (V.visitaFotos[c] || (V.visitaFotos[c] = {}))[key] = data;
      guardarBorradorVisita(); render();
    } catch (e) { avisar('No se pudo leer la foto.'); }
  };
  inp.click();
};

// Guardar (borrador o cerrada)
A.guardarVisita = async (completar, trasGuardar) => {
  const d = V.visitaDraft; if (!d || V.visitaBusy) return;
  const cats = d.categorias || [];
  if (completar) {
    const faltan = faltanVisita();
    if (faltan.length) { avisar('Falta: ' + faltan.join(' · ')); return; }
  }
  if (!navigator.onLine) {
    guardarBorradorVisita();
    avisar('Sin conexión. La visita queda en el móvil: guárdala cuando haya cobertura.');
    return;
  }
  V.visitaBusy = true; render();
  try {
    const cli = d._cliente;
    if (cli && cli.nuevo && !cli.id && String(cli.nombre || '').trim()) {
      const creado = await visitasDB.crearClienteLocal(Object.assign({}, cli, { nombre: cli.nombre.trim() }));
      cli.id = creado.id; guardarBorradorVisita();
    }
    const comun = normalizarDatos(vSchemas.COMUN, d);
    const fila = {
      id: d.id,
      fecha_visita: d.fecha_visita || hoyISO(),
      cliente_id: (cli && cli.id) || null,
      estado: completar ? 'completada' : 'borrador',
      sync_estado: 'pendiente',
      sync_error: null,
    };
    CAMPOS_COMUN.forEach((c) => {
      let v = comun[c.key];
      if (c.tipo === 'bool') v = v === true;
      else if (v === '' || v === undefined) v = null;
      fila[c.key] = v;
    });
    if (d.cita_id) fila.cita_id = d.cita_id;
    const guardada = await visitasDB.guardarOCrearVisita(fila);
    d.codigo = guardada.codigo;

    for (const c of cats) {
      const f = V.visitaFichas[c] || { datos: {} };
      const esq = vSchemas.ESQUEMAS[c];
      await visitasDB.guardarFicha(d.id, c, normalizarDatos(esq, f.datos), vSchemas.VERSION, !vSchemas.loQueFalta(esq, f.datos).length);
    }
    for (const c of (d._catsGuardadas || [])) {
      if (!cats.includes(c)) await visitasDB.quitarFicha(d.id, c);
    }
    d._catsGuardadas = cats.slice();
    guardarBorradorVisita();

    // Las fotos van una a una y se quitan del borrador según suben: si falla
    // la quinta, las cuatro primeras no se vuelven a subir.
    for (const c of Object.keys(V.visitaFotos)) {
      if (!cats.includes(c)) continue;
      for (const key of Object.keys(V.visitaFotos[c])) {
        const etiqueta = (fotosDeCat(c).find((x) => x.key === key) || {}).etiqueta || key;
        const adj = await visitasDB.subirFoto(d.id, { dataURL: V.visitaFotos[c][key], categoria: c, campoRef: c + '.' + key, descripcion: etiqueta });
        V.visitaAdjuntos.push(adj);
        delete V.visitaFotos[c][key];
        guardarBorradorVisita();
      }
    }

    // La cita de la que salió queda como visitada.
    if (d.cita_id) {
      try { await visitasDB.guardarCita({ id: d.cita_id, estado: 'visitada', visita_id: d.id }); } catch (e) { /* la visita ya está guardada */ }
      A.cargarAgenda();
    }
    limpiarBorradorVisita();
    V.visitaBusy = false;
    if (typeof trasGuardar === 'function') { toast('Visita guardada como borrador.'); A.cargarVisitas(); return trasGuardar(); }
    toast(completar ? 'Visita cerrada. Ya se puede enviar a Teamleader.' : 'Guardada. La sigues cuando quieras.');
    if (completar) {
      A.cargarVisitas(); await A.verVisita(guardada.id);
      graciasVisita(guardada.id);
      return subirVisitaDrive();
    }
    V.view = esPresupuestos() ? 'agenda' : 'visitas'; render(); A.cargarVisitas();
  } catch (e) {
    V.visitaBusy = false; guardarBorradorVisita(); render();
    avisar('No se pudo guardar: ' + msgError(e) + '. La visita sigue en el móvil.');
  }
};

// Las fotos viven en Supabase Storage. Hay que traerlas como datos ANTES de
// dibujar: si fueran enlaces, el PDF saldría con los huecos en blanco.
async function cargarFotosVisita(vv) {
  const fotos = (vv.adjuntos || []).filter((a) => a.storage_path && !a.data);
  if (!fotos.length) return true;
  const faltan = fotos.map((a) => a.storage_path).filter((r) => !V.visitaFotoUrls[r]);
  if (faltan.length) {
    try { Object.assign(V.visitaFotoUrls, await visitasDB.urlsFotos(faltan)); } catch (e) { /* se ve abajo */ }
  }
  let fallos = 0;
  for (const a of fotos) {
    const url = V.visitaFotoUrls[a.storage_path];
    if (!url) { fallos++; continue; }
    try {
      const blob = await (await fetch(url)).blob();
      a.data = await new Promise((res, rej) => {
        const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob);
      });
    } catch (e) { fallos++; }
  }
  return fallos === 0;
}

      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:${color}"></span><span class="lbl"${color === 'var(--rojo)' ? ' style="color:var(--rojo)"' : ''}>${esc(texto)}</span><div class="grow"></div><span class="tiny">${esc(v.codigo || '')}</span></div>
      <div class="h2" style="margin-top:9px">${esc(v.direccion || 'Sin dirección')}</div>
      <div class="sub" style="margin-top:4px">${esc([v.cliente && v.cliente.nombre, v.poblacion].filter(Boolean).join(' · ') || 'Sin cliente')}</div>
      <div class="row" style="gap:6px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--l1)">
        ${cats.map((c) => `<span class="badge" style="background:rgba(20,23,15,.06);color:var(--tinta)">${esc(nombreCat(c))}</span>`).join('')}
        <div class="grow"></div><span class="tiny">${v.fecha_visita ? fechaCorta(v.fecha_visita + 'T12:00') : ''}</span>
      </div>
    </div>`;
  };

  const medias = b && b.draft ? `<div class="card" style="margin-bottom:11px;box-shadow:0 0 0 1.5px var(--ambar),var(--sh)">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:var(--ambar)"></span><span class="lbl">A medias en este móvil · paso ${b.paso || 1} de 5</span></div>
      <div class="h2" style="margin-top:9px">${esc(b.draft.direccion || 'Visita sin dirección')}</div>
      <div class="sub" style="margin-top:4px">${esc([(b.draft._cliente || {}).nombre, b.draft.poblacion].filter(Boolean).join(' · ') || 'Sin cliente todavía')}</div>
      <div class="row g8" style="margin-top:13px">
        <button class="pill pill-verde grow" data-a="seguirBorrador" style="padding:13px">Seguir</button>
        <button class="pill ${V.confirmarDescartar ? 'pill-rojo' : ''}" data-a="descartarBorrador" style="padding:13px">${V.confirmarDescartar ? '¿Seguro? Otra vez' : 'Descartar'}</button>
      </div>
    </div>` : '';

  const grupos = [];
  if (medias || sinCerrar.length) grupos.push(['Sin cerrar', medias + sinCerrar.map(tarjeta).join('')]);
  if (porEnviar.length) grupos.push(['Por enviar', porEnviar.map(tarjeta).join('')]);
  if (enTL.length) grupos.push(['En Teamleader', enTL.map(tarjeta).join('')]);

  let aviso = '';
  if (V.visitasError) {
    const faltaSQL = /does not exist|PGRST205|schema cache|relation/i.test(V.visitasError);
    aviso = `<div class="card" style="background:var(--rojo-cl);margin-bottom:14px">
      <div style="font:600 14px var(--sans);color:var(--rojo)">${faltaSQL ? 'Falta preparar la base de datos' : 'No se pudieron cargar las visitas'}</div>
      <div class="sub" style="font-size:13px;margin-top:6px;color:var(--rojo)">${faltaSQL ? 'Hay que ejecutar sql/etapa20_toma_datos.sql en Supabase.' : esc(V.visitasError)}</div>
    </div>`;
  }

  const n = (x) => x.length;
  return `<div class="hdr">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
      ${marcaSysefen(false)}
      ${avatarHTML(V.user.id, 'width:32px;height:32px;font-size:13px;background:rgba(20,23,15,.08);color:var(--tinta);cursor:pointer', 'data-a="menuUsuario"')}
    </div>
    <div class="row" style="justify-content:space-between">
      <div class="h1">Visitas</div>
      <div class="row g8">
        ${lista.length ? '<button class="pill" data-a="exportarVisitasCSV">CSV</button>' : ''}
        <button class="pill" data-a="nuevaVisita" style="background:var(--tinta);color:#fff">+ Nueva</button>
      </div>
    </div>
    <div class="sub" style="margin-top:8px">${V.visitasCargadas ? `${n(sinCerrar) + (medias ? 1 : 0)} sin cerrar · ${n(porEnviar)} por enviar · ${n(enTL)} en Teamleader` : 'Cargando…'}</div>
  </div>
  <div class="scroll pad pb-nav">
    ${aviso}
    ${grupos.map(([t, html], i) => `<div class="lbl" style="margin:${i ? 22 : 0}px 0 10px">${t}</div>${html}`).join('')}
    ${!grupos.length && V.visitasCargadas && !V.visitasError ? `<div class="card"><div class="h2">Sin visitas todavía</div><div class="sub" style="margin-top:6px">Dale a «+ Nueva» cuando llegues a casa del cliente.</div></div>` : ''}
  </div>`;
}

function resultadosClientesHTML() {
  if (V.visitaClientesErr) return '<div class="sub">No se pudo buscar. Si no hay cobertura, da de alta el cliente a mano.</div>';
  const l = V.visitaClientes;
  if (!l) return '';
  if (!l.length) return String(V.visitaBuscarTxt || '').trim().length < 2 ? '' : '<div class="sub">No aparece. Dalo de alta abajo.</div>';
  return l.map((c) => `<div class="card row" data-a="visitaElegirCliente" data-id="${c.id}" style="cursor:pointer">
    <div class="av" style="width:38px;height:38px;background:rgba(20,23,15,.06);color:var(--t2);font-size:14px">${esc(inicialesCli(c.nombre))}</div>
    <div class="grow"><div style="font:600 16px/1.2 var(--sans)">${esc(c.nombre)}</div>
    <div class="sub" style="margin-top:2px">${esc([tipoCliente(c), c.telefono, c.pendiente_alta ? 'pendiente de alta' : ''].filter(Boolean).join(' · '))}</div></div>
  </div>`).join('');
}

function fotosHTML(c) {
  const fotos = fotosDeCat(c); if (!fotos.length) return '';
  const hechas = fotos.filter((f) => fotoSrc(c, f.key)).length;
  return `<div>
    <div class="row" style="justify-content:space-between;align-items:baseline"><div class="h2">Fotos</div><span class="tiny">${hechas} de ${fotos.length}</span></div>
    <div class="rej2" style="margin-top:12px">${fotos.map((f) => {
      const src = fotoSrc(c, f.key);
      if (!src) return `<div class="foto-hueco" data-a="visitaFoto" data-c="${c}" data-k="${esc(f.key)}">${SVG_CAMARA}<span>${esc(f.etiqueta)}</span></div>`;
      const fondo = src === 'pendiente' ? '' : `background-image:url('${src}')`;
      return `<div class="foto-v" data-a="visitaFoto" data-c="${c}" data-k="${esc(f.key)}" style="${fondo}"><em>${SVG_TICK('#fff', 11)}</em><span>${esc(f.etiqueta)}</span></div>`;
    }).join('')}</div>
  </div>`;
}

function vVisitaNueva() {
  const d = V.visitaDraft;
  if (!d) { V.view = 'visitas'; return vVisitas(); }
  const p = V.visitaPaso;
  const cats = d.categorias || [];
  const cli = d._cliente;
  let titulo = PASOS_VISITA[p - 1];
  let sub = 'Paso ' + p + ' de 5';
  let volver = '<div class="volver" data-a="visitaSalir">‹ Agenda</div>';
  let cuerpo = '';
  const atras = `<button class="btn btn-gris" data-a="visitaPaso" data-n="${p - 1}">Atrás</button>`;
  const siguiente = `<button class="btn btn-verde" data-a="visitaPaso" data-n="${p + 1}">Siguiente</button>`;
  let pie = atras + siguiente;
  let pieCol = false;

  if (p === 1) {
    sub += ' · ' + (d.codigo || 'Nueva visita');
    pie = siguiente;
    if (cli && !cli.nuevo) {
      cuerpo = `<div class="lbl" style="margin-bottom:10px">Cliente</div>
        <div class="card row elegida">
          <div class="av" style="width:38px;height:38px;background:rgba(61,143,74,.14);color:var(--verde-o);font-size:14px">${esc(inicialesCli(cli.nombre))}</div>
          <div class="grow"><div style="font:600 16px/1.2 var(--sans)">${esc(cli.nombre)}</div>
          <div class="sub" style="margin-top:2px">${esc([tipoCliente(cli), cli.telefono].filter(Boolean).join(' · '))}</div></div>
          <div class="tick si">${SVG_TICK()}</div>
        </div>
        <button class="btn btn-gris" data-a="visitaQuitarCliente" style="margin-top:12px">Cambiar de cliente</button>`;
    } else if (cli && cli.nuevo) {
      cuerpo = `<div class="lbl">Cliente nuevo</div>
        <div class="wrap" style="margin-top:10px">
          <span class="chip ${cli.tl_tipo !== 'company' ? 'sel' : ''}" data-a="visitaCliTipo" data-t="contact" style="cursor:pointer">Particular</span>
          <span class="chip ${cli.tl_tipo === 'company' ? 'sel' : ''}" data-a="visitaCliTipo" data-t="company" style="cursor:pointer">Empresa o comunidad</span>
        </div>
        <div class="campo"><div class="lbl">Nombre<span style="color:var(--rojo)"> *</span></div>
          <input class="inp" id="visita-cli-nombre" data-f="visitaCli" data-k="nombre" value="${esc(cli.nombre || '')}" placeholder="${cli.tl_tipo === 'company' ? 'Razón social' : 'Nombre y apellidos'}"></div>
        <div class="campo"><div class="lbl">Teléfono</div>
          <input class="inp" id="visita-cli-tel" data-f="visitaCli" data-k="telefono" type="tel" inputmode="tel" value="${esc(cli.telefono || '')}"></div>
        <div class="campo"><div class="lbl">NIF / CIF</div>
          <input class="inp" id="visita-cli-nif" data-f="visitaCli" data-k="nif" autocapitalize="characters" value="${esc(cli.nif || '')}"></div>
        <div class="campo"><div class="lbl">Email</div>
          <input class="inp" id="visita-cli-email" data-f="visitaCli" data-k="email" type="email" inputmode="email" autocapitalize="off" value="${esc(cli.email || '')}"></div>
        <div class="tiny" style="margin-top:10px">Se da de alta en Teamleader al enviar la visita.</div>
        <div class="dash" data-a="visitaQuitarCliente" style="margin-top:18px">Buscar uno que ya exista</div>`;
    } else {
      cuerpo = `<div class="campo" style="margin-top:0"><div class="lbl">Buscar en Teamleader</div>
          <input class="inp" id="visita-buscar" data-f="visitaBuscar" value="${esc(V.visitaBuscarTxt || '')}" placeholder="Nombre, NIF o teléfono" autocomplete="off">
          <div class="tiny">Busca en la copia de clientes de la app.</div></div>
        <div id="visita-resultados" class="col g8" style="margin-top:18px">${resultadosClientesHTML()}</div>
        <div class="dash" data-a="visitaClienteNuevo" style="margin-top:14px">+ Cliente nuevo</div>`;
    }

  } else if (p === 2) {
    if (cli && cli.nombre) sub += ' · ' + cli.nombre;
    cuerpo = vForm.fichaHTML(vSchemas.COMUN, d, d._tocados || {});

  } else if (p === 3) {
    sub += ' · Puedes marcar varias';
    cuerpo = `<div class="col g10">${vSchemas.CATEGORIAS.map((c) => {
      const on = cats.includes(c.key);
      const esq = vSchemas.ESQUEMAS[c.key];
      const nf = fotosDeCat(c.key).length;
      return `<div class="card row ${on ? 'elegida' : ''}" data-a="visitaToggleCat" data-c="${c.key}" style="cursor:pointer">
        <div class="grow"><div style="font:600 17px/1.2 var(--sans)">${esc(c.nombre)}</div>
        <div class="sub" style="margin-top:3px">${esc(esq.secciones.slice(0, 4).map((s) => s.titulo).join(' · '))}</div>
        ${nf ? `<div class="tiny" style="margin-top:7px">${nf} fotos mínimas</div>` : ''}</div>
        <div class="tick ${on ? 'si' : 'no'}">${on ? SVG_TICK() : SVG_MAS}</div>
      </div>`;
    }).join('')}</div>`;

  } else if (p === 4 && V.visitaCat && cats.includes(V.visitaCat)) {
    const c = V.visitaCat;
    const esq = vSchemas.ESQUEMAS[c];
    const f = V.visitaFichas[c] || { datos: {}, tocados: {} };
    const faltan = vSchemas.loQueFalta(esq, f.datos).length;
    titulo = nombreCat(c);
    sub += faltan ? ` · Faltan ${faltan} obligatorio${faltan === 1 ? '' : 's'}` : ' · Todo lo obligatorio';
    volver = '<div class="volver" data-a="visitaCat" data-c="">‹ Fichas</div>';
    cuerpo = fotosHTML(c) + vForm.fichaHTML(esq, f.datos, f.tocados);
    pie = '<button class="btn btn-verde" data-a="visitaCat" data-c="">Volver a fichas</button>';

  } else if (p === 4) {
    if (d.direccion) sub += ' · ' + d.direccion;
    if (!cats.length) {
      cuerpo = `<div class="card"><div class="h2">Sin categorías</div>
        <div class="sub" style="margin-top:6px">Vuelve un paso y marca qué se presupuesta.</div></div>`;
    } else {
      cuerpo = `<div class="col g10">${cats.map((c) => {
        const esq = vSchemas.ESQUEMAS[c];
        const datos = (V.visitaFichas[c] || {}).datos;
        const faltan = vSchemas.loQueFalta(esq, datos);
        const total = esq.secciones.reduce((t, s) => t + s.campos.filter((k) => k.obligatorio).length, 0) || 1;
        const pct = Math.round(((total - faltan.length) / total) * 100);
        const fotos = fotosDeCat(c);
        const hechas = fotos.filter((x) => fotoSrc(c, x.key)).length;
        return `<div class="card" data-a="visitaCat" data-c="${c}" style="cursor:pointer">
          <div class="row">
            <div class="grow" style="font:600 17px/1.2 var(--sans)">${esc(nombreCat(c))}</div>
            ${faltan.length ? `<span class="pill" style="padding:8px 11px">Faltan ${faltan.length}</span>` : '<span class="pill pill-verde" style="padding:8px 11px">Completa</span>'}
            ${SVG_CHEV}
          </div>
          <div class="prog"><i style="width:${pct}%"></i></div>
          <div class="row" style="justify-content:space-between;margin-top:9px;gap:12px">
            <span class="tiny ell">${esc(faltan.length ? faltan.map((x) => x.campo).join(' · ') : 'Todo lo obligatorio')}</span>
            ${fotos.length ? `<span class="tiny" style="flex:none">${hechas}/${fotos.length} fotos</span>` : ''}
          </div>
        </div>`;
      }).join('')}</div>
      <div class="tiny" style="margin-top:16px">Se puede seguir con alguna a medias. Todo se exige al cerrar la visita.</div>`;
    }

  } else {
    sub += ' · Repasa antes de cerrar';
    const faltan = faltanVisita();
    const bloqueo = faltan.length ? `<div class="aviso-rojo" style="margin-bottom:14px"><span class="ex">!</span>
        <div class="col" style="gap:3px"><b style="font:600 13px/1.3 var(--sans)">${faltan.length === 1 ? 'Falta 1 dato' : 'Faltan ' + faltan.length + ' datos'} para cerrar</b>
        <span style="font:400 12px/1.4 var(--sans)">${esc(faltan.join(' · '))}</span></div></div>` : '';
    const tarjetaResumen = (titulo2, accion, html) => `<div class="card" style="margin-bottom:10px;padding:13px 15px 8px">
        <div class="row" style="justify-content:space-between"><div class="h2" style="font-size:17px">${esc(titulo2)}</div>${accion}</div>
        ${html}
      </div>`;
    cuerpo = bloqueo
      + tarjetaResumen(cli && cli.nombre ? cli.nombre : 'Sin cliente', '<span class="tiny" data-a="visitaPaso" data-n="2" style="cursor:pointer;color:var(--verde-o)">Editar</span>', vForm.resumenHTML(vSchemas.COMUN, d))
      + cats.map((c) => {
        const fotos = fotosDeCat(c);
        const hechas = fotos.filter((x) => fotoSrc(c, x.key)).length;
        return tarjetaResumen(nombreCat(c), `<span class="tiny" data-a="visitaIrFicha" data-c="${c}" style="cursor:pointer;color:var(--verde-o)">Editar</span>`,
          (fotos.length ? `<div class="tiny" style="margin-top:6px">${hechas} de ${fotos.length} fotos</div>` : '')
          + vForm.resumenHTML(vSchemas.ESQUEMAS[c], (V.visitaFichas[c] || {}).datos));
      }).join('');
    pieCol = true;
    pie = `<button class="btn btn-verde" data-a="guardarVisita" data-completar="1" ${faltan.length || V.visitaBusy ? 'disabled' : ''}>${V.visitaBusy ? 'Guardando…' : 'Cerrar la visita'}</button>
      <button class="btn btn-gris" data-a="guardarVisita" ${V.visitaBusy ? 'disabled' : ''}>Guardar y seguir luego</button>`;
  }

  return `<div class="hdr-dark">
    ${volver}
    <div style="font:600 27px/1.1 var(--cond)">${esc(titulo)}</div>
    <div class="sub" style="color:rgba(255,255,255,.5);margin-top:6px">${esc(sub)}</div>
    <div class="pasos">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= p ? 'on' : ''}" data-a="visitaPaso" data-n="${i}" style="cursor:pointer"></i>`).join('')}</div>
  </div>
  <div class="scroll pad sin-marca" style="padding-bottom:30px">${cuerpo}</div>
  <div class="pie${pieCol ? ' col' : ''}">${pie}</div>`;
}

function vVisita() {
  const vv = V.visitaVer;
  const cab = (t, s, dir) => `<div class="hdr-dark">
    <div class="volver" data-a="ir" data-v="visitas">‹ Visitas</div>
    <div style="font:600 27px/1.1 var(--cond)">${esc(t)}</div>
    ${s ? `<div class="sub" style="color:rgba(255,255,255,.5);margin-top:6px">${esc(s)}</div>` : ''}
    ${dir ? `<div class="ag-acciones" style="justify-content:flex-start;gap:26px">${accionComoLlegar(dir)}</div>` : ''}
  </div>`;
  if (!vv) return cab('Visita', 'Cargando…') + '<div class="scroll pad pb-nav sin-marca"></div>';

  const v = vv.visita, fichas = vv.fichas || [], adj = vv.adjuntos || [];
  const cli = v.cliente;
  const cats = fichas.map((f) => f.categoria);
  const enviada = v.sync_estado === 'sincronizada';
  const fotosN = adj.filter((a) => a.tipo === 'foto' || !a.tipo).length;

  let bloque = '';
  if (enviada) {
    bloque = `<div class="card">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:var(--verde)"></span><span class="lbl">En Teamleader</span></div>
      <div class="viaja">
        ${v.sync_at ? `<span class="k">Enviada</span><span class="v">${fechaCorta(v.sync_at)} · ${hhmm(v.sync_at)}</span>` : ''}
        <span class="k">Deal</span><span class="v">${esc(cats.map(nombreCat).join(' + ') || '—')}<small>${esc([v.poblacion, v.tl_deal_fase].filter(Boolean).join(' · '))}</small></span>
      </div>
      <div class="tiny" style="margin-top:14px">Ya no se edita desde el móvil. Si hay que corregir algo, se hace en Teamleader.</div>
    </div>`;
  } else if (v.estado === 'completada') {
    const error = v.sync_estado === 'error';
    bloque = `<div class="card">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:${error ? 'var(--rojo)' : 'var(--tinta)'}"></span><span class="lbl"${error ? ' style="color:var(--rojo)"' : ''}>${error ? 'No se pudo enviar' : 'Cerrada · por enviar'}</span></div>
      ${error && v.sync_error ? `<div class="aviso-rojo" style="margin-top:12px"><span class="ex">!</span><span style="font:400 13px/1.4 var(--sans)">${esc(v.sync_error)}</span></div>` : ''}
      <div class="viaja">
        <span class="k">Cliente</span><span class="v">${esc(cli ? cli.nombre : 'Sin cliente')}<small>${cli ? (cli.tl_id ? 'Ya existe en Teamleader' : 'Se da de alta al enviar') : 'Se enviará sin cliente'}</small></span>
        <span class="k">Deal</span><span class="v">${esc(cats.map(nombreCat).join(' + ') || '—')}<small>${esc(v.poblacion || '')}</small></span>
        <span class="k">Nota</span><span class="v">${fichas.length === 1 ? 'La ficha en texto' : 'Las ' + fichas.length + ' fichas en texto'}</span>
        <span class="k">Fotos</span><span class="v">${fotosN} ${fotosN === 1 ? 'archivo' : 'archivos'}</span>
      </div>
      <button class="btn btn-verde" data-a="enviarVisita" style="margin-top:16px" ${V.visitaBusy ? 'disabled' : ''}>${V.visitaBusy ? 'Enviando…' : error ? 'Reintentar el envío' : 'Enviar a Teamleader'}</button>
      <button class="btn btn-gris" data-a="editarVisita" data-id="${v.id}" style="margin-top:8px">Corregir algo</button>
    </div>`;
  } else {
    bloque = `<div class="card">
      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:var(--ambar)"></span><span class="lbl">Borrador</span></div>
      <div class="sub" style="margin-top:8px">Todavía no está cerrada.</div>
      <button class="btn btn-verde" data-a="editarVisita" data-id="${v.id}" style="margin-top:14px">Seguir rellenando</button>
    </div>`;
  }

  const miniaturas = (c) => {
    const lista = adj.filter((a) => String(a.campo_ref || '').startsWith(c + '.'));
    if (!lista.length) return '';
    return `<div class="rej3" style="margin-top:10px">${lista.map((a) => {
      const url = V.visitaFotoUrls[a.storage_path];
      return `<div class="foto-v" style="${url ? `background-image:url('${url}')` : ''};cursor:default"><span>${esc(a.descripcion || '')}</span></div>`;
    }).join('')}</div>`;
  };

  // La ficha en papel: PDF para mirar o mandar, y la copia en Drive.
  const dr = V.okVisitaDrive;
  const papel = `<div class="card" style="margin-top:12px">
    <div class="lbl">La ficha en papel</div>
    <div class="sub" style="margin-top:6px;font-size:13px">El PDF lleva el inmueble, cada categoría y las fotos. La copia va a Drive, a la carpeta del cliente.</div>
    <div class="row g8" style="margin-top:14px">
      ${enMovil()
        // En el móvil los dos botones acababan en la misma hoja de compartir:
        // window.print() no existe ahí. Se deja uno solo y se dice qué es.
        ? `<button class="pill grow" data-a="visitaPdf" style="padding:12px;text-align:center">PDF de la visita</button>`
        : `<button class="pill grow" data-a="visitaPdf" style="padding:12px;text-align:center">Ver PDF</button>
           <button class="pill grow" data-a="compartirVisita" style="padding:12px;text-align:center">Compartir</button>`}
    </div>
    <button class="pill" data-a="visitaDrive" style="margin-top:8px;padding:12px;width:100%;text-align:center" ${dr && dr.estado === 'subiendo' ? 'disabled' : ''}>${

const eur = (n) => (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';

/**
 * Calcular y guardar valen igual para el presupuesto de una visita y para el
 * suelto: lo único que cambia es de dónde salen los datos. `enSuelto()` dice
 * en cuál de los dos estamos.
 */
const enSuelto = () => V.view === 'presuNuevo' && !!V.suelto;

A.presuCalcular = async (categoria) => {
  if (!esPresupuestos() && !esAdmin()) return;
  const suelto = enSuelto();
  const vv = V.visitaVer;
  if (!suelto && !vv) return;
  if (!navigator.onLine) { avisar('Sin conexión: el presupuesto se calcula en el servidor.'); return; }
  const p = V.presu;
  p.cat = categoria; p.cargando = true; p.error = null; render();
  try {
    p.datos = suelto
      ? await visitasDB.presupuestarSuelto(categoria, datosDelSuelto(V.suelto), {
          guardar: false, dtoGlobalPct: p.dto, lineasExtra: p.extra,
          clienteId: V.suelto.clienteId, titulo: tituloDelSuelto(),
        })
      : await visitasDB.presupuestarVisita(vv.visita.id, categoria, {
          guardar: false, dtoGlobalPct: p.dto, lineasExtra: p.extra,
        });
  } catch (e) {
    p.datos = null; p.error = msgError(e);
  }
  p.cargando = false; render();
};

/** "Aire acondicionado · Casa de Ana", para reconocerlo en la lista. */
function tituloDelSuelto() {
  const f = V.suelto || {};
  const quien = String(f.titulo || f.cliente || '').trim();
  return nombreCat(f.cat) + (quien ? ' · ' + quien : '');
}

A.presuDto = (v) => {
  const n = Math.max(0, Math.min(100, Number(String(v).replace(',', '.')) || 0));
  V.presu.dto = n;
};
A.presuRecalcular = () => { if (V.presu.cat) A.presuCalcular(V.presu.cat); };

A.presuGuardar = async () => {
  const vv = V.visitaVer, p = V.presu, suelto = enSuelto();
  if ((!vv && !suelto) || !p.cat || p.guardando) return;
  p.guardando = true; render();
  try {
    const r = suelto
      ? await visitasDB.presupuestarSuelto(p.cat, datosDelSuelto(V.suelto), {
          guardar: true, dtoGlobalPct: p.dto, lineasExtra: p.extra,
          clienteId: V.suelto.clienteId, titulo: tituloDelSuelto(),
        })
      : await visitasDB.presupuestarVisita(vv.visita.id, p.cat, {
          guardar: true, dtoGlobalPct: p.dto, lineasExtra: p.extra,
        });
    p.datos = r; p.guardado = r.presupuesto_id || null; p.enTL = false; p.errTL = null;
    toast('Presupuesto guardado. Subiéndolo a Teamleader…');
    V.presuLista.cargado = false; A.cargarPresupuestos();
  } catch (e) { avisar('No se pudo guardar: ' + msgError(e)); p.guardando = false; render(); return; }
  p.guardando = false; render();
  // Guardado = a Teamleader, sin más botones.
  if (p.guardado) A.presuGuardadoATL();
};

/* =============================================================================
 * PRESUPUESTOS · la sección propia (sql/etapa42)
 *
 * Un presupuesto no siempre viene de una visita: muchas veces se hace por

 * ========================================================================== */
Object.assign(V, {

  presuEdit: null,
  suelto: null,
