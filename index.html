const SISTEMAS_AIRE = [
  ['multisplit', 'Multisplit'], ['split_1x1', 'Splits 1×1'],
  ['conductos', 'Conductos'], ['cassette', 'Cassette'], ['suelo_techo', 'Suelo/techo'],
];

const presuNuevoVacio = () => ({
  cat: 'aire_acondicionado', clienteId: null, cliente: '', titulo: '',
  // aire: una fila por equipo interior, con sus m² y sus metros de línea
  // hasta la exterior. Con los m² el motor elige la máquina; con los metros,
  // el tubo de más y el gas.
  tipo_sistema: 'multisplit', equipos: 1, metros: '', estancias: [{ m2: '', metros: '' }],
  // lo viejo: interiores y exteriores a retirar, y si se aprovecha su tubería
  retirar: '', retirar_ext: '', recuperar: false,
  // aerotermia: la potencia se pone a mano, calcularla desde la casa no está
  // calibrado (MOTOR-PRESUPUESTOS.md §7).
  kw: '', circuitos: 1, acs: 0, sustituye: false, apoyo: false, limpieza: false,
  // fotovoltaica: los kWp salen de los paneles, no se preguntan.
  paneles: '', wp: 510, bateria: '',
  inversor: 'fronius', fases: 'monofasico', bateria_marca: '', backup: false,
});

// Con qué baterías va cada inversor (sql/etapa47). La primera es la que pone
// el motor si no se elige ninguna.
const BATERIAS_DE = {
  fronius: [['byd', 'BYD'], ['fronius', 'Fronius Reserva'], ['tesla', 'Tesla']],
  enphase: [['enphase', 'Enphase'], ['tesla', 'Tesla']],
};

/**
 * Lo que se le manda al motor desde la pantalla suelta, con los mismos nombres
 * que usa la ficha de la visita: así las reglas son las mismas para los dos
 * caminos y no hay que duplicarlas.
 */
function datosDelSuelto(f) {
  const num = (v) => Number(String(v == null ? '' : v).replace(',', '.')) || 0;
  if (f.cat === 'solar') {
    const conBateria = num(f.bateria) > 0;
    return {
      paneles_manual: Math.max(0, Math.min(400, Number(f.paneles) || 0)),
      wp_manual: num(f.wp),
      inversor_marca: f.inversor === 'enphase' ? 'enphase' : 'fronius',
      suministro: f.fases === 'trifasico' ? 'trifasico' : 'monofasico',
      baterias: conBateria ? 'si' : 'no',
      baterias_kwh: num(f.bateria),
      bateria_marca: conBateria ? (f.bateria_marca || '') : '',
      backup: conBateria && !!f.backup,
    };
  }
  if (f.cat === 'aerotermia') {
    const c = Math.max(1, Math.min(6, Number(f.circuitos) || 1));
    return {
      potencia_kw: num(f.kw),
      // Cada emisor previsto es un circuito: el motor los cuenta.
      emisores_previstos: Array.from({ length: c }, (_, i) => 'circuito_' + (i + 1)),
      sistema_actual: f.sustituye ? 'caldera_gas' : 'ninguno',
      acs_litros_manual: num(f.acs),
      apoyo_electrico: !!f.apoyo,
      limpieza_circuito: !!f.limpieza,
    };
  }
  const n = Math.max(1, Math.min(30, Number(f.equipos) || 1));
  const filas = estanciasSuelto(f);
  // El motor cuenta estancias, elige máquina por m² y suma metros. Si no se
  // han puesto metros por equipo pero sí el total antiguo, va el total.
  const metrosTotal = num(f.metros);
  const conMetros = filas.some((x) => num(x.metros) > 0);
  const retirar = Math.max(0, Math.min(30, Number(f.retirar) || 0));
  return {
    tipo_sistema: f.tipo_sistema,
    equipos_a_retirar_n: retirar,
    exteriores_a_retirar_n: Math.max(0, Math.min(30, Number(f.retirar_ext) || 0)),
    preinstalacion_existente: retirar && f.recuperar ? 'si_aprovechable' : 'no',
    estancias: Array.from({ length: n }, (_, i) => ({
      nombre: 'Equipo ' + (i + 1),
      m2: num((filas[i] || {}).m2),
      metros: conMetros ? num((filas[i] || {}).metros) : 0,
    })),
    distancias_lineas: !conMetros && metrosTotal ? [{ estancia: 'total', metros: metrosTotal }] : [],
  };
}

A.cargarPresupuestos = async () => {

};

/* ---------- tocar un presupuesto guardado ----------------------------------
 * El motor propone, la persona decide. Aquí se cambian cantidades, precios y
 * conceptos, se quitan líneas y se añaden otras, también días después de
 * guardarlo. Lo que se cambia de una línea que venía de una regla se apunta en
 * `motor_correcciones`: así se sabe qué reglas hay que corregir.
 *
 * Los totales no se suman en el móvil: se le piden al servidor, que es donde
 * está la aritmética de céntimos.
 * ------------------------------------------------------------------------- */
A.presuEditar = () => {
  const v = V.presuVer; if (!v || !v.datos) return;
  V.presuEdit = {
    dto: Number(v.datos.dto_global_pct || 0),
    cambios: {},          // id de línea -> { cantidad, precio_tarifa, descripcion }
    quitadas: [],
    nueva: null,
    guardando: false,
  };
  render();
};
A.presuEditarCancelar = () => { V.presuEdit = null; render(); };

A.presuLineaCampo = (id, campo, valor) => {
  const e = V.presuEdit; if (!e) return;
  (e.cambios[id] = e.cambios[id] || {})[campo] = valor;
};
A.presuQuitarLinea = (id) => {
  const e = V.presuEdit; if (!e) return;
  const i = e.quitadas.indexOf(id);
  if (i >= 0) e.quitadas.splice(i, 1); else e.quitadas.push(id);
  render();
};
A.presuLineaNueva = () => {
  const e = V.presuEdit; if (!e) return;
  e.nueva = e.nueva ? null : { descripcion: '', cantidad: '1', precio_tarifa: '', seccion: 'Otros' };
  render();
};
A.presuNuevaCampo = (campo, valor) => { if (V.presuEdit && V.presuEdit.nueva) V.presuEdit.nueva[campo] = valor; };
A.presuEditDto = (v) => { if (V.presuEdit) V.presuEdit.dto = Math.max(0, Math.min(100, Number(String(v).replace(',', '.')) || 0)); };

A.presuGuardarCambios = async () => {
  const v = V.presuVer, e = V.presuEdit;
  if (!v || !e || e.guardando) return;
  if (!navigator.onLine) { avisar('Sin conexión: los cambios no se han guardado.'); return; }
  const num = (x) => Number(String(x == null ? '' : x).replace(',', '.'));
  e.guardando = true; render();
  try {
    // 1 · las que se quitan
    for (const id of e.quitadas) await visitasDB.borrarLineaPresupuesto(id);

    // 2 · las que se cambian
    for (const id of Object.keys(e.cambios)) {
      if (e.quitadas.includes(id)) continue;
      const l = (v.datos.lineas || []).find((x) => x.id === id); if (!l) continue;
      const c = e.cambios[id], cambios = {};
      if (c.cantidad != null && num(c.cantidad) !== Number(l.cantidad)) cambios.cantidad = num(c.cantidad);
      if (c.precio_tarifa != null && num(c.precio_tarifa) !== Number(l.precio_tarifa)) cambios.precio_tarifa = num(c.precio_tarifa);
      if (c.descripcion != null && String(c.descripcion).trim() && c.descripcion !== l.descripcion) cambios.descripcion = String(c.descripcion).trim();
      if (!Object.keys(cambios).length) continue;
      await visitasDB.guardarLineaPresupuesto(id, cambios);
      // Si esa línea la había propuesto una regla, queda apuntado el cambio.
      if (l.origen_regla_id) {
        try {
          await visitasDB.apuntarCorreccion({
            presupuesto_id: v.datos.id, regla_id: l.origen_regla_id,
            propuesto_ref: l.producto_ref || l.descripcion,
            elegido_ref: cambios.descripcion || l.producto_ref || l.descripcion,
            motivo: [cambios.cantidad != null ? 'cantidad ' + l.cantidad + ' → ' + cambios.cantidad : '',
                     cambios.precio_tarifa != null ? 'precio ' + l.precio_tarifa + ' → ' + cambios.precio_tarifa : '']
              .filter(Boolean).join(' · ') || 'texto corregido',
          });
        } catch (err) { registrarError('apuntarCorreccion', err); }
      }
    }

    // 3 · la que se añade
    const n = e.nueva;
    if (n && String(n.descripcion || '').trim() && num(n.precio_tarifa) >= 0) {
      await visitasDB.anadirLineaPresupuesto({
        presupuesto_id: v.datos.id,
        orden: ((v.datos.lineas || []).reduce((m, l) => Math.max(m, l.orden || 0), 0)) + 1,
        seccion: n.seccion || 'Otros',
        descripcion: String(n.descripcion).trim(),
        cantidad: num(n.cantidad) || 1,
        unidad: 'ud',
        precio_tarifa: num(n.precio_tarifa) || 0,
        precio_venta: 0,          // lo pone el recálculo
        origen: 'manual',
        confirmada: true,
      });
    }

    // 4 · que el servidor vuelva a sumar
    await visitasDB.recalcularPresupuesto(v.datos.id, e.dto);
    V.presuEdit = null;
    toast('Presupuesto actualizado.');
    V.presuLista.cargado = false; A.cargarPresupuestos();
    await A.presuAbrir(v.datos.id);
  } catch (err) {
    e.guardando = false; render();
    avisar('No se pudieron guardar los cambios: ' + msgError(err));
  }
};

/**
 * Sube el presupuesto a Teamleader. Crea la oferta en el CRM, colgada de la
 * oportunidad de su visita si la tiene; NO se la manda al cliente: eso se hace
 * desde el CRM, que es donde se ve cómo queda.
 */
/** El nombre del PDF de un presupuesto: presupuesto-aerotermia-ana-ferrer.pdf */
const nombrePdfPresu = (d) => ('presupuesto-' + [nombreCat(d.categoria) || 'sysefen', (d.cliente && d.cliente.nombre) || '']
  .filter(Boolean).join('-')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, '-').replace(/-+$/, '') + '.pdf';

/**
 * Sube un presupuesto GUARDADO a Teamleader: la oferta con sus líneas y,
 * además, el PDF de la app en los archivos de la oportunidad. Si el PDF no
 * se puede hacer, se sube igual la oferta.
 */
async function subirPresuATL(id) {
  const d = await visitasDB.verPresupuesto(id);
  let pdf = null;
  try {
    imprimirPresupuestoHTML(d);
    // Si el PDF se atasca (sin cobertura para bajar las librerías), no se
    // espera para siempre: a los 30 s sube la oferta sin él.
    const blob = await Promise.race([
      pdfDeImpresion(),
      new Promise((_, mal) => setTimeout(() => mal(new Error('el PDF tarda demasiado')), 30000)),
    ]);
    const base64 = await new Promise((ok, mal) => {
      const fr = new FileReader();
      fr.onload = () => ok(String(fr.result).replace(/^data:[^,]*,/, ''));
      fr.onerror = () => mal(fr.error);
      fr.readAsDataURL(blob);
    });
    pdf = { base64, nombre: nombrePdfPresu(d) };
  } catch (_) { /* sin PDF: va la oferta sola */ }
  return visitasDB.presupuestoATeamleader(id, false, pdf);
}

// Desde la pantalla de calcular: sale sola al guardar, y este botón queda para
// reintentarlo si falló.
A.presuGuardadoATL = async () => {
  const p = V.presu; if (!p || !p.guardado || p.enviando) return;
  if (!navigator.onLine) { p.errTL = 'Sin conexión: no se ha subido a Teamleader.'; render(); return; }
  p.enviando = true; p.errTL = null; render();
  try {
    const r = await subirPresuATL(p.guardado);
    p.enTL = true; p.enviando = false;
    V.presuLista.cargado = false;
    V.sheet = { tipo: 'tlHecho', r: r || {} };
    render();
  } catch (e) {
    p.enviando = false; p.errTL = msgError(e); render();
  }
};

A.presuATeamleader = async () => {
  const v = V.presuVer; if (!v || !v.datos || v.enviando) return;
  if (!navigator.onLine) { avisar('Sin conexión: el presupuesto se sube desde el servidor.'); return; }
  v.enviando = true; render();
  try {
    const r = await subirPresuATL(v.datos.id);
    await A.presuAbrir(v.datos.id);
    // Se dice dónde ha quedado: la oferta va dentro de una oportunidad, y si
    // era un presupuesto suelto esa oportunidad es nueva.
    V.sheet = { tipo: 'tlHecho', r: r || {} };
    render();
    return r;
  } catch (e) {
    v.enviando = false; render();
    avisar('No se pudo subir: ' + msgError(e));
  }
};

/* =============================================================================
 * AGENDA DE PRESUPUESTOS · clientes y citas (fase A)
 *
 * Primero se da de alta el cliente con su cita; el día llegado, "Empezar
 * visita" abre la toma de datos ya rellena. Requiere sql/etapa23.
 * Crean y cambian citas solo los de presupuestos; jefes y admin las ven.
 * ============================================================================= */
Object.assign(V, {
  agenda: { citas: [], clientes: [], cargado: false, cargando: false, error: null, filtro: 'todas', filtroCli: 'todos', buscar: '' },
  clienteDraft: null, citaDraft: null, clienteVerId: null, citaVerId: null, agBusy: false, agConfirmar: null,
});

const AG_VISTAS = ['agenda', 'clientes', 'clienteNuevo', 'clienteVer', 'citaNueva', 'citaVer'];
const AG_TIPOS = [['particular', 'Particular'], ['empresa', 'Empresa'], ['comunidad', 'Comunidad']];
const AG_ORIGENES = [['recomendacion', 'Recomendación'], ['web', 'Web'], ['llamada', 'Llamada'], ['cliente_existente', 'Cliente de siempre'], ['constructora', 'Constructora'], ['vaillant', 'Vaillant']];
const AG_DURACIONES = [30, 45, 60, 90, 120];
const AG_ESTADOS = { pendiente: 'Pendiente', visitada: 'Visitada', no_estaba: 'No estaba', anulada: 'Anulada' };
const puedeCitar = () => esPresupuestos();
const faltaAgendaSQL = (m) => /does not exist|schema cache|PGRST20[05]|could not find/i.test(String(m || ''));
const agErrorTxt = (e) => (faltaAgendaSQL(msgError(e)) ? 'Falta preparar Supabase: ejecuta sql/etapa23_agenda_citas.sql.' : msgError(e));

const agHoy = () => hoyISO();
const agDiaDe = (iso) => (iso ? fechaLocal(iso) : null);
const agHora = (iso) => (iso ? hhmm(iso) : '');
const agDur = (m) => (m >= 60 ? (m % 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m / 60 + ' h') : m + ' min');
const agSumaDias = (dia, n) => { const d = new Date(dia + 'T12:00'); d.setDate(d.getDate() + n); return fechaLocal(d); };
const agMayus = (s) => String(s || '').replace(/^./, (c) => c.toUpperCase());
function agEtiquetaDia(dia) {
  if (dia === agHoy()) return 'Hoy · ' + fechaLarga(dia);
  if (dia === agSumaDias(agHoy(), 1)) return 'Mañana · ' + fechaLarga(dia);
  return agMayus(fechaLarga(dia));
}
const agCliente = (id) => V.agenda.clientes.find((c) => c.id === id) || null;
const agCita = (id) => V.agenda.citas.find((c) => c.id === id) || null;
const agPresupuestos = () => S.users.filter((u) => u.rol === 'presupuestos' && u.activo !== false && u.empId);
const agNombreEmp = (empId) => { const u = S.users.find((x) => x.empId === empId); return u ? u.nombre : ''; };
const agTipoNombre = (c) => (AG_TIPOS.find((x) => x[0] === c.tipo) || [null, c.tl_tipo === 'company' ? 'Empresa' : 'Particular'])[1];
const agBadge = (txt) => `<span class="badge" style="background:rgba(20,23,15,.06);color:var(--tinta)">${esc(txt)}</span>`;

function agEstadoCliente(c) {
  const vis = c.visitas || [];
  const pend = (c.citas || []).filter((x) => x.estado === 'pendiente');
  if (vis.some((v) => v.sync_estado === 'sincronizada')) return { k: 'teamleader', color: 'var(--verde)', txt: 'En Teamleader' };
  const prox = pend.filter((x) => x.inicio).sort((a, b) => a.inicio.localeCompare(b.inicio))[0];
  if (prox) return { k: 'citado', color: 'var(--ambar)', txt: 'Citado · ' + (agDiaDe(prox.inicio) === agHoy() ? 'hoy' : fechaCorta(prox.inicio)) + ' ' + agHora(prox.inicio) };
  if (vis.length) return { k: 'visitado', color: 'var(--tinta)', txt: vis.some((v) => v.estado === 'completada') ? 'Visitado · por enviar' : 'Visitado · sin cerrar' };
  return { k: 'sin_cita', color: 'var(--rojo)', txt: pend.length ? 'Pendiente de fecha' : 'Sin cita' };
}

/* ---------- carga ---------- */
A.cargarAgenda = async () => {
  const ag = V.agenda; if (ag.cargando) return;
  ag.cargando = true;
  try {
    if (!empRows.length) { try { await cargarMapaEmpleados(); } catch (e) { /* los nombres saldrán vacíos */ } }
    const [citas, clientes] = await Promise.all([visitasDB.listarCitas(), visitasDB.listarClientesAgenda()]);
    ag.citas = citas; ag.clientes = clientes; ag.error = null;
  } catch (e) { ag.error = msgError(e); }
  finally { ag.cargando = false; ag.cargado = true; if (AG_VISTAS.includes(V.view)) render(); }
  clientesPendientesAHoja();
};

/**
 * Los clientes que llegan de la web (o del CRM) entran en la app sin pasar por
 * el formulario, y nadie los apuntaba en la hoja de Drive: había que darle al
 * botón en cada ficha. Ahora el servidor los apunta solo cada cuarto de hora
 * (teamleader-leads); esto es para no esperar: si al abrir la agenda queda
 * alguno fuera, se le pide que los apunte ya. Una vez por sesión, en silencio.
 */
let pendientesPedidos = false;
async function clientesPendientesAHoja() {
  if (pendientesPedidos || !puedeCitar() || !navigator.onLine) return;
  if (!V.agenda.clientes.some((c) => !c.drive_at)) return;
  pendientesPedidos = true;
  try {
    const r = await visitasDB.clientesPendientesADrive();
    if (r && r.apuntados) await A.cargarAgenda();
  } catch (e) { registrarError('clientesPendientesAHoja', e); }
}

/* ---------- acciones: un solo despachador para todo lo que empieza por ag_ ---------- */
A.ag = (a, d, e) => {
  const cd = V.citaDraft;
  switch (a) {
    case 'ag_filtro': V.agenda.filtro = d.f; return render();
    case 'ag_mesToggle': V.agenda.verMes = !V.agenda.verMes; return render();
    case 'ag_dia': V.agenda.dia = V.agenda.dia === d.dia ? null : d.dia; return render();
    case 'ag_mes': {
      const [y, m] = (V.agenda.mes || agHoy().slice(0, 7)).split('-').map(Number);
      const n = new Date(y, m - 1 + Number(d.m), 1);
      V.agenda.mes = n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'); V.agenda.dia = null;
      return render();
    }
    case 'ag_filtroCli': V.agenda.filtroCli = d.f; return render();
    case 'ag_sinCita': V.agenda.filtroCli = 'sin_cita'; V.view = 'clientes'; return render();
    case 'ag_visitas': return A.ir('visitas');
    case 'ag_volver': V.view = d.v; return render();
    case 'ag_nuevoCliente': return agNuevoCliente();
    case 'ag_editarCliente': return agEditarCliente(d.id);
    case 'ag_cliTipo': if (V.clienteDraft) V.clienteDraft.tipo = d.t; return render();
    case 'ag_cliOrigen': if (V.clienteDraft) V.clienteDraft.origen = V.clienteDraft.origen === d.o ? null : d.o; return render();
    case 'ag_guardarCliente': return agGuardarCliente(d.cita === '1');
    case 'ag_abrirCliente': V.clienteVerId = d.id; V.view = 'clienteVer'; scrollMemo.clienteVer = 0; render(); return A.cargarAgenda();
    case 'ag_abrirCita': V.citaVerId = d.id; V.agConfirmar = null; V.view = 'citaVer'; scrollMemo.citaVer = 0; return render();
    case 'ag_nuevaCita': if (e) e.stopPropagation(); return agNuevaCita(d.id, false);
    case 'ag_editarCita': return agEditarCita(d.id);
    // Antes de repintar se lee la rueda: si no, se perdería la hora recién movida.
    case 'ag_citaDia': if (cd) { sincronizarRuedas(); cd.dia = d.dia || null; } return render();
    case 'ag_citaDur': if (cd) { sincronizarRuedas(); cd.duracion = +d.m; } return render();
    case 'ag_citaCat': if (cd) { sincronizarRuedas(); const i = cd.categorias.indexOf(d.c); if (i >= 0) cd.categorias.splice(i, 1); else cd.categorias.push(d.c); } return render();
    case 'ag_citaQuien': if (cd) { sincronizarRuedas(); cd.empleadoId = cd.empleadoId === d.id ? null : d.id; } return render();
    case 'ag_guardarCita': return agGuardarCita();
    case 'ag_estado': return agCambiarEstado(d.id, d.e);
    case 'ag_reenviar': return agReenviarAviso(d.id);
    case 'ag_borrarCita': if (e) e.stopPropagation(); return agBorrarCita(d.id);
    case 'ag_confirmarBorrarCita': return agConfirmarBorrarCita();
    case 'ag_borrarCliente': if (e) e.stopPropagation(); return agBorrarCliente(d.id);
    case 'ag_confirmarBorrarCliente': return agConfirmarBorrarCliente();
    case 'ag_empezar': if (e) e.stopPropagation(); return agEmpezarVisita(d.id);
  }
};

function agNuevoCliente() {

function agEditarCita(id) {
  const x = agCita(id); if (!x || !puedeCitar()) return;
  const ini = x.inicio ? new Date(x.inicio) : null;
  V.citaDraft = {
    id: x.id, clienteId: x.cliente_id, desdeAlta: false, dia: ini ? fechaLocal(ini) : null,
    horaMin: ini ? ini.getHours() * 60 + ini.getMinutes() : 600, duracion: x.duracion_min || 60,
    categorias: (x.categorias || []).slice(), empleadoId: x.empleado_id || null,

  };

async function agGuardarCita() {
  sincronizarRuedas();
  const d = V.citaDraft; if (!d || V.agBusy) return;
  const choques = agSolapes(d).filter((o) => o.mismo);
  if (choques.length && V.agConfirmar !== 'solape') {
    V.agConfirmar = 'solape'; render();
    avisar('Esa hora choca con otra cita de ' + agNombreEmp(d.empleadoId) + '. Pulsa «Guardar igualmente» si es a propósito.');
    return;
  }
  V.agConfirmar = null;
  if (!navigator.onLine) { avisar('Sin conexión: la cita no se ha guardado.'); return; }
  let inicio = null;
  if (d.dia) {
    const h = Math.floor(d.horaMin / 60), m = d.horaMin % 60;
    inicio = new Date(`${d.dia}T${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:00`).toISOString();
  }
  const fila = {
    cliente_id: d.clienteId, inicio, duracion_min: d.duracion, categorias: d.categorias, empleado_id: d.empleadoId,
    direccion: String(d.direccion || '').trim() || null, poblacion: String(d.poblacion || '').trim() || null,
    nota: String(d.nota || '').trim() || null,
  };
  if (d.id) {
    fila.id = d.id;
    // Si cambia el momento de la cita, el aviso del día antes vuelve a tocar.
    const antes = agCita(d.id);
    if (!antes || antes.inicio !== inicio) fila.aviso_enviado_at = null;
    // Si el cliente ya había recibido el aviso, el correo nuevo tiene que decir
    // que es un cambio y desde cuándo.
    if (antes && antes.inicio && antes.inicio !== inicio) {
      fila.cambio_desde = (antes.aviso_enviado_at || antes.confirmacion_enviada_at) ? antes.inicio : null;
    }
  }
  V.agBusy = true; render();
  try {
    const g = await visitasDB.guardarCita(fila);
    V.agBusy = false; V.citaDraft = null;
    avisarDeCita(g.id);
    toast(inicio ? 'Cita guardada: ' + fechaCorta(inicio) + ' a las ' + hhmm(inicio) + '.' : 'Guardado como pendiente de fecha.');
    await A.cargarAgenda();
    V.citaVerId = g.id; V.view = 'citaVer'; render();
  } catch (e) {
    V.agBusy = false; render();
    avisar('No se pudo guardar la cita: ' + agErrorTxt(e));
  }
}

/**
 * El correo de la cita sale al momento: «cita nueva» al crearla, «cambio de
 * cita» al moverla y «cita anulada» al anularla, al cliente y a quien va.
 * Si esto falla (sin cobertura, por ejemplo) no se para nada: la tarea
 * programada lo recoge en la siguiente pasada.
 */
async function avisarDeCita(id, otraVez) {
  if (!id) return;
  if (!navigator.onLine) { avisar('Sin conexión: el correo de la cita saldrá en la siguiente pasada de la tarea programada.'); return; }
  try {
    const r = await visitasDB.avisarCita(id, otraVez);
    if (r && r.enviados) {
      toast(r.tipo === 'anulada' ? 'Anulación avisada por correo.'
        : r.tipo === 'cambio' ? 'Cambio avisado por correo.'
        : 'Cita avisada por correo.');
    } else if (r && r.sin_correo) {
      // Antes esto se callaba y parecía que el correo no salía porque sí.
      avisar(r.cliente_sin_email
        ? 'La cita está guardada, pero el cliente no tiene email: no se le ha avisado. Pónselo en su ficha y pulsa «Reenviar aviso».'
        : 'La cita está guardada, pero no hay a quién avisar por correo.');
    } else if (r && r.nada) {
      if (otraVez) toast('No hay nada que avisar: ' + r.nada + '.');
    } else if (r && r.errores && r.errores.length) {
      avisar('El correo de la cita no ha salido: ' + r.errores.join(' · '));
    }
    if (V.view === 'citaVer' || V.view === 'agenda') await A.cargarAgenda();
  } catch (e) {
    // Se dice, en vez de callarlo: si la función no está subida o la sesión no
    // puede, hay que verlo. La tarea programada lo reintenta igual.
    avisar('El correo de la cita no ha salido (' + agErrorTxt(e) + '). La tarea programada lo reintentará.');
  }
}

async function agReenviarAviso(id) {
  if (!puedeCitar() || V.agReenviando) return;
  V.agReenviando = id; render();
  try { await avisarDeCita(id, true); }
  finally { V.agReenviando = null; render(); }
}

/* ---------- solapes: ¿esa hora pisa otra cita? ---------- */
const agMinDelDia = (iso) => { const t = new Date(iso); return t.getHours() * 60 + t.getMinutes(); };
const agRango = (s, e) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}–${Math.floor(e / 60)}:${String(e % 60).padStart(2, '0')}`;
function agSolapes(d) {
  if (!d || !d.dia) return [];
  const ini = d.horaMin, fin = d.horaMin + (d.duracion || 60);
  return V.agenda.citas
    .filter((x) => x.estado === 'pendiente' && x.inicio && x.id !== d.id && agDiaDe(x.inicio) === d.dia)
    .map((x) => { const s = agMinDelDia(x.inicio); return { x, s, e: s + (x.duracion_min || 60) }; })
    .filter((o) => o.s < fin && ini < o.e)
    .map((o) => Object.assign(o, { mismo: !!d.empleadoId && o.x.empleado_id === d.empleadoId }));
}
// Se repinta sola al mover la rueda (refrescarNumerosRueda), sin render().
function agSolapeHTML(d) {
  if (!d || !d.dia) return '';
  const quien = (o) => esc(((o.x.cliente || {}).nombre) || 'Cliente') + (o.x.empleado_id ? ' (' + esc(agNombreEmp(o.x.empleado_id)) + ')' : '');
  const tuya = 'Tu cita: ' + agRango(d.horaMin, d.horaMin + (d.duracion || 60)) + '.';
  const sol = agSolapes(d);
  const mismos = sol.filter((o) => o.mismo), otros = sol.filter((o) => !o.mismo);
  if (mismos.length) {
    return `<div class="aviso-rojo"><span class="ex">!</span><div class="col" style="gap:3px">
      <b style="font:600 13px/1.3 var(--sans)">Choca con otra cita de ${esc(agNombreEmp(d.empleadoId))}</b>
      <span style="font:400 12px/1.4 var(--sans)">${tuya} Ocupado: ${mismos.map((o) => agRango(o.s, o.e) + ' ' + quien(o)).join(' · ')}</span></div></div>`;
  }
  if (otros.length) {
    return `<div class="tiny" style="color:var(--ambar-o)">${tuya} A esa hora también hay: ${otros.map((o) => agRango(o.s, o.e) + ' ' + quien(o)).join(' · ')}</div>`;
  }
  const delDia = V.agenda.citas
    .filter((x) => x.estado === 'pendiente' && x.inicio && x.id !== d.id && agDiaDe(x.inicio) === d.dia)
    .map((x) => { const s = agMinDelDia(x.inicio); return agRango(s, s + (x.duracion_min || 60)); });
  return `<div class="tiny" style="color:var(--verde-o)">${tuya} No choca con ninguna cita.${delDia.length ? ' Ese día ocupado: ' + delDia.join(', ') + '.' : ''}</div>`;
}

/* ---------- vistas ---------- */
function agAvisoHTML() {
  const ag = V.agenda;
  if (ag.error) {
    const falta = faltaAgendaSQL(ag.error);
    return `<div class="card" style="background:var(--rojo-cl);margin-bottom:14px">
      <div style="font:600 14px var(--sans);color:var(--rojo)">${falta ? 'Falta preparar la base de datos' : 'No se pudo cargar la agenda'}</div>
      <div class="sub" style="font-size:13px;margin-top:6px;color:var(--rojo)">${falta ? 'Hay que ejecutar sql/etapa23_agenda_citas.sql en Supabase.' : esc(ag.error)}</div>
    </div>`;
  }
  return !ag.cargado ? '<div class="tiny" style="margin-bottom:12px">Cargando…</div>' : '';
}

/**
 * El mes de la agenda. Cada punto es una cita pendiente (de todos, o solo las
 * mías si está ese filtro). Tocar un día deja la lista solo con ese día; volver
 * a tocarlo, o "Ver todas", la deja como siempre.
 */
function agCalendarioHTML(citas) {
  const ag = V.agenda, hoy = agHoy();
  const mes = ag.mes || hoy.slice(0, 7);
  const [y, m] = mes.split('-').map(Number);
  const primero = new Date(y, m - 1, 1), diasMes = new Date(y, m, 0).getDate();
  const hueco = (primero.getDay() + 6) % 7;   // semana de lunes a domingo
  const porDia = {};
  citas.forEach((x) => { const d = agDiaDe(x.inicio); porDia[d] = (porDia[d] || 0) + 1; });
  const celdas = [];
  for (let i = 0; i < hueco; i++) celdas.push('<div></div>');
  for (let d = 1; d <= diasMes; d++) {
    const dia = mes + '-' + String(d).padStart(2, '0');
    const n = porDia[dia] || 0, pasado = dia < hoy;
    const cls = ['ag-cal-d', pasado ? 'fuera' : '', dia === hoy ? 'hoy' : '', ag.dia === dia ? 'sel' : ''].filter(Boolean).join(' ');
    celdas.push(`<div class="${cls}" ${pasado ? '' : `data-a="ag_dia" data-dia="${dia}"`}>${d}${n ? `<em>${'<u></u>'.repeat(Math.min(n, 4))}</em>` : ''}</div>`);
  }
  const nombreMes = primero.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
  return `<div class="ag-cal">
    <div class="ag-cal-cab">${mes > hoy.slice(0, 7) ? '<span data-a="ag_mes" data-m="-1">‹</span>' : '<span style="visibility:hidden">‹</span>'}<b>${esc(agMayus(nombreMes))}</b><span data-a="ag_mes" data-m="1">›</span></div>
    <div class="ag-cal-g">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((l) => `<i>${l}</i>`).join('')}${celdas.join('')}</div>
  </div>`;
}

function vAgenda() {
  const ag = V.agenda, hoy = agHoy(), yoEmp = miEmpId();
  const b = leerBorradorVisita();
  let citas = ag.citas.filter((x) => x.estado === 'pendiente' && x.inicio && agDiaDe(x.inicio) >= hoy);
  if (ag.filtro === 'mias' && puedeCitar()) citas = citas.filter((x) => x.empleado_id === yoEmp);
  citas.sort((p, q) => p.inicio.localeCompare(q.inicio));
  const todas = citas;
  if (ag.dia) citas = citas.filter((x) => agDiaDe(x.inicio) === ag.dia);
  const sinCita = ag.clientes.filter((c) => agEstadoCliente(c).k === 'sin_cita').length;

  // --- la semana que viene, de un vistazo: hoy y seis días más --------------
  const porDia = {};
  todas.forEach((x) => { const d = agDiaDe(x.inicio); porDia[d] = (porDia[d] || 0) + 1; });
  const semana = [];
  for (let i = 0; i < 7; i++) {
    const t = new Date(hoy + 'T12:00:00'); t.setDate(t.getDate() + i);
    const dia = fechaLocal(t.toISOString());
    const n = porDia[dia] || 0;
    const cls = ['ag-cal-d', dia === hoy ? 'hoy' : '', ag.dia === dia ? 'sel' : ''].filter(Boolean).join(' ');
    semana.push(`<div class="${cls}" data-a="ag_dia" data-dia="${dia}"><i>${'LMXJVSD'[(t.getDay() + 6) % 7]}</i>${t.getDate()}<em>${'<u></u>'.repeat(Math.min(n, 4))}</em></div>`);
  }

  // --- la próxima cita, grande: es lo que se necesita con el móvil en la mano
  const prox = todas[0] || null;
  const proxHTML = (x) => {
    const c = x.cliente || agCliente(x.cliente_id) || {};
    const dir = [x.direccion || c.direccion, x.poblacion || c.poblacion].filter(Boolean).join(' · ');
    const esHoy = agDiaDe(x.inicio) === hoy;
    const falta = new Date(x.inicio).getTime() - Date.now();
    const enTxt = !esHoy ? agEtiquetaDia(agDiaDe(x.inicio)) : falta <= 0 ? 'Ahora' : falta < 3600e3 ? 'En ' + Math.round(falta / 60e3) + ' min' : 'En ' + Math.floor(falta / 3600e3) + ' h ' + String(Math.round((falta % 3600e3) / 60e3)).padStart(2, '0') + ' min';
    return `<div class="row" style="justify-content:space-between;margin-bottom:8px"><div class="lbl">Próxima cita</div><span class="tiny" style="color:${esHoy ? 'var(--ambar-o)' : 'var(--t3)'}">${esc(enTxt)}</span></div>
    <div class="ag-prox ${esHoy ? '' : 'lejos'}">
      <div class="ag-cita" data-a="ag_abrirCita" data-id="${x.id}" style="cursor:pointer">
        <div class="ag-hora" style="font-size:30px">${agHora(x.inicio)}<small>${agDur(x.duracion_min || 60)}</small></div>
        <div style="min-width:0">
          <div class="h2" style="font-size:19px">${esc(c.nombre || 'Cliente')}</div>
          <div class="sub" style="margin-top:3px">${esc(dir || 'Sin dirección')}</div>
          <div class="row" style="gap:6px;margin-top:8px;flex-wrap:wrap">${(x.categorias || []).map((k) => agBadge(nombreCat(k))).join('')}<div class="grow"></div><span class="tiny">${esc(agNombreEmp(x.empleado_id))}</span></div>
        </div>
      </div>
      ${accionLlamar(c.telefono) || accionComoLlegar(dir) ? `<div class="ag-acciones">${accionLlamar(c.telefono)}${accionComoLlegar(dir)}</div>` : ''}
      ${puedeCitar() ? (esHoy
        ? `<button class="btn btn-verde" data-a="ag_empezar" data-id="${x.id}" style="margin-top:12px;padding:15px;font-size:15px">Empezar visita</button>`
        : `<button class="pill" data-a="ag_abrirCita" data-id="${x.id}" style="margin-top:12px;padding:12px;width:100%;text-align:center">Ver la cita</button>`) : ''}
    </div>`;
  };

  // --- lo que está a medias, como tareas: cada una abre justo eso -----------
  const tareas = [];
  const tarea = (color, titulo, sub, accion, attrs) => tareas.push(`<div class="ag-tarea" ${attrs}>
      <span class="dot" style="background:${color}"></span>
      <div class="grow" style="min-width:0"><b>${titulo}</b>${sub ? `<small>${sub}</small>` : ''}</div>
      <span class="pill">${accion}</span></div>`);
  if (b && b.draft && puedeCitar()) {
    tarea('var(--ambar)', 'Visita a medias · paso ' + (b.paso || 1) + ' de 5', esc((b.draft._cliente || {}).nombre || b.draft.direccion || ''), 'Seguir', 'data-a="seguirBorrador"');
  }
  if (puedeCitar()) {
    ag.clientes.forEach((c) => (c.visitas || []).forEach((v) => {
      if (v.sync_estado === 'sincronizada') return;
      const cerrada = v.estado === 'completada';
      tarea('var(--ambar)', 'Visita de ' + esc(c.nombre || 'cliente') + (cerrada ? ' por enviar' : ' sin cerrar'),
        esc(v.codigo || '') + (v.sync_estado === 'error' ? ' · falló la subida' : ''), cerrada ? 'Subir' : 'Cerrar', `data-a="abrirVisita" data-id="${v.id}"`);
    }));
    const pl = V.presuLista;
    if (pl.cargado) {
      pl.filas.filter((p) => !p.tl_quotation_id && p.sync_estado !== 'sincronizado').slice(0, 3).forEach((p) => {
        tarea('var(--ambar)', 'Presupuesto de ' + esc(nombreCat(p.categoria) || p.categoria).toLowerCase() + (p.cliente && p.cliente.nombre ? ' · ' + esc(p.cliente.nombre) : ''),
          p.sync_estado === 'error' ? 'No se pudo subir a Teamleader' : 'Guardado, sin subir a Teamleader', 'Subir', `data-a="presuAbrir" data-id="${p.id}"`);
      });
    } else if (!pl.cargando) { A.cargarPresupuestos(); }
  }
  if (sinCita) tarea('var(--rojo)', sinCita === 1 ? '1 cliente sin cita' : sinCita + ' clientes sin cita', 'Falta ponerles día', 'Ver', 'data-a="ag_sinCita"');

  const tarjeta = (x) => {
    const c = x.cliente || agCliente(x.cliente_id) || {};
    const esHoy = agDiaDe(x.inicio) === hoy;
    return `<div class="card" data-a="ag_abrirCita" data-id="${x.id}" style="margin-bottom:10px;cursor:pointer${esHoy ? ';box-shadow:0 0 0 1.5px var(--ambar),var(--sh)' : ''}">
      <div class="ag-cita">
        <div class="ag-hora">${agHora(x.inicio)}<small>${agDur(x.duracion_min || 60)}</small></div>
        <div style="min-width:0">
          <div class="h2" style="font-size:17px">${esc(c.nombre || 'Cliente')}</div>
          <div class="sub" style="margin-top:3px">${esc([x.direccion || c.direccion, x.poblacion || c.poblacion].filter(Boolean).join(' · ') || 'Sin dirección')}</div>
          <div class="row" style="gap:6px;margin-top:10px;flex-wrap:wrap">${(x.categorias || []).map((k) => agBadge(nombreCat(k))).join('')}<div class="grow"></div><span class="tiny">${esc(agNombreEmp(x.empleado_id))}</span></div>
        </div>
      </div>
      ${esHoy && puedeCitar() ? `<button class="btn btn-verde" data-a="ag_empezar" data-id="${x.id}" style="margin-top:14px;padding:14px;font-size:15px">Empezar visita</button>` : ''}
    </div>`;
  };

  // Las demás citas: sin repetir la que ya va arriba en grande.
  const resto = citas.filter((x) => !prox || x.id !== prox.id || ag.dia);
  const dias = [...new Set(resto.map((x) => agDiaDe(x.inicio)))];
  const yo = userById(V.user.id) || {};
  const fechaHoy = new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

  return `<div class="hdr">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:14px">
      ${marcaSysefen(false)}
      ${avatarHTML(V.user.id, 'width:32px;height:32px;font-size:13px;background:rgba(20,23,15,.08);color:var(--tinta);cursor:pointer', 'data-a="menuUsuario"')}
    </div>
    <div class="lbl">${esc(agMayus(fechaHoy))}</div>
    <div class="row" style="justify-content:space-between;align-items:baseline;margin-top:4px">
      <div class="h1">${puedeCitar() ? 'Hola, ' + esc((yo.nombre || '').split(' ')[0] || '') : 'Citas'}</div>
      <div class="tiny" style="flex:none">${todas.filter((x) => agDiaDe(x.inicio) === hoy).length === 1 ? '1 cita hoy' : todas.filter((x) => agDiaDe(x.inicio) === hoy).length + ' citas hoy'}${tareas.length ? ' · ' + tareas.length + (tareas.length === 1 ? ' pendiente' : ' pendientes') : ''}</div>
    </div>
    <div class="ag-semana">${semana.join('')}</div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <span class="tiny" data-a="ag_mesToggle" style="cursor:pointer;text-decoration:underline">${ag.verMes ? 'Ocultar el mes' : 'Ver el mes entero'}</span>
      ${puedeCitar() ? `<span class="tiny">${[['todas', 'Todas'], ['mias', 'Mías']].map(([k, l]) => `<span data-a="ag_filtro" data-f="${k}" style="cursor:pointer;padding:4px 6px;${ag.filtro === k ? 'color:var(--tinta);font-weight:600;text-decoration:underline' : ''}">${l}</span>`).join('')}</span>` : ''}
    </div>
  </div>
  <div class="scroll pad pb-nav sin-marca">
    ${agAvisoHTML()}
    ${ag.verMes ? agCalendarioHTML(todas) : ''}
    ${ag.dia ? `<div class="row" style="justify-content:space-between;margin:0 0 12px"><div class="sub">Solo el ${esc(agEtiquetaDia(ag.dia).toLowerCase())}</div><span class="tiny" data-a="ag_dia" data-dia="${ag.dia}" style="cursor:pointer;text-decoration:underline">Ver todas</span></div>` : ''}
    ${ag.dia && !citas.length ? `<div class="card" style="margin-bottom:14px"><div class="sub">Ese día no hay citas.${puedeCitar() ? ' Para poner una, abre el cliente y dale a «Poner cita».' : ''}</div></div>` : ''}
    ${prox && !ag.dia ? proxHTML(prox) : ''}
    ${!prox && !ag.dia && ag.cargado && !ag.error ? `<div class="card"><div class="h2">Sin citas próximas</div><div class="sub" style="margin-top:6px">${puedeCitar() ? 'Da de alta un cliente en Clientes y ponle día.' : 'El equipo de presupuestos no tiene citas por delante.'}</div></div>` : ''}
    ${tareas.length && !ag.dia ? `<div class="lbl" style="margin:18px 0 8px">Pendiente</div>${tareas.join('')}` : ''}
    ${dias.map((dia, i) => {
      const delDia = resto.filter((x) => agDiaDe(x.inicio) === dia);
      return `<div class="row" style="justify-content:space-between;margin:${i || !ag.dia ? 18 : 0}px 0 10px"><div class="lbl">${esc(agEtiquetaDia(dia))}</div><span class="tiny">${delDia.length === 1 ? '1 cita' : delDia.length + ' citas'}</span></div>${delDia.map(tarjeta).join('')}`;
    }).join('')}
    ${puedeCitar() ? `<div class="card row" data-a="ag_visitas" style="margin-top:18px;cursor:pointer">
      <div class="grow"><div style="font:600 15px var(--sans)">Todas las visitas</div>
      <div class="sub" style="font-size:12px;margin-top:4px">Las fichas tomadas: sin cerrar, por enviar y en Teamleader.</div></div>
      <div style="font:400 20px/1 var(--sans);color:var(--t3)">›</div>
    </div>` : ''}
  </div>`;
}

function clientesListaHTML() {
  const ag = V.agenda, q = String(ag.buscar || '').trim().toLowerCase();
  let lista = ag.clientes.map((c) => ({ c, e: agEstadoCliente(c) }));
  if (ag.filtroCli !== 'todos') lista = lista.filter((x) => x.e.k === ag.filtroCli);
  if (q) lista = lista.filter(({ c }) => [c.nombre, c.telefono, c.poblacion, c.email].some((v) => String(v || '').toLowerCase().includes(q)));
  if (!lista.length) return `<div class="card"><div class="sub">${ag.clientes.length ? 'Ningún cliente con ese filtro.' : (ag.cargado ? 'Todavía no hay clientes.' : 'Cargando…')}</div></div>`;
  return lista.map(({ c, e }) => `<div class="card" data-a="ag_abrirCliente" data-id="${c.id}" style="margin-bottom:10px;cursor:pointer">
    <div class="row g8"><span class="dot" style="width:8px;height:8px;background:${e.color}"></span><span class="lbl"${e.k === 'sin_cita' ? ' style="color:var(--rojo)"' : ''}>${esc(e.txt)}</span></div>
    <div class="h2" style="font-size:17px;margin-top:8px">${esc(c.nombre)}</div>
    <div class="sub" style="margin-top:3px">${esc([agTipoNombre(c), c.poblacion, c.telefono].filter(Boolean).join(' · '))}</div>
    ${e.k === 'sin_cita' && puedeCitar() ? `<div class="row" style="margin-top:12px;padding-top:11px;border-top:1px solid var(--l1)">
      ${c.nota ? `<span class="tiny grow ell">${esc(c.nota)}</span>` : '<div class="grow"></div>'}
      <button class="pill" data-a="ag_nuevaCita" data-id="${c.id}" style="padding:8px 12px">Citar</button>
    </div>` : ''}
  </div>`).join('');
}

  const cuenta = (k) => ag.clientes.filter((c) => agEstadoCliente(c).k === k).length;
  const filtros = [['todos', 'Todos'], ['sin_cita', 'Sin cita'], ['citado', 'Citados'], ['visitado', 'Visitados'], ['teamleader', 'En Teamleader']];
  return `<div class="hdr">
    <div class="row" style="justify-content:space-between">
      <div class="h1">Clientes</div>
      ${puedeCitar() ? '<button class="pill" data-a="ag_nuevoCliente" style="background:var(--tinta);color:#fff">+ Cliente</button>' : ''}
    </div>
    <input class="inp" id="ag-buscar" data-f="ag_buscar" value="${esc(ag.buscar || '')}" placeholder="Nombre, teléfono o población" autocomplete="off" style="margin-top:14px">
    <div class="wrap" style="margin-top:12px">${filtros.map(([k, l]) => {
      const n = k === 'todos' ? 0 : cuenta(k);
      return `<span class="chip ${ag.filtroCli === k ? 'on' : ''}" data-a="ag_filtroCli" data-f="${k}" style="cursor:pointer">${l}${n ? ' · ' + n : ''}</span>`;

  <div class="scroll pad pb-nav">

    ${webListaHTML()}
    <div id="clientes-lista">${clientesListaHTML()}</div>
  </div>`;
}

/**
 * Los que han entrado por la web (sql/etapa32): aparte y por delante, porque
 * son los que están esperando a que alguien les llame.
 */
function webListaHTML() {
  if (!puedeCitar()) return '';
  // Ya visitado o ya citado deja de estar pendiente, aunque la visita se hiciera
  // sin pasar por una cita.
  const web = (V.agenda.clientes || []).filter((c) => c.lead_at
    && !(c.citas || []).length && !(c.visitas || []).length);
  const boton = `<button class="pill" data-a="leadsBuscar" style="padding:8px 14px;font-size:12px" ${V.leadsBusy ? 'disabled' : ''}>${V.leadsBusy ? 'Mirando…' : 'Mirar ahora'}</button>`;
  if (!web.length) {
    return `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:16px">
      <span class="lbl">De la web · ninguno pendiente</span>${boton}</div>`;
  }
  const cuando = (iso) => {
    const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    return dias <= 0 ? 'hoy' : dias === 1 ? 'ayer' : 'hace ' + dias + ' días';
  };
  return `<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:10px">
    <span class="lbl">De la web · ${web.length} sin cita</span>${boton}</div>
  ${web.sort((a, b) => String(b.lead_at).localeCompare(String(a.lead_at))).map((c) => `<div class="card" data-a="ag_abrirCliente" data-id="${c.id}" style="margin-bottom:11px;cursor:pointer;box-shadow:0 0 0 1.5px var(--ambar),var(--sh)">
    <div class="row g8"><span class="badge" style="background:var(--ambar);color:var(--tinta)">Web</span>
      <span class="tiny">Llegó ${cuando(c.lead_at)}</span></div>
    <div class="h2" style="margin-top:9px">${esc(c.nombre)}</div>
    <div class="sub" style="margin-top:4px">${esc([agTipoNombre(c), c.telefono, c.poblacion].filter(Boolean).join(' · ') || 'Sin más datos')}</div>
    ${puedeCitar() ? `<button class="pill pill-verde" data-a="ag_nuevaCita" data-id="${c.id}" style="margin-top:12px;padding:11px;width:100%;text-align:center">Ponerle cita</button>` : ''}
  </div>`).join('')}
  <div style="height:12px"></div>`;
}

function crmResultadosHTML() {
  const b = V.crmBuscar;
  const fila = (x) => `<div class="card row" data-a="crmTraer" data-id="${esc(x.tl_id)}" data-t="${esc(x.tipo)}" data-en="${esc(x.cliente_id || '')}" style="margin-bottom:8px;cursor:pointer">
    <div class="av" style="width:36px;height:36px;background:rgba(20,23,15,.06);color:var(--t2);font-size:13px">${esc(inicialesCli(x.nombre))}</div>
    <div class="grow"><div style="font:600 15px/1.2 var(--sans)">${esc(x.nombre)}</div>
    <div class="sub" style="font-size:12px;margin-top:3px">${esc([x.tipo === 'company' ? 'Empresa' : 'Particular', x.telefono, x.poblacion].filter(Boolean).join(' · '))}</div></div>
    ${x.cliente_id ? '<span class="badge" style="background:rgba(20,23,15,.06);color:var(--t2)">Ya está</span>' : '<div style="font:400 20px/1 var(--sans);color:var(--t3)">›</div>'}
  </div>`;
  if (b.busy) return '<div class="sub" style="font-size:12px;margin-top:10px">Buscando en el CRM…</div>';
  if (b.error) return `<div class="sub" style="font-size:12px;margin-top:10px;color:var(--rojo)">${esc(b.error)}</div>`;
  if (b.filas.length) return `<div style="margin-top:12px">${b.filas.map(fila).join('')}</div>`;
  if (b.hecho) return '<div class="sub" style="font-size:12px;margin-top:10px">No aparece en el CRM. Dalo de alta aquí abajo.</div>';
  return '';
}

// Qué pasa con el correo de aviso de una cita. La tarea de Supabase revisa
// cada 10 minutos y avisa de las citas de las próximas 24 horas.
// La confirmación sale en cuanto la cita tiene día y hora (salvo que ya entre
// en el recordatorio de 24 h, que dice lo mismo).
function agConfirmTxt(x, c) {
  if (x.confirmacion_enviada_at) return 'Enviada ' + fechaCorta(x.confirmacion_enviada_at) + ' ' + hhmm(x.confirmacion_enviada_at);
  if (x.estado !== 'pendiente' || !x.inicio) return '';
  if (new Date(x.inicio).getTime() < Date.now()) return '';
  if (!c.email) return 'Sin envío: el cliente no tiene email';
  if (new Date(x.inicio).getTime() - Date.now() <= 24 * 3600 * 1000) return 'No hace falta: entra en el aviso de 24 h';
  return 'En unos minutos · al cliente';
}
function agAvisoTxt(x, c) {
  if (x.aviso_enviado_at) return 'Enviado ' + fechaCorta(x.aviso_enviado_at) + ' ' + hhmm(x.aviso_enviado_at);
  if (x.cambio_desde) return 'Cambio de cita · en unos minutos · ' + esc(c.email ? 'al cliente' : 'el cliente no tiene email');
  if (x.estado !== 'pendiente' || !x.inicio) return x.inicio ? '' : 'Cuando tenga fecha';
  if (new Date(x.inicio).getTime() < Date.now()) return '';
  const row = empRowById(x.empleado_id) || {};
  const quien = agNombreEmp(x.empleado_id) || 'quien va';
  const para = [c.email ? 'al cliente' : '', row.email_avisos ? 'a ' + quien : ''].filter(Boolean);
  if (!para.length) return 'Sin envío: faltan el email del cliente y el email para avisos de ' + esc(quien);
  const sale = new Date(new Date(x.inicio).getTime() - 24 * 3600 * 1000);
  const cuandoSale = sale.getTime() <= Date.now() ? 'En unos minutos' : fechaCorta(sale.toISOString()) + ' ' + hhmm(sale.toISOString());
  return cuandoSale + ' · ' + esc(para.join(' y '));
}

    cal: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',

  let pie = '';

    pie = `<div class="pie"><button class="btn btn-gris" data-a="abrirVisita" data-id="${x.visita_id}">Ver la visita</button></div>`;
  } else if (puedeCitar()) {
    pie = `<div class="pie"><button class="btn btn-verde" data-a="ag_nuevaCita" data-id="${x.cliente_id}">Nueva cita</button></div>`;

/**
 * El cliente en Teamleader: si está, se dice y ya; si falló, se ve por qué y
 * se reintenta. Sin enlaces al CRM: cada móvil no tiene por qué tener sesión.
 */
function agCRMHTML(c) {
  if (!puedeCitar()) return '';
  const d = V.cliCRM && V.cliCRM.id === c.id ? V.cliCRM : null;
  const trabajando = d && d.estado === 'subiendo';
  if (!d && c.tl_id && !c.tl_error) return '';       // ya está en el CRM, sin novedad
  return `<div class="card" style="margin-bottom:18px">
    <div class="row g8"><span class="lbl">Teamleader</span></div>
    ${trabajando ? '<div class="sub" style="margin-top:7px;font-size:13px">Creándolo en el CRM…</div>' : ''}
    ${d && d.estado === 'ok' ? `<div class="sub" style="margin-top:7px;font-size:13px">✓ ${d.creado ? 'Creado en el CRM' : 'Ya estaba en el CRM: se ha enlazado'}.</div>` : ''}
    ${d && d.estado === 'error' ? `<div class="sub" style="margin-top:7px;font-size:13px;color:var(--rojo)">${d.sinConectar
        ? 'El CRM no está conectado. Lo conecta Administración desde Ajustes → Teamleader; mientras, el cliente se queda guardado aquí.'
        : 'No se pudo crear: ' + esc(d.error || '')}</div>` : ''}
    ${!d && c.tl_error ? `<div class="sub" style="margin-top:7px;font-size:13px;color:var(--rojo)">No se pudo crear: ${esc(c.tl_error)}</div>` : ''}
    ${!d && !c.tl_id && !c.tl_error ? '<div class="sub" style="margin-top:7px;font-size:13px">Todavía no está en el CRM.</div>' : ''}
    ${!trabajando ? `<button class="pill" data-a="cliCRMReintentar" data-id="${c.id}" style="margin-top:10px;padding:11px;width:100%;text-align:center">${c.tl_id ? 'Repasarlo en el CRM' : 'Crearlo en el CRM'}</button>` : ''}
  </div>`;
}

/**
 * La fila del cliente en la hoja de Drive: si algo falló, se ve aquí y se
 * reintenta. Sin enlaces a Drive: el móvil de cada uno está con su cuenta de
 * Google, no con la de la empresa, y el enlace no le abriría nada.
 */
function agCarpetaHTML(c) {
  if (!puedeCitar()) return '';
  const d = V.cliDrive && V.cliDrive.id === c.id ? V.cliDrive : null;
  const trabajando = d && d.estado === 'subiendo';
  if (!d && c.drive_at) return '';          // ya está apuntado y sin novedad
  return `<div class="card" style="margin-bottom:18px">
    <div class="row g8"><span class="lbl">Hoja de clientes</span></div>
    ${trabajando ? '<div class="sub" style="margin-top:7px;font-size:13px">Apuntándolo…</div>' : ''}
    ${d && d.estado === 'ok' && !d.aviso ? `<div class="sub" style="margin-top:7px;font-size:13px">✓ Apuntado${d.fila ? ' en la fila ' + d.fila : ''}.</div>` : ''}
    ${d && d.estado === 'error' ? `<div class="sub" style="margin-top:7px;font-size:13px;color:var(--rojo)">No se pudo apuntar: ${esc(d.error || '')}</div>` : ''}
    ${d && d.aviso ? `<div class="sub" style="margin-top:7px;font-size:13px;color:var(--rojo)">Falló: ${esc(d.aviso)}</div>` : ''}
    ${!d && !c.drive_at ? '<div class="sub" style="margin-top:7px;font-size:13px">Todavía no está en la hoja.</div>' : ''}
    ${!trabajando ? `<button class="pill" data-a="cliDriveReintentar" data-id="${c.id}" style="margin-top:10px;padding:11px;width:100%;text-align:center">${c.drive_at ? 'Repasar su fila' : 'Apuntarlo en la hoja'}</button>` : ''}
  </div>`;
}

  const citas = V.agenda.citas.filter((x) => x.cliente_id === c.id);
  const items = [
    ...citas.map((x) => ({ t: x.inicio || x.created_at || '', tipo: 'cita', x })),
    ...(c.visitas || []).map((v) => ({ t: v.fecha_visita ? v.fecha_visita + 'T12:00' : '', tipo: 'visita', v })),

  const hito = (it) => {
    if (it.tipo === 'cita') {
      const x = it.x;
      const futura = x.estado === 'pendiente';
      const clase = futura ? (x.inicio && agDiaDe(x.inicio) === hoy ? 'ahora' : '') : 'hecho';

      <div class="row g8"><span class="dot" style="width:8px;height:8px;background:${est[0]}"></span><span class="lbl">${est[1]}${v.codigo ? ' · ' + esc(v.codigo) : ''}</span></div>
      <div style="font:600 15px/1.25 var(--sans);margin-top:7px">Visita${v.fecha_visita ? ' del ' + fechaCorta(v.fecha_visita + 'T12:00') : ''}</div>
    </div></div>`;
  };

  return `<div class="hdr-dark">
    <div class="volver" data-a="ag_volver" data-v="clientes">‹ Clientes</div>
    <div style="font:600 27px/1.1 var(--cond)">${esc(c.nombre)}</div>
    <div class="sub" style="color:rgba(255,255,255,.5);margin-top:6px">${esc([agTipoNombre(c), c.poblacion, c.telefono].filter(Boolean).join(' · '))}</div>
    ${(c.direccion || c.poblacion) || c.telefono ? `<div class="ag-acciones" style="justify-content:flex-start;gap:26px">
      ${accionLlamar(c.telefono)}
      ${accionComoLlegar([c.direccion, c.poblacion].filter(Boolean).join(', '))}
    </div>` : ''}
    ${puedeCitar() ? `<div class="row g8" style="margin-top:14px">
      <button class="pill pill-verde grow" data-a="ag_nuevaCita" data-id="${c.id}" style="padding:13px">+ Nueva cita</button>
      <button class="pill grow" data-a="ag_editarCliente" data-id="${c.id}" style="padding:13px;background:rgba(255,255,255,.12);color:#fff">Editar</button>
    </div>` : ''}
  </div>
  <div class="scroll pad sin-marca pb-nav">
    ${c.email || c.nif || c.direccion || c.nota ? `<div class="card" style="padding:6px 15px;margin-bottom:18px">
      ${c.telefono ? `<div class="fila"><span class="k">Teléfono</span><span class="v"><a href="tel:${esc(String(c.telefono).replace(/[^\d+]/g, ''))}">${esc(c.telefono)}</a></span></div>` : ''}
      ${c.email ? `<div class="fila"><span class="k">Email</span><span class="v">${esc(c.email)}</span></div>` : ''}
      ${c.nif ? `<div class="fila"><span class="k">NIF</span><span class="v">${esc(c.nif)}</span></div>` : ''}
      ${c.direccion ? `<div class="fila"><span class="k">Dirección</span><span class="v">${esc([c.direccion, c.poblacion].filter(Boolean).join(', '))}</span></div>` : ''}
      ${c.nota ? `<div class="fila"><span class="k">Nota</span><span class="v">${esc(c.nota)}</span></div>` : ''}
    </div>` : ''}
    ${agCarpetaHTML(c)}
    ${agCRMHTML(c)}
    <div class="lbl" style="margin-bottom:12px">Historial</div>
    <div class="ag-linea">
      ${items.map(hito).join('')}
      <div class="ag-hito hecho"><div class="card" style="padding:12px 15px">
        <div class="lbl">Alta${c.created_at ? ' · ' + fechaCorta(c.created_at) : ''}</div>
        ${c.origen ? `<div class="tiny" style="margin-top:5px">${esc((AG_ORIGENES.find((o) => o[0] === c.origen) || [null, c.origen])[1])}</div>` : ''}
      </div></div>
    </div>
    ${puedeCitar() ? `<button class="btn btn-gris" data-a="ag_borrarCliente" data-id="${c.id}" style="margin-top:22px;border-radius:99px;color:var(--rojo)">Borrar cliente</button>` : ''}
  </div>`;
}


/* ---------- otra visita con una a medias ---------- */
// Antes se bloqueaba. Ahora la de medias se guarda como borrador en Supabase
// (con sus fotos) y se empieza la nueva. Sin cobertura no se puede guardar.
A.visitaAparcar = async () => {
  const s = V.sheet;
  if (!s || s.tipo !== 'visitaAMedias' || s.busy) return;
  const luego = () => { V.sheet = null; return s.citaId ? agEmpezarVisita(s.citaId) : A.nuevaVisita(); };
  const b = leerBorradorVisita();
  if (!b || !b.draft) return luego();
  if (!navigator.onLine) { avisar('Sin conexión: la visita a medias no se puede guardar ahora. Síguela o descártala.'); return; }
  s.busy = true; render();
  V.visitaDraft = b.draft; V.visitaFichas = b.fichas || {}; V.visitaFotos = b.fotos || {};
  V.visitaAdjuntos = b.adjuntos || []; V.visitaPaso = b.paso || 1; V.visitaCat = null;
  await A.guardarVisita(false, luego);
  if (V.sheet === s) { s.busy = false; render(); }   // falló: la hoja sigue abierta
};
A.visitaSeguirMedias = () => { V.sheet = null; A.seguirBorrador(); };

/* --- nav --- */
function nav(v) {
  const items = esPresupuestos()
    ? [['agenda', 'Agenda', '5px'], ['clientes', 'Clientes', '3px'], ['presupuestos', 'Presupuestos', '2px'], ['material', 'Material', '4px'], ['ajustes', 'Perfil', '99px']]
    : esAdmin()
    ? [['hoy', 'Hoy', '99px'], ['empleados', 'Empleados', '4px'], ['obras', 'Obras', '5px'], ['partes', 'Partes', '3px'], ['horas', 'Horas', '2px'], ['agenda', 'Citas', '6px'], ['ajustes', 'Ajustes', '99px']]
    : puedeCrear()
    ? [['hoy', 'Hoy', '99px'], ['obras', 'Obras', '5px'], ['partes', 'Partes', '3px'], ['horas', 'Horas', '2px'], ['material', 'Material', '4px'], ['ajustes', 'Ajustes', '99px']]
    : [['hoy', 'Hoy', '99px'], ['obras', 'Obras', '5px'], ['horas', 'Horas', '2px'], ['material', 'Material', '4px'], ['ajustes', 'Perfil', '99px']];
  const act = (id) => v === id
    || (id === 'obras' && v === 'obra')
    || (id === 'horas' && ['imputar', 'revisarImp', 'resumenImp'].includes(v))
    || (id === 'ajustes' && v === 'errores')
    || (id === 'empleados' && (v === 'empleado' || v === 'planilla'))
    || (id === 'visitas' && v === 'visita')
    || (id === 'presupuestos' && ['presuNuevo', 'presupuestoVer'].includes(v))
    || (id === 'hoy' && esAdmin() && ['presupuestos', 'presuNuevo', 'presupuestoVer'].includes(v))
    || (id === 'agenda' && (v === 'citaVer' || (!esPresupuestos() && (v === 'clientes' || v === 'clienteVer'))))
    || (id === 'clientes' && ['clienteVer', 'visitas', 'visita'].includes(v));
  return `<div class="nav">${items.map(([id, l, r]) => `<div class="${act(id) ? 'on' : ''}" data-a="ir" data-v="${id}"><i style="border-radius:${r}"></i><span>${l}</span></div>`).join('')}</div>`;
}

/* --- toast --- */
let toastT;
function toast(msg, tipo) {
  const old = document.querySelector('.toast'); if (old) old.remove();
  const err = tipo === 'err';
  const d = document.createElement('div');
  d.className = 'toast' + (err ? ' err shake' : '');
  d.textContent = msg;
  document.body.appendChild(d);
  clearTimeout(toastT); toastT = setTimeout(() => d.remove(), err ? 4200 : 2600);
}
// Avisos que BLOQUEAN algo (falta un dato, no hay conexión, falló el guardado):
// se ven en rojo y duran más. Los mensajes de "ha ido bien" siguen con toast().
function avisar(msg) { toast(msg, 'err'); }

document.addEventListener('input', (e) => {
  const t = e.target;
  const f = t.dataset.f, fm = t.dataset.fm;
  if (fm) {
    const [id, k] = fm.split(':');
    const m = V.draft.mats.find((x) => x.id === id); if (m) m[k] = t.value;
    return;
  }
  if (!f) return;
  if (f.startsWith('vf')) return A.vf(f, t.dataset, t.value);
  if (f === 'ag_buscar') { V.agenda.buscar = t.value; const box = document.getElementById('clientes-lista'); if (box) box.innerHTML = clientesListaHTML(); return; }
  if (f === 'ag_cli') { if (V.clienteDraft) V.clienteDraft[t.dataset.k] = t.value; return; }
  if (f === 'ag_cita') { if (V.citaDraft) V.citaDraft[t.dataset.k] = t.value; return; }
  if (f === 'ag_citaFecha') { if (V.citaDraft) { sincronizarRuedas(); V.citaDraft.dia = t.value || null; render(); } return; }
  if (f === 'loginNombre') { V.loginNombre = t.value; return; }
  if (f === 'presuCliente') { if (V.suelto) { V.suelto.cliente = t.value; V.suelto.clienteId = null; render(); } return; }
  if (f === 'presuLinea') { A.presuLineaCampo(t.dataset.id, t.dataset.k, t.value); return; }
  if (f === 'presuNueva') { A.presuNuevaCampo(t.dataset.k, t.value); return; }
  if (f === 'presuEditDto') { A.presuEditDto(t.value); return; }
  if (f === 'presuCampo') {
    const k = t.dataset.k;
    if (['equipos', 'circuitos', 'retirar', 'retirar_ext'].includes(k)) t.value = t.value.replace(/\D/g, '').slice(0, 2);
    if (k === 'paneles' || k === 'wp') t.value = t.value.replace(/\D/g, '').slice(0, k === 'wp' ? 4 : 3);
    A.presuSueltoCampo(k, t.value);
    // Más o menos equipos de aire: aparecen o desaparecen sus filas.

  if (f === 'docNota') { if (V.sheet) V.sheet.nota = t.value; return; }
  if (f === 'impFecha') return A.impFecha(t.value);
  if (f === 'parteFecha') return A.parteFecha(t.value);
  if (f === 'empNombre') { A.empCampo('nombre', t.value); return; }
  if (f === 'empEmail') { A.empCampo('email', t.value); return; }

  if (f === 'envPara') { if (V.sheet) V.sheet.para = t.value; return; }

  if (f === 'impNota') { const l = (V.impDraft || [])[Number(t.dataset.i)]; if (l) l.nota = t.value; return; }
  if (f === 'impGrupoNota') { const l = (V.impGrupoLineas || [])[Number(t.dataset.i)]; if (l) l.nota = t.value; return; }
  if (f === 'envCopia') { if (V.sheet) V.sheet.copia = t.value; return; }
  if (f === 'empPin') { t.value = t.value.replace(/\D/g, '').slice(0, 4); A.empCampo('pin', t.value); return; }
  if (f === 'ingresoPin') { t.value = t.value.replace(/\D/g, '').slice(0, 4); V.sheet.val = t.value; return; }

    if (!V.suelto) return;

  if (f === 'sheetVal') { V.sheet.val = t.value.replace(/\D/g, '').slice(0, 4); return; }
  if (f === 'sheetNombre') { V.sheet.nombre = t.value; return; }

  if (f === 'pinActual') { V.sheet.actual = t.value.replace(/\D/g, '').slice(0, 4); return; }

  if (f === 'corrEntrada') { V.sheet.entrada = t.value; return; }
  if (f === 'corrSalida') { V.sheet.salida = t.value; return; }
  if (['empresa', 'cif', 'emailCopia'].includes(f)) { S[f] = t.value; save(); return; }
  if (V.view === 'alta') { V.draft[f] = t.value; return; }
  if (V.draft) V.draft[f] = t.value;
});

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  /* ---------- la actualización, con cartel ----------------------------------
   * La gente no cierra nunca la app, así que cada móvil se quedaba con una
   * versión distinta. Ahora, cuando hay una versión nueva descargada, sale un
   * cartel que tapa la pantalla con un solo botón, «Actualizar», y no se puede
   * seguir hasta pulsarlo. Se busca versión nueva al abrir, cada vez que la app
   * vuelve al frente y cada media hora.
   * ------------------------------------------------------------------------ */
  let regSW = null;
  let esperando = null;      // el service worker nuevo, listo para mandar
  let recargada = false;
  const cartelActualizar = () => {
    if (document.getElementById('actualizar')) return;
    const div = document.createElement('div');
    div.id = 'actualizar';
    div.innerHTML = `<div>
      <img src="logo-blanco.png" alt="" style="height:40px;margin-bottom:22px;opacity:.9">
      <div style="font:700 28px/1.1 var(--cond);color:#fff">Hay una versión nueva</div>
      <div style="font:400 14px/1.5 var(--sans);color:rgba(255,255,255,.7);margin-top:10px">La app se ha actualizado. Para seguir hace falta cargarla; tarda un segundo y no se pierde nada.</div>
      <button class="btn btn-verde" id="actualizar-btn" style="margin-top:26px">Actualizar</button>
      <div class="tiny" style="color:rgba(255,255,255,.4);margin-top:16px">Tienes la versión ${APP_VERSION}</div>
    </div>`;
    document.body.appendChild(div);
    document.getElementById('actualizar-btn').addEventListener('click', () => {
      const b = document.getElementById('actualizar-btn');
      b.disabled = true; b.textContent = 'Actualizando…';
      if (esperando) esperando.postMessage({ tipo: 'activar' });
      // Si por lo que sea no llega el controllerchange, se recarga igual.
      setTimeout(() => { if (!recargada) { recargada = true; location.reload(); } }, 4000);
    });
  };
  const vigilar = (sw) => {
    if (!sw) return;
    if (sw.state === 'installed') { esperando = sw; cartelActualizar(); return; }
    sw.addEventListener('statechange', () => {
      if (sw.state === 'installed') { esperando = sw; cartelActualizar(); }
    });
  };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (recargada) return;
    recargada = true;
    location.reload();
  });
  const buscar = () => { if (regSW && navigator.onLine) regSW.update().catch(() => {}); };
  // updateViaCache: 'none' → al buscar si hay sw.js nuevo no se usa la caché
  // del navegador. GitHub Pages lo sirve con max-age=600 y, sin esto, la
  // comprobación podía tardar hasta 10 minutos en enterarse.
  window.addEventListener('load', () => navigator.serviceWorker
    .register('sw.js', { updateViaCache: 'none' })
    .then((reg) => {
      regSW = reg;
      // Ya había una esperando de otra apertura: cartel al momento.
      if (reg.waiting && navigator.serviceWorker.controller) vigilar(reg.waiting);
      reg.addEventListener('updatefound', () => { if (navigator.serviceWorker.controller) vigilar(reg.installing); });
      buscar();
    })
    .catch(() => {}));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') buscar(); });
  setInterval(buscar, 30 * 60 * 1000);
}

restaurarSesion();
