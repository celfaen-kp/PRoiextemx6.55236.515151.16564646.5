<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Presupuesto · Sysefen</title>
<link rel="icon" href="icono-192.png">
<style>
body{margin:0;background:#f5f4ef;font-family:Arial,Helvetica,sans-serif;color:#14170f}
.w{max-width:720px;margin:0 auto;padding:22px 14px 60px}
.c{background:#fff;border-radius:18px;padding:22px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(20,23,15,.06)}
h1{font-size:24px;margin:0 0 6px}h2{font-size:15px;margin:18px 0 8px;color:#555;text-transform:uppercase;letter-spacing:.06em}
.sub{color:#666;font-size:14px}.l{padding:10px 0;border-bottom:1px solid #eee;overflow:hidden}.l .n{font-weight:600;font-size:15px}.l .d{color:#555;font-size:13px;margin-top:3px;white-space:pre-wrap}
.l .q{color:#777;font-size:12px;margin-top:4px}.l .p{float:right;font-weight:600;font-size:15px;margin-left:12px}
.t{display:flex;justify-content:space-between;padding:6px 0;font-size:15px}.t.big{font-size:21px;font-weight:700;border-top:2px solid #14170f;padding-top:12px;margin-top:8px}
.inp{width:100%;box-sizing:border-box;padding:13px 14px;border:1.5px solid #d9d8d2;border-radius:12px;font-size:16px;margin-top:8px;font-family:inherit}
.firma{position:relative;margin-top:10px;border:1.5px dashed #b9b8b1;border-radius:14px;background:#fafaf7;height:190px}
.firma canvas{width:100%;height:100%;display:block;touch-action:none}
.firma .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#999;pointer-events:none;font-size:14px}
.btn{display:block;width:100%;padding:16px;border:0;border-radius:14px;background:#206028;color:#fff;font-size:17px;font-weight:600;margin-top:16px;cursor:pointer;font-family:inherit}
.btn[disabled]{opacity:.5}.lnk{display:inline-block;margin-top:10px;color:#164a1d;font-weight:600}
.ok{background:#eaf3ec;border:1.5px solid #206028;border-radius:14px;padding:16px;font-size:15px}
.err{color:#a8402a;font-size:14px;margin-top:10px}
small.cond{display:block;margin-top:14px;color:#666;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="w" id="app"><div class="c"><img src="logo-email.png" alt="Sysefen" style="height:40px"><p class="sub" style="margin-top:16px">Cargando el presupuesto…</p></div></div>
<script>
(function () {
  var FUNC = 'https://pcftuxqgzeacladtmaqx.supabase.co/functions/v1/presupuesto-cliente';
  var t = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var eur = function (n) { return (Number(n) || 0).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €'; };
  var fecha = function (iso) { return iso ? new Date(iso).toLocaleDateString('es-ES', { day: 'numeric', month: 'long', year: 'numeric' }) : ''; };
  function fallo(msg) { app.innerHTML = '<div class="c"><img src="logo-email.png" alt="Sysefen" style="height:40px"><p class="sub" style="margin-top:16px">' + esc(msg) + '</p></div>'; }
  if (!t) { fallo('Enlace no válido.'); return; }
  fetch(FUNC + '?t=' + encodeURIComponent(t) + '&json=1').then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
    if (!x.ok) throw new Error(x.j.error || 'Este enlace ya no está disponible.');
    pinta(x.j);
  }).catch(function (e) { fallo(e.message); });

  function pinta(d) {
    var p = d.presupuesto, lineas = d.lineas || [], firmado = !!p.firmado_at;
    var secciones = [];
    lineas.forEach(function (l) { var n = l.seccion || 'Presupuesto'; var s = null; for (var i = 0; i < secciones.length; i++) if (secciones[i].nombre === n) s = secciones[i]; if (!s) { s = { nombre: n, lineas: [] }; secciones.push(s); } s.lineas.push(l); });
    var h = '<div class="c"><img src="logo-email.png" alt="Sysefen" style="height:40px"><h1 style="margin-top:14px">' + esc(p.titulo) + '</h1>'
      + '<div class="sub">' + esc(d.cliente || '') + (p.tl_numero ? ' · nº ' + esc(p.tl_numero) : '') + (p.enviado_correo_at ? ' · enviado el ' + fecha(p.enviado_correo_at) : '') + (d.vence ? ' · válido hasta el ' + fecha(d.vence) : '') + '</div>'
      + (d.pdf_url ? '<a class="lnk" href="' + esc(d.pdf_url) + '" target="_blank" rel="noopener">Descargar el PDF' + (firmado ? ' firmado' : '') + '</a>' : '') + '</div>';
    if (firmado) h += '<div class="c"><div class="ok">✓ Este presupuesto ya está aceptado y firmado por <b>' + esc(p.firma_nombre) + '</b> el ' + fecha(p.firmado_at) + '. Gracias por confiar en Sysefen.</div></div>';
    h += '<div class="c">' + secciones.map(function (s) { return '<h2>' + esc(s.nombre) + '</h2>' + s.lineas.map(function (l) { return '<div class="l"><span class="p">' + eur(l.precio_venta) + '</span><div class="n">' + esc(l.descripcion) + '</div>' + (l.detalle_tecnico ? '<div class="d">' + esc(l.detalle_tecnico) + '</div>' : '') + '<div class="q">' + esc(l.cantidad) + ' ' + esc(l.unidad || 'ud') + ' × ' + eur(l.precio_tarifa) + (Number(l.dto_linea_pct) ? ' · −' + esc(l.dto_linea_pct) + ' %' : '') + '</div></div>'; }).join(''); }).join('')
      + '<div style="margin-top:14px">' + (d.totales.dto_global_pct ? '<div class="t"><span>Suma</span><span>' + eur(d.totales.bruto) + '</span></div><div class="t"><span>Descuento ' + esc(d.totales.dto_global_pct) + ' %</span><span>−' + eur(d.totales.bruto - d.totales.base) + '</span></div>' : '')
      + '<div class="t"><span>Base imponible</span><span>' + eur(d.totales.base) + '</span></div><div class="t"><span>IVA 21 %</span><span>' + eur(d.totales.iva) + '</span></div><div class="t big"><span>Total</span><span>' + eur(d.totales.total) + '</span></div></div>'
      + '<small class="cond">' + esc(d.condiciones || '') + '</small></div>';
    if (!firmado) h += '<div class="c" id="aceptar"><h1 style="font-size:20px">Aceptar y firmar</h1><div class="sub">Si está conforme, escriba su nombre, firme con el dedo o el ratón y pulse el botón. Recibirá copia por correo y nosotros el aviso.</div>'
      + '<input class="inp" id="nombre" placeholder="Nombre y apellidos" autocomplete="name"><input class="inp" id="dni" placeholder="DNI / NIE (opcional)">'
      + '<div class="firma"><canvas id="cv"></canvas><div class="ph" id="ph">Firme aquí</div></div><a class="lnk" href="#" id="borrar" style="font-weight:400;font-size:13px">Borrar la firma</a>'
      + '<label style="display:block;margin-top:14px;font-size:14px"><input type="checkbox" id="acepto"> He leído el presupuesto y acepto sus condiciones.</label>'
      + '<button class="btn" id="btn">Firmar y aceptar el presupuesto</button><div class="err" id="err"></div></div>';
    app.innerHTML = h;
    if (firmado) return;
    var cv = document.getElementById('cv'), ctx = cv.getContext('2d'), ph = document.getElementById('ph'), hay = false, dib = false;
    function tam() { var r = cv.getBoundingClientRect(); cv.width = Math.round(r.width * 2); cv.height = Math.round(r.height * 2); ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#14170f'; }
    tam(); window.addEventListener('resize', tam);
    function pos(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * (cv.width / r.width), (e.clientY - r.top) * (cv.height / r.height)]; }
    cv.addEventListener('pointerdown', function (e) { e.preventDefault(); dib = true; cv.setPointerCapture(e.pointerId); var q = pos(e); ctx.beginPath(); ctx.moveTo(q[0], q[1]); });
    cv.addEventListener('pointermove', function (e) { if (!dib) return; e.preventDefault(); var q = pos(e); ctx.lineTo(q[0], q[1]); ctx.stroke(); hay = true; ph.style.display = 'none'; });
    ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { dib = false; }); });
    document.getElementById('borrar').addEventListener('click', function (e) { e.preventDefault(); ctx.clearRect(0, 0, cv.width, cv.height); hay = false; ph.style.display = ''; });
    document.getElementById('btn').addEventListener('click', function () {
      var err = document.getElementById('err'); err.textContent = '';
      var nombre = document.getElementById('nombre').value.trim();
      if (nombre.length < 3) { err.textContent = 'Escriba su nombre.'; return; }
      if (!hay) { err.textContent = 'Falta la firma.'; return; }
      if (!document.getElementById('acepto').checked) { err.textContent = 'Marque la casilla de aceptación.'; return; }
      var b = document.getElementById('btn'); b.disabled = true; b.textContent = 'Enviando…';
      fetch(FUNC, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ accion: 'firmar', t: t, nombre: nombre, dni: document.getElementById('dni').value.trim(), firma: cv.toDataURL('image/png') }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) { if (!x.ok) throw new Error(x.j.error || 'error'); document.getElementById('aceptar').innerHTML = '<div class="ok">✓ Presupuesto aceptado y firmado. Gracias, ' + esc(nombre) + '. Le hemos enviado copia por correo y nos pondremos en contacto para empezar.</div>'; window.scrollTo(0, 0); })
        .catch(function (e) { err.textContent = 'No se pudo enviar: ' + e.message; b.disabled = false; b.textContent = 'Firmar y aceptar el presupuesto'; });
    });
  }
})();
</script>
</body>
</html>
